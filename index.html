"tip":{"cat":"Move","title":"Walk a few minutes after you eat","mins":"2–10 min","why":"A 2022 meta-analysis of seven crossover trials found that breaking up sitting with short bouts of light walking lowered post-meal blood glucose and insulin compared with sitting still, and walking worked better than standing. Your muscles pull glucose out of the blood when they contract, so even an easy stroll blunts the spike.","how":["After lunch or dinner, get up within about 15 minutes and walk at an easy pace for at least 2 minutes, ideally 5 to 10.","On a long sitting day, such as tomorrow's flight to Dallas, stand up and walk the aisle or gate area every 30 minutes or so when you can.","Keep it light: conversational pace is enough, no need to break a sweat."],"src":"Buffey et al., Sports Medicine (2022)","url":"https://www.ncbi.nlm.nih.gov/pmc/articles/PMC9325803/","ask":"How much does a short walk after a meal actually change my glucose curve, and is it worth wearing a CGM for two weeks to see my own response?"},

"news":[{"id":"n1","tag":"Robotics","title":"DeepSeek to lead seed round for robot AI startup Winverse at about $400 million valuation","blurb":"Bloomberg reports DeepSeek has agreed to lead a seed round worth tens of millions of dollars in Winverse AI, a months-old startup building foundation models for robots, valuing it at about $400 million; Meituan's Long-Z is also reported to be taking part. Winverse was founded this year by Hu Han, who led vision-language and embodied foundation model work at Tencent, and terms were not final as of the report.","src":"Bloomberg","domain":"bloomberg.com","date":"2026-10-12","url":"https://bloomberg.com/news/articles/2026-10-12/deepseek-backs-ex-tencent-ai-scientist-s-400-million-robot-lab","ask":"What does it mean for US humanoid companies like Figure if Chinese frontier LLM labs start funding and supplying robot foundation models directly?"},{"id":"n2","tag":"Robotics","title":"JAKA debuts Kargo50 heavy-duty wheeled humanoid at Shanghai industry fair","blurb":"At the 26th China International Industry Fair, which opened in Shanghai on Oct. 12, JAKA unveiled the Kargo50, a wheeled humanoid for moving totes and materials between workstations, alongside a 50 kg payload cobot called the Zu50. JAKA has not released payload figures or detailed specs for the Kargo50.","src":"Interesting Engineering","domain":"interestingengineering.com","date":"2026-10-12","url":"https://interestingengineering.com/ai-robotics/china-wheeled-humanoid-robot-arm-factory-automation","ask":"For factory material handling, when does a wheeled-base humanoid beat a legged one like Figure 03, and when does legged mobility actually pay for itself?"},{"id":"n3","tag":"Robotics","title":"Self-driving trucks clear a federal roadblock over warning triangles","blurb":"TechCrunch's mobility newsletter recaps FMCSA's five-year exemption letting Level 4 autonomous trucks use cab-mounted warning beacons instead of placing reflective triangles after a breakdown, a rule that assumed a human driver on board. Aurora secured the exemption, and Kodiak AI has said it will operate under it.","src":"TechCrunch","domain":"techcrunch.com","date":"2026-10-11","url":"https://techcrunch.com/2026/10/11/techcrunch-mobility-a-roadblock-clears-for-self-driving-trucks/","ask":"Which workplace safety rules written around a human worker would humanoid robots need exemptions or new standards for, and what can the beacon fight teach us?"},{"id":"n4","tag":"AI","title":"Meta releases its first frontier model, Muse Wonder","blurb":"Meta Superintelligence Labs released Muse Wonder and Muse Wonder Full, which Meta calls its first frontier models; Wonder is available through Meta's API, while Wonder Full is limited to Muse Code subscribers. Neither model has downloadable weights.","src":"TechCrunch","domain":"techcrunch.com","date":"2026-10-12","url":"https://techcrunch.com/2026/10/12/meta-releases-its-first-frontier-model-muse-wonder/","ask":"Meta has moved from open weights to closed frontier models. What does that mean for robotics teams that built on open Llama-style backbones for their VLA models?"},{"id":"n5","tag":"AI","title":"AI's third-party safety evaluators move into the spotlight","blurb":"CNBC examines the small group of outside evaluators, including METR, Apollo Research and Transluce, that now test frontier models while the federal government resists formal oversight. METR says it raised about $71 million in commitments over six months, and the AI Evaluator Forum has asked for transparency, protection from retaliation and access equal to labs' own privileged staff.","src":"CNBC","domain":"cnbc.com","date":"2026-10-11","url":"https://cnbc.com/2026/10/11/ais-quiet-safety-gatekeepers-are-stepping-into-the-spotlight.html","ask":"What would an independent third-party evaluation regime for humanoid robots in homes and factories look like, compared with what METR does for LLMs?"},{"id":"n6","tag":"AI","title":"IMF chief calls AI a 'slow-moving tsunami' for jobs and tax revenue","blurb":"At the IMF and World Bank annual meetings in Bangkok, Kristalina Georgieva said about 40% of jobs worldwide will eventually be augmented, downgraded or eliminated by AI, rising to about 60% in advanced economies. She singled out young people entering the workforce and warned that a shift from labor to capital would strain how governments raise taxes.","src":"CNBC","domain":"cnbc.com","date":"2026-10-12","url":"https://cnbc.com/2026/10/12/imf-world-bank-ai-jobs-inflation-.html","ask":"IMF exposure estimates focus on knowledge work. How would those numbers change if general-purpose humanoids reach reliable deployment in warehouses and factories by 2030?"},{"id":"n7","tag":"AI","title":"Intel and Broadcom CEOs say capital may be AI's biggest constraint","blurb":"Speaking at the DBS Asia Future Forward Conference in Singapore, Broadcom CEO Hock Tan said capital could become a bigger limit on AI buildout than chips, memory or power. Intel CEO Lip-Bu Tan pointed to the cost of capital and said investors will eventually want to see a return on AI spending.","src":"CNBC","domain":"cnbc.com","date":"2026-10-12","url":"https://www.cnbc.com/2026/10/12/intel-broadcom-ceos-warn-capital-crunch-could-become-ai-bottleneck.html","ask":"If capital tightens for AI infrastructure, how would that hit capital-heavy humanoid makers building their own factories versus software-only AI labs?"},{"id":"n8","tag":"Tech","title":"Apple's HomeView smart home hub expected Tuesday, shipping in November","blurb":"Citing Bloomberg's Mark Gurman, 9to5Mac reports Apple's HomeView hub will be a Siri-driven display with an A18 chip, offered as a countertop model in four colors and a wall-mounted version, and expected to ship in mid-November. It reportedly will not have App Store access, and Apple had not confirmed the product.","src":"9to5Mac","domain":"9to5mac.com","date":"2026-10-11","url":"https://9to5mac.com/2026/10/11/apple-homeview-home-hub-four-colors-november/","ask":"Could a home hub like HomeView become the coordination layer that a household humanoid plugs into, and what would Figure want from that interface?"},{"id":"n9","tag":"Tech","title":"WindBorne wins Air Force contract for its weather balloon data","blurb":"The US Air Force will buy atmospheric data from WindBorne's balloon fleet under a no-bid contract worth up to $49 million, paying only for the data it orders; orders so far total $1.7 million. WindBorne, which has about 700 balloons aloft, also feeds the data into its own AI weather model.","src":"TechCrunch","domain":"techcrunch.com","date":"2026-10-12","url":"https://techcrunch.com/2026/10/12/windborne-wins-a-hefty-us-air-force-contract-for-its-balloon-data/","ask":"WindBorne sells its proprietary sensor data and also trains its own model on it. Could a humanoid fleet's real-world data become a business of its own in the same way?"}],

"different":{"title":"The volcano that gave us Frankenstein","blurb":"In April 1815, Mount Tambora in Indonesia erupted in the largest eruption in recorded history, and its sulfate haze cooled the Northern Hemisphere enough that 1816 became the \"year without a summer,\" with June snow in New England and failed harvests across Europe. Kept indoors at Lake Geneva by that cold, rainy summer, Lord Byron's guests held a ghost-story contest, and 18-year-old Mary Shelley began the story that became Frankenstein.","url":"https://scied.ucar.edu/learning-zone/how-climate-works/mount-tambora-and-year-without-summer","ask":"How does sulfur from a volcano cool the whole planet for a year, and how did Tambora's effects compare with Pinatubo in 1991?"},

ate":"2026-10-04","word":"Halcyon","pron":"HAL-see-un","pos":"adjective","def":"Idyllically calm and peaceful, often said of a happy time in the past.","ex":"Those halcyon summer weekends still come up whenever the group chat wakes up.","cards":[{"f":"Root","b":"Greek alkyon, a bird said to calm the sea"},{"f":"Synonym","b":"serene"},{"f":"Opposite","b":"turbulent"}]},{"date":"2026-10-03","word":"Quotidian","pron":"kwoh-TID-ee-un","pos":"adjective","def":"Ordinary or everyday; part of the daily routine.","ex":"The quotidian rhythm of coffee, commute and stand-up had become oddly comforting.","cards":[{"f":"Root","b":"Latin quotidie, every day"},{"f":"Synonym","b":"mundane"},{"f":"Opposite","b":"extraordinary"}]}],

ore"},{"es":"así es","en":"that's how it is"}]},{"date":"2026-10-03","phrase":"Al rato","pron":"ahl RAH-toh","reg":"Mexico · everyday","meaning":"In a bit. Later.","note":"Flexible Mexican time: it could mean ten minutes or tonight.","cards":[{"es":"orita","en":"right now-ish"},{"es":"nos vemos","en":"see you"},{"es":"luego","en":"later"}]}],
