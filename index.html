<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
<title>Stinky's Daily</title>
<script>
/* Set theme-color before first paint so the iOS status bar band matches */
(function(){try{
 var dark=false;try{var t=JSON.parse(localStorage.getItem("sd-theme"));if(t==="dark")dark=true;else if(t!=="light")dark=matchMedia("(prefers-color-scheme:dark)").matches}catch(e){dark=matchMedia("(prefers-color-scheme:dark)").matches}
 var c=dark?"#000000":"#F1F2F4";
 document.documentElement.style.background=c;
 var ms=document.querySelectorAll('meta[name="theme-color"]');for(var i=0;i<ms.length;i++)ms[i].content=c;
}catch(e){}})();
</script>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Display","Inter","Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style","Charter",Georgia,serif;
  --bg:#F1F2F4; --surface:#FFFFFF; --raise:#F7F8FA;
  --fill:rgba(20,24,32,.055); --fill-2:rgba(20,24,32,.1);
  --ink:#000000; --ink-2:#565B63; --ink-3:#8F949C; --line:rgba(0,0,0,.075);
  --link:#2B5EF0; --up:#0A9455; --down:#DD3B35;
  --ma1:#3F6BFF; --ma2:#9B4DFF; --band:rgba(247,147,26,.16); --band-line:#F7931A;
  --vocab:#4C46D6; --vocab-soft:rgba(76,70,214,.1);
  --es:#D4331F; --es-soft:rgba(212,51,31,.09);
  --seg-on:#FFFFFF; --nav:rgba(241,242,244,.92);
  --shadow:0 1px 2px rgba(16,20,28,.04),0 12px 32px -20px rgba(16,20,28,.22);
  --g:16px;
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#121315; --raise:#1A1B1E;
  --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.13);
  --ink:#FFFFFF; --ink-2:#A6AAB1; --ink-3:#6F737B; --line:rgba(255,255,255,.08);
  --link:#7A9DFF; --up:#2FCB7C; --down:#FF5A52;
  --ma1:#6F92FF; --ma2:#B985FF; --band:rgba(247,147,26,.2);
  --vocab:#9C97FF; --vocab-soft:rgba(156,151,255,.14);
  --es:#FF7A62; --es-soft:rgba(255,122,98,.13);
  --seg-on:#2E2F33; --nav:rgba(0,0,0,.84); --shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#121315; --raise:#1A1B1E;
    --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.13);
    --ink:#FFFFFF; --ink-2:#A6AAB1; --ink-3:#6F737B; --line:rgba(255,255,255,.08);
    --link:#7A9DFF; --up:#2FCB7C; --down:#FF5A52;
    --ma1:#6F92FF; --ma2:#B985FF; --band:rgba(247,147,26,.2);
    --vocab:#9C97FF; --vocab-soft:rgba(156,151,255,.14);
    --es:#FF7A62; --es-soft:rgba(255,122,98,.13);
    --seg-on:#2E2F33; --nav:rgba(0,0,0,.84); --shadow:none;
  }
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.4;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
img{display:block}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:12px}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.press{transition:transform .12s ease}
.press:active{transform:scale(.975)}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:30;pointer-events:none}
.up{color:var(--up)}.down{color:var(--down)}
.cl-logo{width:16px;height:16px;border-radius:4px;flex:0 0 auto}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding:max(calc(env(safe-area-inset-top) + 26px),44px) var(--g) 0}
.hero-top{display:flex;align-items:center;justify-content:space-between;min-height:38px}
.hero-date{font-size:15px;font-weight:600;color:var(--ink-2)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.greet{font-family:var(--display);font-size:42px;line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:6px 0 18px}

.sky{position:relative;border-radius:28px;padding:18px 18px 10px;color:#fff;overflow:hidden;isolation:isolate;background:var(--sky,#2F6FD6)}
.sky::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(96,106,124,.42);opacity:0;transition:opacity .4s}
.sky.overcast::after{opacity:1}
.sky[data-phase="night"]{--sky:linear-gradient(162deg,#0D1A3B 0%,#1E2E61 58%,#36427C 100%)}
.sky[data-phase="dawn"]{--sky:linear-gradient(162deg,#3B58A6 0%,#B3779C 58%,#F0A27E 100%)}
.sky[data-phase="day"]{--sky:linear-gradient(162deg,#1A59CB 0%,#3A82E4 56%,#78B0F0 100%)}
.sky[data-phase="golden"]{--sky:linear-gradient(162deg,#3A59AC 0%,#C46F8C 56%,#F2A35D 100%)}
.sky[data-phase="dusk"]{--sky:linear-gradient(162deg,#1A2250 0%,#493B7C 56%,#985A8D 100%)}
.sky-row{display:flex;align-items:flex-start;gap:14px}
.sky-temp{font-family:var(--display);font-size:68px;font-weight:300;letter-spacing:-.05em;line-height:.86}
.sky-cond{display:flex;flex-direction:column;gap:3px;padding-top:4px;min-width:0}
.sky-cond b{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:600}
.sky-cond b svg{width:20px;height:20px}
.sky-cond span{font-size:14px;opacity:.86}
.sky-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-4px -4px 12px}
.sky-loc{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.18);white-space:nowrap;color:#fff;max-width:70%}
.sky-loc span{overflow:hidden;text-overflow:ellipsis}
.sky-loc svg{width:11px;height:11px;flex:0 0 auto}
.sky-loc.off svg{opacity:.75}
.sky-plot{position:relative;height:104px;margin:12px -6px 0}
.sky-plot svg{position:absolute;inset:0;overflow:visible}
.sky-ax{position:absolute;left:0;right:0;bottom:0;height:16px;font-size:11.5px;font-weight:600;opacity:.8}
.sky-ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.sky-note{font-size:13px;opacity:.85;padding:8px 0 4px}
.sky-upd{font-size:12px;font-weight:600;opacity:.72;white-space:nowrap}

.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gl{display:block;background:var(--surface);border-radius:20px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.gl-k{font-size:13px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.gl-k svg{width:14px;height:14px}
.gl-v{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.gl-c{font-size:13px;font-weight:600;margin-top:2px}
.gl-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.gl.next{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.gl.next .ev-ic{width:42px;height:42px;font-size:21px;border-radius:13px}
.gl.next .t{font-size:16px;font-weight:650;line-height:1.25}
.gl.next .m{font-size:13.5px;color:var(--ink-2);margin-top:2px}

/* ============================================================
   NAV
   ============================================================ */
.nav-sentinel{height:1px}
.nav{position:sticky;top:env(safe-area-inset-top);z-index:20;margin-top:16px;padding:8px 0;transition:background .2s,box-shadow .2s}
.nav.stuck{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 var(--line)}
.nav-in{display:flex;gap:6px;overflow-x:auto;padding:0 var(--g)}
.nav-in a{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:14.5px;font-weight:600;color:var(--ink-2);background:var(--fill);transition:background .2s,color .2s}
.nav-in a.on{background:var(--ink);color:var(--bg)}

/* ============================================================
   SECTIONS
   ============================================================ */
.sec{padding:30px var(--g) 0;scroll-margin-top:calc(54px + env(safe-area-inset-top))}
.sec[hidden]{display:none}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 12px}
.sh h2{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:10px}
.h-ic{width:27px;height:27px;flex:0 0 auto;display:inline-flex}
.h-ic svg,.h-ic img{width:100%;height:100%}
.h-ic.yt{width:34px;height:24px}
.sh .aux{font-size:14px;color:var(--ink-3);font-weight:500;text-align:right}
.sh a.aux,.sh button.aux{color:var(--link);font-weight:600}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--fill);color:var(--ink);white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--ink);color:var(--bg)}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:46px;margin-top:10px;border-radius:16px;background:var(--fill);font-size:15px;font-weight:600}
.more svg{width:16px;height:16px;transition:transform .2s}
.more.open svg{transform:rotate(180deg)}
.foot-note{font-size:13px;color:var(--ink-3);margin:10px 4px 0;line-height:1.4}
.foot-note button{color:var(--link);font-weight:600}
.sub-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:15px;font-weight:700;margin:18px 4px 10px}
.sub-h span{font-size:13px;font-weight:500;color:var(--ink-3)}
.sub-h button{font-size:13px;font-weight:600;color:var(--link)}
.mini{height:30px;padding:0 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);white-space:nowrap}
.mini svg{width:14px;height:14px}
.mini.on{color:var(--ink);background:var(--fill-2)}

/* calendar */
.sum{padding:14px 16px 15px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:12px}
.sum-k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;letter-spacing:.02em;color:var(--link);text-transform:uppercase}
.sum-k svg{width:14px;height:14px}
.sum p{font-size:15px;line-height:1.48;color:var(--ink);margin-top:6px}
.agenda{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.agenda .grp{padding:14px 16px 8px;border-top:0;border-left:1px solid var(--line)}
.agenda .grp:first-child{border-left:0}
@media (max-width:540px){.agenda{grid-template-columns:1fr}.agenda .grp{border-left:0;border-top:1px solid var(--line)}.agenda .grp:first-child{border-top:0}}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.grp-h b{font-size:15px;font-weight:700}
.grp-h span{font-size:13px;color:var(--ink-3);font-weight:500}
.ev{display:flex;gap:12px;align-items:center;padding:8px 0}
.ev.past{opacity:.45}
.ev-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--fill);font-size:19px;flex:0 0 auto;color:var(--ink-2)}
.ev-ic svg{width:18px;height:18px}
.ev-x{min-width:0;flex:1}
.ev-t{font-size:15.5px;font-weight:600;line-height:1.28}
.ev-m{font-size:13px;color:var(--ink-2);margin-top:2px}
.ev .mini{flex:0 0 auto}
.empty{font-size:14px;color:var(--ink-3);padding:4px 0 10px}

/* try today */
.tipc{position:relative;border-radius:24px;padding:18px 18px 16px;overflow:hidden;color:#fff;background:var(--tipbg,linear-gradient(150deg,#F08A3C 0%,#E2543C 55%,#B3325A 100%))}
.tipc::before{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 70%)}
.tip-top{position:relative;display:flex;gap:12px;align-items:center}
.tip-ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:0 0 auto}
.tip-ic svg{width:24px;height:24px}
.tip-top small{display:block;font-size:12.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;opacity:.82}
.tip-top h3{font-family:var(--display);font-size:22px;line-height:1.15;letter-spacing:-.02em;font-weight:700;margin-top:2px}
.tipc p{position:relative;font-size:15px;line-height:1.48;margin-top:12px;opacity:.95}
.tip-how{position:relative;list-style:none;margin:12px 0 0;padding:0;counter-reset:s}
.tip-how li{position:relative;padding-left:30px;font-size:14.5px;line-height:1.42;counter-increment:s}
.tip-how li+li{margin-top:8px}
.tip-how li::before{content:counter(s);position:absolute;left:0;top:0;width:21px;height:21px;border-radius:50%;background:rgba(255,255,255,.24);font-size:12px;font-weight:700;display:grid;place-items:center}
.tipc .acts{position:relative;display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.tipc .btn{background:rgba(255,255,255,.2);color:#fff}
.tipc .btn.pri{background:#fff;color:#111}

/* markets */
.mk{padding:16px 16px 14px}
.mk+.mk{margin-top:12px}
.mk-head{display:flex;align-items:center;gap:10px}
.mk-head .logo{width:30px;height:30px;flex:0 0 auto;border-radius:50%;overflow:hidden;display:inline-flex}
.mk-head .logo img,.mk-head .logo svg{width:100%;height:100%}
.mk-name{font-size:17px;font-weight:700;line-height:1.15}
.mk-sub{font-size:13px;color:var(--ink-3);font-weight:500}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:5px 10px;border-radius:999px;background:var(--fill);white-space:nowrap}
.live i{width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 2.2s ease-in-out infinite}
.live.off i{background:var(--ink-3);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.px{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:16px;transition:color .5s}
.px.tick-up{color:var(--up);transition:none}.px.tick-down{color:var(--down);transition:none}
.chg{font-size:15px;font-weight:600;margin-top:7px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;min-height:21px}
.chg .lbl{color:var(--ink-3);font-weight:500}
.chart{position:relative;height:168px;margin:12px -16px 0;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:crosshair}
.chart svg{display:block;overflow:visible}
.chart-empty{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;font-size:14px;color:var(--ink-3);text-align:center;padding:0 30px;line-height:1.4}
.mas{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ma{height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:var(--fill);color:var(--ink-3)}
.ma i{width:10px;height:3px;border-radius:2px;background:currentColor}
.ma.on{color:var(--ink)}
.ma.on i{background:var(--c)}
.ma b{font-weight:600;color:var(--ink-2)}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin-top:10px}
.seg button{flex:1;min-width:0;height:30px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stats dt{font-size:12.5px;color:var(--ink-3);font-weight:500}
.stats dd{margin:2px 0 0;font-size:15px;font-weight:600}
.take{margin:0 16px 16px;padding:14px;border-radius:16px;background:var(--fill)}
.take-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.take-h b{font-size:14.5px}
.take-h span{font-size:12.5px;color:var(--ink-3)}
.take p{font-size:15px;line-height:1.48;margin-top:8px}
.take .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.take .btn{background:var(--surface)}
.rows{margin-top:12px}
.ix{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.ix.on{background:var(--fill)}
.ix-n{display:flex;align-items:center;gap:10px;min-width:0}
.ix-n .coin{width:26px;height:26px;border-radius:50%;flex:0 0 auto;overflow:hidden;background:var(--fill);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-2)}
.ix-n .coin img,.ix-n .coin svg{width:100%;height:100%}
.ix-n div{min-width:0}
.ix-n b{font-size:15.5px;font-weight:650;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix-n span{font-size:12.5px;color:var(--ink-3)}
.ix-v{text-align:right}
.ix-v b{display:block;font-size:15.5px;font-weight:600}
.pill{display:inline-block;min-width:66px;text-align:center;padding:2px 6px;border-radius:7px;font-size:13px;font-weight:700;color:#fff;background:var(--up);margin-top:3px}
.pill.dn{background:var(--down)}
.pill.na{background:var(--fill-2);color:var(--ink-3)}
.why{padding:14px 16px 16px;border-top:1px solid var(--line)}
.why ul{list-style:none;margin:0;padding:0}
.why-h{font-size:15px;font-weight:700;margin-bottom:8px}
.why li{position:relative;padding-left:16px;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.why li+li{margin-top:7px}
.why li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}

/* stock pick */
.pick{padding:16px}
.pick-k{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-3)}
.pick-k span:last-child{text-transform:none;letter-spacing:0;font-weight:500}
.pick-h{display:flex;align-items:center;gap:12px;margin-top:12px}
.tkr{height:44px;min-width:58px;padding:0 10px;border-radius:13px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-size:16px;font-weight:800;letter-spacing:.02em}
.pick-h .tkr{color:var(--bg);font-size:16px}
.pick-h b{display:block;font-size:17px;font-weight:700;line-height:1.2}
.pick-h span{font-size:13px;color:var(--ink-3)}
.pick-px{margin-left:auto;text-align:right}
.pick-px b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.pick .chart{height:110px;margin-top:10px}
.pick dl{margin:12px 0 0;display:grid;gap:10px}
.pick dt{font-size:12.5px;font-weight:700;color:var(--ink-3)}
.pick dd{margin:2px 0 0;font-size:14.5px;line-height:1.45;color:var(--ink)}
.pick .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.rh{width:16px;height:16px;border-radius:4px;flex:0 0 auto;display:inline-flex;overflow:hidden}
.rh svg{width:100%;height:100%}

/* news */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 calc(-1*var(--g)) 12px;padding:0 var(--g)}
.chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:14.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.chip svg{width:14px;height:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.nw{position:relative;padding:15px 16px;border-top:1px solid var(--line)}
.nw:first-child{border-top:0}
.nw-src{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);font-weight:500}
.nw-src img{width:16px;height:16px;border-radius:4px;background:var(--fill)}
.nw-src b{color:var(--ink-2);font-weight:600}
.nw-src .dt{margin-left:auto}
.nw h3{font-size:17px;line-height:1.28;font-weight:650;letter-spacing:-.01em;margin-top:7px}
.nw p{font-size:14.5px;line-height:1.45;color:var(--ink-2);margin-top:5px}
.stretch::after{content:"";position:absolute;inset:0;z-index:0}
.nw-acts{position:relative;z-index:1;display:flex;gap:6px;margin-top:11px}

/* watch */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--g));padding:2px var(--g) 6px;scroll-padding:0 var(--g)}
.vid{flex:0 0 calc(100% - 40px);scroll-snap-align:start;background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.vid-th{position:relative;aspect-ratio:16/9;background:#15161A;overflow:hidden}
.vid-th img{width:100%;height:100%;object-fit:cover}
.vid-th .dur{position:absolute;right:9px;bottom:9px;font-size:12.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.74);padding:2px 7px;border-radius:7px}
.vid-th .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:16px;color:#fff;background:radial-gradient(130% 120% at 0% 100%,var(--c1,#3A3F4A) 0%,var(--c2,#121317) 70%)}
.vid-th .ph .ph-yt{width:34px;height:24px;display:inline-flex;margin-bottom:auto}
.vid-th .ph strong{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:-.03em;font-weight:700}
.vid-th .ph small{font-size:13px;font-weight:600;opacity:.7;margin-top:6px}
.vid-b{padding:12px 15px 15px}
.vid-ch{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3)}
.vid-ch .ava{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--fill);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink-2)}
.vid-ch b{color:var(--ink);font-weight:650}
.vid-ch .sep{margin-left:auto}
.vid h3{font-size:17px;line-height:1.26;font-weight:650;margin-top:8px}
.vid p{font-size:14.5px;line-height:1.42;color:var(--ink-2);margin-top:6px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--fill-2);transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--ink)}

/* discovery */
.dsc{position:relative;display:flex;gap:13px;padding:14px 16px;border-top:1px solid var(--line)}
.dsc:first-child{border-top:0}
.dsc-th{position:relative;align-self:flex-start;flex:0 0 auto;width:124px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#15161A}
.dsc-th img{width:100%;height:100%;object-fit:cover}
.dsc-th.sq{width:72px;aspect-ratio:1}
.dsc-th .dur{position:absolute;right:5px;bottom:5px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.74);padding:1px 5px;border-radius:5px}
.dsc-x{min-width:0;flex:1}
.dsc-ch{font-size:13px;font-weight:650;color:var(--ink-2)}
.dsc h3{font-size:15.5px;line-height:1.26;font-weight:650;margin-top:2px}
.bec{display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:1.38;color:var(--ink-2);margin-top:7px}
.bec svg{width:13px;height:13px;flex:0 0 auto;margin-top:2px;color:var(--link)}
.dsc-acts{position:relative;z-index:1;display:flex;gap:6px;margin-top:9px}

/* watch + listen cards */
.vid{position:relative}
.vid-b{display:flex;flex-direction:column;flex:1;min-height:200px;padding:12px 15px 14px}
.vid-ch{min-width:0}
.vid-ch .ava{flex:0 0 auto}
.vid-ch b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.vid-ch .sep{flex:0 0 auto;white-space:nowrap}
.ava.sqa{border-radius:6px}
.vid .nodesc{font-style:italic;color:var(--ink-3)}
.vid .bec{margin-top:7px}
.vid-f{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:12px}
.open-in{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.open-in svg{width:16px;height:16px}
.mini.fol.on{background:var(--fill);color:var(--ink)}
.sugg{pointer-events:none;position:absolute;left:9px;top:9px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:#fff;background:rgba(43,94,240,.94);padding:3px 8px;border-radius:7px;z-index:1}
.sugg svg{width:11px;height:11px}
.pth{background:#1d1d22}
.pth .bgb{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(22px) brightness(.62) saturate(1.2)}
.pth .sq{position:absolute;left:50%;top:50%;height:76%;width:auto;aspect-ratio:1;object-fit:cover;transform:translate(-50%,-50%);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.empty-row{padding:16px;font-size:14.5px;color:var(--ink-3)}
.pth.wide .bgb{display:none}
.pth.wide .sq{left:0;top:0;width:100%;height:100%;aspect-ratio:auto;transform:none;border-radius:0;box-shadow:none;object-fit:cover}
/* crypto SMAs */
.smas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.sma{background:var(--fill);border-radius:14px;padding:10px 11px}
.sma small{display:block;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.01em}
.sma b{display:block;font-size:15.5px;font-weight:700;margin-top:3px}
.sma span{display:block;font-size:12px;font-weight:600;margin-top:2px;color:var(--ink-3)}
.sma span.up{color:var(--up)}.sma span.down{color:var(--down)}
/* stock pick chips */
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pchip{font-size:12.5px;padding:5px 9px;border-radius:999px;background:var(--fill);color:var(--ink-2)}
.pchip b{color:var(--ink);font-weight:700}
.pchip.good{background:rgba(10,148,85,.12);color:var(--up)}
.pchip.good b{color:var(--up)}
.pick-risk{font-size:13px;line-height:1.45;color:var(--ink-3);margin-top:10px}
.pick-risk b{color:var(--ink-2)}
/* listen */
.pod{position:relative;display:flex;gap:14px;padding:15px 16px;border-top:1px solid var(--line)}
.pod:first-child{border-top:0}
.pod .cv{width:78px;height:78px;border-radius:14px;object-fit:cover;flex:0 0 auto;background:var(--fill)}
.pod-x{min-width:0;flex:1}
.pod-show{font-size:13px;font-weight:600;color:var(--ink-3)}
.pod h3{font-size:16px;line-height:1.26;font-weight:650;margin-top:3px}
.pod p{font-size:14px;line-height:1.4;color:var(--ink-2);margin-top:5px}
.pod-meta{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px;color:var(--ink-3);font-weight:500;white-space:nowrap;min-width:0}
.pod-meta .sp{display:inline-flex;align-items:center;gap:5px;color:#1AA34A;font-weight:650}
.pod-meta .sp svg{width:15px;height:15px}

/* weekend */
.wk{position:relative;display:flex;gap:14px;padding:15px 16px;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.wk-d{flex:0 0 52px;text-align:center;padding-top:2px}
.wk-d small{display:block;font-size:12px;font-weight:700;color:var(--link);white-space:nowrap}
.wk-d b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.wk-x{min-width:0;flex:1}
.wk h3{font-size:16.5px;line-height:1.26;font-weight:650}
.wk p{font-size:14.5px;line-height:1.42;color:var(--ink-2);margin-top:4px}
.wk-tip{display:flex;gap:6px;font-size:13px;color:var(--ink-3);margin-top:7px;line-height:1.35}
.wk-tip svg{width:14px;height:14px;flex:0 0 auto;margin-top:1px}
.wk-acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.tagc{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:650;margin-top:6px;background:var(--fill);color:var(--ink-2)}
.tagc.list{background:rgba(10,148,85,.12);color:var(--up)}
.watching{font-size:13px;color:var(--ink-3);margin:10px 4px 0;line-height:1.45}
.watching button{color:var(--link);font-weight:600}

/* something different */
.feat{margin:30px var(--g) 0;border-radius:28px;padding:22px 20px 20px;color:#fff;background:radial-gradient(120% 100% at 100% 0%,#33467F 0%,#16203B 52%,#0B1022 100%);position:relative;overflow:hidden}
.feat::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 28px rgba(255,255,255,.03),0 0 0 56px rgba(255,255,255,.025)}
.feat small{position:relative;font-size:13px;font-weight:600;opacity:.66}
.feat h3{position:relative;font-family:var(--display);font-size:27px;line-height:1.1;letter-spacing:-.025em;font-weight:700;margin-top:8px}
.feat p{position:relative;font-size:15.5px;line-height:1.5;opacity:.86;margin-top:9px}
.feat .acts{position:relative;display:flex;gap:8px;margin-top:16px}
.feat .btn{background:rgba(255,255,255,.15);color:#fff}
.feat .btn.pri{background:#fff;color:#000}

/* learn */
.lw{padding:18px 18px 16px;--acc:var(--vocab);--acc-soft:var(--vocab-soft)}
.lw.es{--acc:var(--es);--acc-soft:var(--es-soft)}
.lw+.lw{margin-top:12px}
.lw-k{display:flex;align-items:center;gap:10px}
.lw-ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);flex:0 0 auto}
.lw-ic svg{width:19px;height:19px}
.lw-k b{font-size:15px;font-weight:700}
.lw-k .cnt{margin-left:auto;font-size:13px;color:var(--ink-3);font-weight:500}
.hist{display:flex;gap:6px;overflow-x:auto;margin:14px -18px 0;padding:0 18px}
.hc{flex:0 0 auto;padding:7px 12px 8px;border-radius:13px;background:var(--fill);text-align:left}
.hc small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600}
.hc span{font-size:14.5px;font-weight:600}
.hc.on{background:var(--acc);color:#fff}
.hc.on small{color:inherit;opacity:.75}
.term{font-family:var(--serif);font-size:44px;line-height:1.04;font-weight:600;letter-spacing:-.01em;margin-top:16px;overflow-wrap:anywhere}
.pron{font-size:15px;color:var(--ink-2);margin-top:7px}
.pron i{font-family:var(--serif);color:var(--acc);font-style:italic}
.def{font-size:17px;line-height:1.48;margin-top:12px}
.ex{font-family:var(--serif);font-size:16.5px;line-height:1.55;color:var(--ink-2);margin-top:12px;padding-left:14px;border-left:2px solid var(--acc);font-style:italic}
.fc-l{font-size:12.5px;font-weight:700;color:var(--ink-3);margin-top:16px}
.lw .acts{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.lw .btn.pri{background:var(--acc);color:#fff}
.fcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.fc{perspective:700px;height:66px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.fc.open .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:15px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:15px;font-weight:650;line-height:1.2}
.fc-f{background:var(--acc-soft);color:var(--ink)}
.fc-b{transform:rotateY(180deg);background:var(--acc);color:#fff;font-size:13.5px;font-weight:600}

/* footer */
.foot{text-align:center;padding:34px var(--g) 0;font-size:13px;color:var(--ink-3);line-height:1.6}
.foot b{color:var(--ink-2);font-weight:600}

/* ============================================================
   SHEETS
   ============================================================ */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .25s}
.sheet.show .sheet-bg{opacity:1}
.sheet-p{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding:8px var(--g) calc(24px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sheet.show .sheet-p{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--fill-2);margin:2px auto 12px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-h h3{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.02em}
.set-l{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-3);font-weight:600;margin:0 4px 7px}
.set-g{background:var(--surface);border-radius:16px;margin-bottom:20px;overflow:hidden}
.set-r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:8px 14px;border-top:1px solid var(--line);font-size:15.5px}
.set-r:first-child{border-top:0}
.set-pad{padding:12px 14px}
.set-pad+.set-pad{border-top:1px solid var(--line)}
.set-t{font-size:15px;font-weight:650}
.set-s{font-size:13px;color:var(--ink-3);margin-top:2px;line-height:1.35}
.set-help{font-size:13px;color:var(--ink-3);line-height:1.45;margin:-12px 4px 20px}
.set-help a,.set-help button{color:var(--link);font-weight:600}
.sw{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:999px;background:var(--fill-2);position:relative;flex:0 0 auto;transition:background .2s;margin:0;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,.7,.2,1)}
.sw:checked{background:#34C759}
.sw:checked::after{transform:translateX(20px)}
.inp{width:100%;min-width:0;height:44px;border-radius:12px;border:0;background:var(--fill);padding:0 12px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.inp:focus{box-shadow:0 0 0 2px var(--link)}
.inp-row{display:flex;gap:8px;margin-top:10px}
.inp-row .btn{height:44px;border-radius:12px;padding:0 16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:600}
.tag button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.tag button svg{width:12px;height:12px}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin-top:10px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:0 0 auto}
.status.ok i{background:var(--up)}.status.err i{background:var(--down)}

/* review deck */
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--g));padding:4px var(--g) 8px;scroll-padding:0 var(--g)}
.rc{flex:0 0 calc(100% - 32px);scroll-snap-align:center;height:300px;perspective:900px}
.rc .fc-in{border-radius:24px}
.rc .fc-f,.rc .fc-b{border-radius:24px;flex-direction:column;padding:22px;gap:10px}
.rc .fc-f{background:var(--surface);box-shadow:var(--shadow)}
.rc .fc-f b{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.08}
.rc .fc-f small,.rc .fc-b small{font-size:13px;font-weight:600;opacity:.6}
.rc .fc-b{font-size:17px;line-height:1.45;font-weight:500;background:var(--ink);color:var(--bg)}
.rc .fc-b em{font-family:var(--serif);font-size:15px;opacity:.8}
.deck-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}

/* toast + pull to refresh */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ptr{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.14);display:grid;place-items:center;z-index:40;opacity:0;pointer-events:none;color:var(--ink-3)}
.ptr svg{width:18px;height:18px}
.ptr.ready{color:var(--ink)}
.ptr.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}


/* brand mark */
.foot-mark svg{width:100%;height:100%;display:block}
.foot-mark{display:block;width:24px;height:24px;margin:0 auto 12px;color:var(--ink-3)}
.ptr svg{width:20px;height:20px}

/* ============================================================
   WIDE SCREENS — iPad (768+) and laptop (1024+).
   Phone layout above is untouched; everything here only kicks in
   when there's room. Breakpoints:
     ≥768   iPad portrait / iPhone landscape: two-column page
     ≥1024  iPad landscape / MacBook: wider canvas, 3-up rails
   ============================================================ */
body{overflow-x:clip}
.app{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.only-wide{display:none!important}
.rail-wrap{position:relative}
.rail-nav{display:none}

@media (min-width:768px){
  :root{--g:24px}
  .only-wide{display:flex!important}
  .app{max-width:1040px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .app>*{grid-column:1/-1}

  /* hero: sky card left, glance tiles stacked right */
  .hero{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);column-gap:14px;align-items:stretch}
  .hero-top,.greet{grid-column:1/-1}
  .greet{font-size:50px;margin:8px 0 22px}
  .sky{display:flex;flex-direction:column;min-height:236px}
  .sky-plot{margin-top:auto;padding-top:12px;height:116px}
  .glance{grid-template-columns:1fr;grid-auto-rows:1fr;margin-top:0;gap:10px}
  .glance .gl:not(.next){display:flex;flex-direction:column;justify-content:center}
  .gl.next{grid-column:auto}

  /* nav: centred pills, background bleeds edge to edge when stuck */
  .nav-in a:first-child{margin-left:auto}
  .nav-in a:last-child{margin-right:auto}
  .nav.stuck{background:none;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
  .nav::before{content:"";position:absolute;top:0;bottom:0;left:calc(50% - 50vw);width:100vw;z-index:-1;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 var(--line);opacity:0;transition:opacity .2s;pointer-events:none}
  .nav.stuck::before{opacity:1}

  /* Calendar | Try Today side by side */
  #s-cal{grid-column:1;padding-right:calc(var(--g)/2)}
  #s-tip{grid-column:2;padding-left:calc(var(--g)/2)}
  #s-cal:has(+ #s-tip[hidden]){grid-column:1/-1;padding-right:var(--g)}
  #s-cal[hidden]+#s-tip{grid-column:1/-1;padding-left:var(--g)}
  .sec{padding-top:36px}

  /* Markets: crypto | stocks, stock idea full width below */
  #s-mkt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  #s-mkt>.sh{grid-column:1/-1;margin-bottom:-2px}
  #s-mkt>.card{margin:0!important}
  #pick-card{grid-column:1/-1}
  .pick{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);column-gap:28px;align-items:start}
  .pick>.pick-k{grid-column:1/-1}
  .pick>.pick-h{grid-column:1;grid-row:2}
  .pick>.chart{grid-column:1;grid-row:3;height:150px}
  .pick>.pchips{grid-column:1;grid-row:4}
  .pick>dl{grid-column:2;grid-row:2/5;margin-top:12px}
  .pick>.pick-risk{grid-column:2;grid-row:5}
  .pick>.acts{grid-column:2;grid-row:6}

  /* News: two columns of stories */
  .chips{flex-wrap:wrap;overflow:visible}
  #s-news>.card{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  #s-news .nw:nth-child(-n+2){border-top:0}
  #s-news .nw:nth-child(odd):not(:only-child){border-right:1px solid var(--line)}

  /* Watch + Listen rails: two cards per view with a peek */
  .vid{flex-basis:calc(50% - 30px)}

  /* Weekend: this weekend | book ahead */
  #s-wknd{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:14px;align-items:start}
  #s-wknd>.sh{grid-column:1/-1}
  #s-wknd>.sub-h{margin:4px 4px 10px}
  #s-wknd>.wk-now-h{grid-column:1;grid-row:2}
  #s-wknd>.wk-now{grid-column:1;grid-row:3/span 2}
  #s-wknd>.wk-ahead-h{grid-column:2;grid-row:2}
  #s-wknd>.wk-ahead{grid-column:2;grid-row:3}
  #s-wknd>.watching{grid-column:2;grid-row:4}

  /* Learn: word | Spanish side by side */
  #s-learn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
  #s-learn>.sh{grid-column:1/-1;margin-bottom:-2px}
  .lw+.lw{margin-top:0}

  .feat{padding:28px 28px 26px}
  .feat p{max-width:64ch}
  .foot{padding-top:44px}

  /* sheets become a centred panel instead of a bottom sheet */
  .sheet-p{top:50%;bottom:auto;left:50%;right:auto;width:min(560px,calc(100% - 48px));max-height:min(86vh,880px);max-height:min(86dvh,880px);border-radius:26px;padding:20px 24px 24px;opacity:0;transform:translate(-50%,-47%) scale(.98);transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
  .sheet.show .sheet-p{opacity:1;transform:translate(-50%,-50%)}
  .sheet-p .grab{display:none}
}

@media (min-width:1024px){

/* mouse / trackpad niceties */

/* ============================================================
   THEME — simple light / dark, follows device preference
   ============================================================ */
html{background:var(--bg)}
.home{position:relative;z-index:1}

/* ============================================================
   INDEX — the opening screen is a list on the sky. Each row is a
   section name, set large, with a one-line readout beside it.
   Tapping a row opens that section in place, inside the list.
   Two voices: the display face for names, the system mono for
   numbers, counts and times.
   ============================================================ */
:root{--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
#app.app{max-width:none;display:block;padding:0;margin:0}
.home{max-width:560px;margin:0 auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}

.list{padding:0 var(--g);counter-reset:it}
.it{border-top:1px solid var(--line)}
.it:last-child{border-bottom:1px solid var(--line)}
.it[hidden]{display:none}
.it-h{display:flex;align-items:baseline;gap:14px;width:100%;min-width:0;padding:17px 0 16px;text-align:left;color:var(--ink)}
.it-h:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.it-n{flex:0 0 auto;font-family:var(--display);font-size:27px;font-weight:600;letter-spacing:-.035em;line-height:1;white-space:nowrap;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.it-t{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:flex-end;gap:9px;overflow:hidden;white-space:nowrap;font-size:13.5px;line-height:1.2;color:var(--ink-2);transition:opacity .25s ease}
.it-t .m{flex:0 0 auto;font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.01em;color:var(--ink);opacity:.88}
.it-t .m.k{font-size:10.5px;line-height:1.25;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:1px 5px 0;border:1px solid var(--line);border-radius:5px;align-self:center}
.it-t .m.up,.it-t .m.chg{color:var(--up)}.it-t .m.down,.it-t .m.chg.dn{color:var(--down)}
.it-t .tx{min-width:0;overflow:hidden;text-overflow:ellipsis}
.it-t .ser{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--ink)}

.it-x{position:relative;flex:0 0 auto;width:13px;height:13px;align-self:center;color:var(--ink-3);transition:transform .35s cubic-bezier(.2,.8,.2,1),color .2s}
.it-x::before,.it-x::after{content:"";position:absolute;left:0;right:0;top:6px;height:1.5px;border-radius:1px;background:currentColor}
.it-x::after{transform:rotate(90deg)}
.it.open .it-x{transform:rotate(45deg);color:var(--ink)}

/* the section opens in place: full-screen feel with pinned title */
.it-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .46s cubic-bezier(.22,.8,.18,1)}
.it.open .it-b{grid-template-rows:1fr}

const TIPS=[
 {cat:"Energy",title:"Get outside light in your first hour",mins:"10 min",why:"Morning daylight times your cortisol rise and anchors your body clock, so you feel alert now and sleepier at night.",how:["Go outside within an hour of waking, no sunglasses.","About 10 minutes if it's clear, 20 if it's cloudy."],src:"Huberman Lab"},
 {cat:"Calm",title:"Try the physiological sigh",mins:"1 min",why:"A double inhale followed by a long exhale is one of the fastest ways to bring your heart rate and stress down in real time.",how:["Inhale through your nose, then sneak in a second short inhale on top.","Exhale slowly through your mouth until empty.","Repeat 2–3 times."],src:"Stanford breathing research"},
 {cat:"Move",title:"Walk for 10 minutes after your biggest meal",mins:"10 min",why:"A short walk after eating helps your muscles soak up blood sugar, flattening the spike and the afternoon crash.",how:["Start within 30 minutes of finishing.","Easy pace is fine. It doesn't need to be a workout."],src:"Post-meal walking studies"},
 {cat:"Focus",title:"Do one 90-minute deep work block",mins:"90 min",why:"Attention tends to run in roughly 90-minute cycles. One protected block usually beats a day of scattered half-focus.",how:["Pick one task and write the finish line down.","Phone in another room, notifications off.","Stop at 90 minutes and take a real break."],src:"Cal Newport / ultradian rhythm research"},
 {cat:"Sleep",title:"Dim the lights after sunset",mins:"All evening",why:"Bright overhead light at night delays melatonin. Keeping light low and below eye level helps you fall asleep sooner.",how:["Switch to lamps after dinner.","Use night mode on screens and keep brightness low."],src:"Huberman Lab"},
 {cat:"Energy",title:"Push your first coffee back an hour",mins:"0 min",why:"Some people find a later first coffee avoids the early-afternoon crash. It's worth testing on yourself.",how:["Drink water first thing instead.","Have coffee 60–90 minutes after waking and notice how 2 PM feels."],src:"Huberman Lab"},
 {cat:"Mind",title:"Write down three specific good things",mins:"3 min",why:"Specific gratitude (not generic) is one of the most replicated small habits for mood.",how:["Make them concrete: who, what, and why it mattered.","Do it at the same time each day."],src:"Positive psychology research"},

function wxInfo(code,isDay=1){
 const c=+code;
 if(c===0)return{l:isDay?"Clear":"Clear night",i:isDay?"sun":"moon",o:0};
 if(c===1)return{l:"Mostly clear",i:isDay?"sun":"moon",o:0};
 if(c===2)return{l:"Partly cloudy",i:"partly",o:0};
 if(c===3)return{l:"Overcast",i:"cloud",o:1};
 if(c===45||c===48)return{l:"Fog",i:"fog",o:1};
 if(c>=51&&c<=57)return{l:"Drizzle",i:"rain",o:1};
 if(c>=61&&c<=67)return{l:c>=65?"Heavy rain":"Rain",i:"rain",o:1};
 if(c>=71&&c<=77)return{l:"Snow",i:"snow",o:1};
 if(c>=80&&c<=82)return{l:"Showers",i:"rain",o:1};
 if(c>=95)return{l:"Thunderstorms",i:"storm",o:1};
 return{l:"Fair",i:"partly",o:0};
}

/* =================================================================
   SETTINGS SYNC — one config shared by every device (a file in the Daily
   Drive folder, kept by the backend; the morning routine reads it too).
   Each setting carries its own timestamp, so changes made on different
   devices merge instead of overwriting each other: the newer change to
   the same setting wins. Hidden items and saved stories keep "removed"
   markers (negative timestamps) so removals travel between devices too.
   Synced: your lists, theme, which sections show, hidden items, saved stories.
   Not synced (per device on purpose): location, chart picks, open section.
   ================================================================= */
const PREF_KEYS=["theme","hidden"];
const cfgEmpty=()=>({v:3,lists:{},listsAt:{},prefs:{},prefsAt:{},dismissed:{},saved:{}});
let _cfg=null;
function cfg(){
 if(_cfg)return _cfg;
 let c=LS.get("sd-cfg",null);
 if(!c||c.v!==3){ /* first run on this device: carry over what was stored the old way */
  c=cfgEmpty();const l=LS.get("sd-lists",null);
  if(l&&l.lists){c.lists=l.lists;Object.keys(l.lists).forEach(k=>c.listsAt[k]=l.updated||1)}
  const th=LS.get("sd-theme",null);if(th){c.prefs.theme=th;c.prefsAt.theme=1}
  const hd=LS.get("sd-hidden",null);if(hd){c.prefs.hidden=hd;c.prefsAt.hidden=1}
  Object.entries(LS.get("sd-dismissed",{})).forEach(([k,t])=>c.dismissed[k]=t);
  LS.get("sd-saved",[]).forEach(n=>{c.saved[n.id+"|"+n.url]={t:n.savedAt||1,n}});
  c.dirty=true;LS.set("sd-cfg",c);
 }
 return _cfg=c;
}
function cfgSet(fn){const c=cfg();fn(c);c.dirty=true;LS.set("sd-cfg",c);queuePush()}
function lists(){return{...CONFIG.lists,...cfg().lists}}
function setList(k,arr){cfgSet(c=>{c.lists[k]=arr;c.listsAt[k]=Date.now()})}
const pref=(k,d)=>k in cfg().prefs?cfg().prefs[k]:d;
function setPref(k,v){cfgSet(c=>{c.prefs[k]=v;c.prefsAt[k]=Date.now()});if(k==="theme")LS.set("sd-theme",v)}
/* the same merge the backend runs, so both sides always agree */
function mergeCfg(a,b){
 const o=cfgEmpty();
 LIST_KEYS.forEach(k=>{const ta=a.lists&&a.lists[k]?(a.listsAt[k]||0):-1,tb=b.lists&&b.lists[k]?(b.listsAt[k]||0):-1;if(ta<0&&tb<0)return;const w=tb>ta?b:a;o.lists[k]=w.lists[k];o.listsAt[k]=Math.max(ta,tb,0)});
 PREF_KEYS.forEach(k=>{const ta=a.prefs&&k in a.prefs?(a.prefsAt[k]||0):-1,tb=b.prefs&&k in b.prefs?(b.prefsAt[k]||0):-1;if(ta<0&&tb<0)return;const w=tb>ta?b:a;o.prefs[k]=w.prefs[k];o.prefsAt[k]=Math.max(ta,tb,0)});
 [a.dismissed||{},b.dismissed||{}].forEach(d=>Object.keys(d).forEach(k=>{const c=o.dismissed[k];if(c==null||Math.abs(d[k])>Math.abs(c))o.dismissed[k]=d[k]}));
 [a.saved||{},b.saved||{}].forEach(d=>Object.keys(d).forEach(k=>{const c=o.saved[k];if(!c||Math.abs(d[k].t)>Math.abs(c.t))o.saved[k]=d[k]}));
 return o;
}
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);
const cfgSig=c=>canon({l:c.lists,la:c.listsAt,p:c.prefs,pa:c.prefsAt,d:c.dismissed,s:c.saved});
/* take what the server has, keep anything newer here, and redraw whatever changed */
function adoptCfg(remote){
 if(!remote)return;remote={...cfgEmpty(),...remote};
 const old=cfg(),m=mergeCfg(old,remote);m.dirty=cfgSig(m)!==cfgSig(remote);
 const listsBefore=canon(old.lists),changed=cfgSig(m)!==cfgSig(old);
 _cfg=m;LS.set("sd-cfg",m);if(m.prefs.theme)LS.set("sd-theme",m.prefs.theme);
 if(changed&&S.booted){
  applyTheme();S.hidden=new Set(pref("hidden",[]));renderNav();
  if(canon(m.lists)!==listsBefore)listsChanged(LIST_KEYS.filter(k=>canon(old.lists[k])!==canon(m.lists[k])));
  Object.values(DX_RENDER).forEach(f=>f());renderNews();renderTeasers();
 }
 if(m.dirty)queuePush();
}
let pushT;function queuePush(){clearTimeout(pushT);pushT=setTimeout(pushCfg,700)}
async function pushCfg(){
 if(!backend())return;const c=cfg();if(!c.dirty)return;const{dirty,...body}=c;const data=JSON.stringify(body);
 try{
  let r=null;
  try{const res=await fetch(backend(),{method:"POST",body:data});r=await res.json()}catch(e){r=null}
  if(!r&&data.length<6000)r=await be({fn:"save",data}); /* older backend without doPost */
  if(!r||r.ok===false)throw new Error((r&&r.error)||"no response");
  if(r.config&&r.config.v===3)adoptCfg(r.config);else{c.dirty=false;LS.set("sd-cfg",c)}
  S.sync={state:"ok",at:Date.now()};
 }catch(e){S.sync={state:"err",msg:e.message}}
 refreshSettings();
}
async function pullCfg(){
 if(!backend())return;
 try{const r=await be({fn:"config"});if(r.config&&r.config.v===3)adoptCfg(r.config);else if(r.config&&r.config.lists){adoptCfg({lists:r.config.lists,listsAt:Object.fromEntries(Object.keys(r.config.lists).map(k=>[k,r.config.updated||0]))});cfg().dirty=true;queuePush()}else{cfg().dirty=true;queuePush()}S.sync={state:"ok",at:Date.now()}}
 catch(e){S.sync={state:"err",msg:e.message}}
 refreshSettings();
}

 const ax=[];w.win.forEach((p,i)=>{const hh=+p.t.slice(11,13);if(i>0&&i<n-1&&hh%3===0){const x=X(i);if(Math.abs(x-nx)>26)ax.push(`<span style="left:${(x/W*100).toFixed(2)}%">${hh%12||12}${hh<12?"AM":"PM"}</span>`)}});

let audioEl=null;
function say(text,lang){

 try{if(audioEl){audioEl.pause();audioEl=null}speechSynthesis&&speechSynthesis.cancel()}catch(e){}
 let fell=false;const fallback=()=>{if(fell)return;fell=true;speak(text,lang)};
 try{
  const a=new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${lang.slice(0,2)}&ttsspeed=0.9&q=${encodeURIComponent(text)}`);
  audioEl=a;a.addEventListener("error",fallback,{once:true});
  const p=a.play();if(p&&p.catch)p.catch(fallback);
 }catch(e){fallback()}
}

  <div class="status ${S.sp&&S.sp.length?"ok":S.spErr?"err":""}" style="margin-top:0"><i></i><span>${S.sp&&S.sp.length?"Spotify: live episodes from "+S.sp.length+" shows.":S.spErr?"Spotify: "+esc(S.spErr):"Spotify: connecting…"}</span></div>
  <div class="status ${S.mv?"ok":""}"><i></i><span>${S.mv?"Movies: live from TMDB.":S.mvErr==="no-key"?"Movies: add a TMDB_KEY script property in your backend for live listings.":S.mvErr?"Movies: "+esc(S.mvErr):"Movies: from the morning report."}</span></div>
 </div></div>
 <div class="set-l">Sections</div>
 <div class="set-g">${SECTIONS.map(([id,l])=>`<label class="set-r"><span>${esc(l)}</span><input type="checkbox" class="sw" data-sec-toggle="${id}" ${S.hidden.has(id)?"":"checked"}></label>`).join("")}</div>
 <div class="set-g">${Object.keys(DISM()).length?`<button class="set-r" style="width:100%;font-weight:600" data-act="restore-hidden"><span>Hidden items</span><span style="color:var(--link)">${Object.keys(DISM()).length} · Restore all</span></button>`:""}<button class="set-r" style="width:100%;color:var(--link);font-weight:600" data-act="refresh">Refresh now</button><button class="set-r" style="width:100%;color:var(--down);font-weight:600" data-act="clear-cache">Clear cached data</button></div>
 <p class="set-help" style="margin-top:0">Edition ${esc(ED)}. Weather from Open-Meteo, crypto from CoinGecko and Coinbase, stocks from Yahoo Finance through your backend.</p>`;
}
function refreshSettings(){const p=$("#sheet-p");if(!p||!$("#sheet").classList.contains("open")||!$("#set-lists",p))return;const y=p.scrollTop;p.innerHTML=`<div class="grab"></div>`+settingsHTML();p.scrollTop=y}
function reviewHTML(){
 const k=S.review.kind,list=(k==="v"?VOCAB:SPAN).slice().reverse();const ord=S.review.order||list.map((_,i)=>i);
 return`<div class="sheet-h"><h3 id="sheet-title">Review</h3><button class="icon-btn press" data-act="close-sheet" aria-label="Close">${I.close}</button></div>
 <div class="seg" style="margin:0 0 16px" role="tablist"><button class="${k==="v"?"on":""}" data-rev="v" role="tab">Words (${VOCAB.length})</button><button class="${k==="s"?"on":""}" data-rev="s" role="tab">Spanish (${SPAN.length})</button></div>

}
function bindDeck(){const d=$("#deck");if(!d)return;d.addEventListener("scroll",()=>{const c=d.children[0];if(!c)return;const i=Math.round(d.scrollLeft/(c.offsetWidth+12));const n=$("#deck-n");if(n)n.textContent=`${Math.min(d.children.length,i+1)} of ${d.children.length}`},{passive:true})}

/* =================================================================
   LIST CHANGES
   ================================================================= */
function normItem(k,v){v=String(v||"").trim().replace(/\s+/g," ");if(!v)return"";if(k==="channels")return v.startsWith("@")?v.replace(/\s/g,""):"@"+v.replace(/\s/g,"");if(k==="stocks"||k==="crypto")return v.toUpperCase().replace(/\s/g,"");return v}
function addToList(k,v){v=normItem(k,v);if(!v)return false;const l=lists()[k].slice();if(l.some(x=>x.toLowerCase()===v.toLowerCase()))return false;l.push(v);setList(k,l);listsChanged([k]);return true}
function removeFromList(k,v){setList(k,lists()[k].filter(x=>x!==v));listsChanged([k])}
function listsChanged(keys){
 if(keys.includes("channels")){LS.del("sd-yt-cache");loadYouTube(true);renderWatch()}
 if(keys.includes("podcasts")){renderListen();loadSpotify(true).then(loadSpArt)}
 if(keys.includes("stocks")){S.st.sel=0;renderStocks();loadStQuotes()}
 if(keys.includes("crypto")){if(!cxList().includes(S.cx.sel))S.cx.sel=cxList()[0]||"BTC";stopWs();renderCrypto();loadCx().then(startWs)}
 if(keys.includes("artists"))renderShows();
 refreshSettings();
}

/* =================================================================
   INTERACTION
   ================================================================= */
/* tooltips for icon-only buttons (fixed-position so cards never clip them) */
(()=>{const tip=document.createElement("div");tip.className="tt";tip.setAttribute("aria-hidden","true");document.body.appendChild(tip);let cur=null;
 const hide=()=>{tip.classList.remove("show");cur=null};
 document.addEventListener("pointerover",e=>{if(e.pointerType!=="mouse")return;const el=e.target.closest("[data-tip]");if(!el){if(cur)hide();return}if(el===cur)return;cur=el;tip.textContent=el.dataset.tip;const r=el.getBoundingClientRect();tip.style.left=Math.min(innerWidth-8-tip.offsetWidth/2,Math.max(8+tip.offsetWidth/2,r.left+r.width/2))+"px";tip.style.top=(r.top-tip.offsetHeight-8<4?r.bottom+8:r.top-tip.offsetHeight-8)+"px";requestAnimationFrame(()=>tip.classList.add("show"))});
 addEventListener("scroll",hide,{passive:true});document.addEventListener("click",hide);
})();
let tt,toastUndo=null;function toast(t,undo){const el=$("#toast");toastUndo=undo||null;el.classList.toggle("act",!!undo);el.innerHTML=esc(t)+(undo?`<button data-act="undo">Undo</button>`:"");el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>{el.classList.remove("show");toastUndo=null},undo?4500:1600)}
function applyTheme(){const t=LS.get("sd-theme","auto");if(t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;const dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);$$('meta[name="theme-color"]').forEach(m=>m.remove());const m=document.createElement("meta");m.name="theme-color";m.content=dark?"#000000":"#F1F2F4";document.head.appendChild(m)}
function redrawCharts(){drawMk()}
document.addEventListener("click",async e=>{
 const t=e.target;
 const a=t.closest("[data-act]");
 if(a){const act=a.dataset.act;
  if(act==="settings"){openSheet(settingsHTML());return}
  if(act==="settings-list"){const k=a.dataset.k;openSheet(settingsHTML());requestAnimationFrame(()=>{const el=$("#le-"+k);if(el)el.scrollIntoView({block:"start"})});return}
  if(act==="settings-artists"){openSheet(settingsHTML());requestAnimationFrame(()=>{const el=$("#le-artists");if(el)el.scrollIntoView({block:"center"})});return}
  if(act==="close-sheet"){closeSheet();return}
  if(act==="undo"){const u=toastUndo;toastUndo=null;$("#toast").classList.remove("show");if(u)u();return}
  if(act==="restore-hidden"){const now=Date.now();cfgSet(c=>{for(const k in c.dismissed)if(c.dismissed[k]>0)c.dismissed[k]=-now});Object.values(DX_RENDER).forEach(f=>f());renderTeasers();refreshSettings();toast("Everything's back");return}
  if(act==="tmdb-save"){const v=($("#tmdb-key").value||"").trim();if(!v){toast("Paste a key first");return}LS.set("sd-tmdb-key",v);LS.del("sd-tmdb");toast("Loading movies…");await loadMovies(true);refreshSettings();return}
  if(act==="tmdb-clear"){LS.del("sd-tmdb-key");LS.del("sd-tmdb");S.mv=null;renderMovies();renderTeasers();refreshSettings();toast("TMDB key removed");return}
  if(act==="review"){S.review={kind:"v",order:null};openSheet(reviewHTML());bindDeck();return}
  if(act==="shuffle"){const list=S.review.kind==="v"?VOCAB:SPAN;S.review.order=list.map((_,i)=>i).sort(()=>Math.random()-.5);$("#sheet-p").innerHTML=`<div class="grab"></div>`+reviewHTML();bindDeck();return}
  if(act==="news-more"){S.news.open=!S.news.open;renderNews();return}
  if(act==="refresh"){toast("Refreshing");setTimeout(fresh,200);return}
  if(act==="clear-cache"){Object.keys(localStorage).filter(k=>/^sd-(yt-cache|ytc-|cx-|st-|wx|place|cgid)/.test(k)).forEach(k=>LS.del(k));toast("Cache cleared");setTimeout(fresh,400);return}
  if(act==="geo"){const on=!LS.get("sd-geo",false);if(on&&!navigator.geolocation){toast("Location isn't available here");return}LS.set("sd-geo",on);toast(on?"Finding your location…":"Back to "+CONFIG.home.name);loadWeather().then(()=>{if(on&&S.wx&&!S.wx.loc.here){LS.set("sd-geo",false);toast("Location is off for this app");renderHero()}}).catch(()=>toast("Couldn't load the weather"));return}
  if(act==="yt-save"){const v=($("#yt-key").value||"").trim();if(!v){toast("Paste a key first");return}LS.set("sd-yt-key",v);LS.del("sd-yt-cache");S.yt={items:null,source:"seed",updated:0,error:""};toast("Key saved");await loadYouTube(true);refreshSettings();return}
  if(act==="yt-clear"){LS.del("sd-yt-key");LS.del("sd-yt-cache");S.yt={items:null,source:"seed",updated:0,error:""};loadYouTube(true);refreshSettings();toast("Using the built-in key");return}
  if(act==="be-save"){const v=($("#be-url").value||"").trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)){toast("That doesn't look like an Apps Script link");return}LS.set("sd-backend",v);S.st.err="";S.sync={state:"",at:0};refreshSettings();toast("Connecting…");try{await be({fn:"ping"});toast("Backend connected")}catch(err){S.st.err=err.message;toast("Couldn't reach it: "+err.message)}await Promise.all([loadStQuotes(),pullCfg()]);loadStSeries(stList()[S.st.sel],S.st.range).then(drawSt).catch(()=>{});refreshSettings();return}
  if(act==="be-clear"){LS.del("sd-backend");S.st.q={};S.st.series={};S.st.err="";S.st.at=0;S.sync={state:"",at:0};renderStocks();renderPick();refreshSettings();toast("Backend removed");return}
 }
 const rn=t.closest("[data-rail]");if(rn){const r=$("#"+rn.dataset.rail);if(r){const c=r.children[0];const step=c?(c.offsetWidth+12)*Math.max(1,Math.floor((r.clientWidth+12)/(c.offsetWidth+12))):r.clientWidth;r.scrollBy({left:+rn.dataset.dir*step,behavior:"smooth"})}return}
 const rh=t.closest("[data-rh]");if(rh&&(/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1))){e.preventDefault();const web=rh.href;let left=false;const off=()=>{if(document.hidden)left=true};document.addEventListener("visibilitychange",off);location.href="robinhood://instrument/?symbol="+encodeURIComponent(rh.dataset.rh);setTimeout(()=>{document.removeEventListener("visibilitychange",off);if(!left&&!document.hidden)window.open(web,"_blank")},1600);return}
 const la=t.closest("[data-list-add]");if(la){const k=la.dataset.listAdd;const inp=$("#li-"+k);const ok=addToList(k,inp&&inp.value);if(ok)toast("Added");else if(inp&&inp.value)toast("Already on the list");return}
 const ld=t.closest("[data-list-del]");if(ld){removeFromList(ld.dataset.listDel,ld.dataset.v);return}
 const fo=t.closest("[data-follow]");if(fo){e.preventDefault();e.stopPropagation();const k=fo.dataset.follow,v=fo.dataset.v;const was=fo.classList.contains("on");
  if(was){const cur=lists()[k];const hit=k==="podcasts"?cur.find(x=>showMatch(v,[x])):cur.find(x=>x.toLowerCase()===v.toLowerCase());if(hit)setList(k,cur.filter(x=>x!==hit));toast("Unfollowed "+v)}
  else{const nv=normItem(k,v);if(!inList(k,nv))setList(k,lists()[k].concat([nv]));toast("Following "+v)}
  if(k==="channels")LS.del("sd-yt-cache");
  if(k==="artists")renderShows();
  $$(`[data-follow="${k}"]`).forEach(b=>{if(b.dataset.v.toLowerCase()!==v.toLowerCase())return;b.classList.toggle("on",!was);b.setAttribute("aria-pressed",!was);b.innerHTML=!was?I.check:I.plus;b.dataset.tip=!was?"Following · tap to unfollow":"Follow";b.setAttribute("aria-label",!was?"Following":"Follow")});refreshSettings();return}
 const th=t.closest("[data-theme-set]");if(th){setPref("theme",th.dataset.themeSet);applyTheme();$$("[data-theme-set]").forEach(b=>b.classList.toggle("on",b===th));redrawCharts();renderHero();return}
 const rv=t.closest("[data-rev]");if(rv){S.review={kind:rv.dataset.rev,order:null};$("#sheet-p").innerHTML=`<div class="grab"></div>`+reviewHTML();bindDeck();return}
 const dxb=t.closest("[data-dx]");if(dxb){e.preventDefault();e.stopPropagation();dismiss(dxb.dataset.dx,dxb.dataset.dxs,dxb.dataset.dxl);return}
 const mr=t.closest("[data-mk-range]");if(mr){S.mk.range=mr.dataset.mkRange;LS.set("sd-mk-range",S.mk.range);syncRanges();$$("[data-mk-range]").forEach(b=>{b.classList.toggle("on",b===mr);b.setAttribute("aria-selected",b===mr)});drawMk();await loadMkSeries();return}
 const ms=t.closest("[data-mk]");if(ms){const i=ms.dataset.mk.indexOf("|");S.mk.k=ms.dataset.mk.slice(0,i);S.mk.s=ms.dataset.mk.slice(i+1);LS.set("sd-mk-sel",{k:S.mk.k,s:S.mk.s});syncRanges();renderMkt();await loadMkSeries();if(isCx())loadCxDaily(S.mk.s).then(renderMkCtx).catch(()=>{});return}
 const tg=t.closest("[data-tag]");if(tg){S.news.tag=tg.dataset.tag;S.news.open=false;renderNews();return}
 const sv=t.closest("[data-save]");if(sv){toggleSave(sv.dataset.save,sv.dataset.url);return}
 const hs=t.closest("[data-hist]");if(hs){const k=hs.dataset.hist;S.learn[k]=+hs.dataset.i;const card=hs.closest(".lw");const y=card.getBoundingClientRect().top;const sl=$(".hist",card).scrollLeft;card.outerHTML=learnCard(k);const nc=$(`#s-learn [data-learn="${k}"]`);if(nc){window.scrollBy(0,nc.getBoundingClientRect().top-y);const h=$(".hist",nc);if(h)h.scrollLeft=sl}return}
 const fl=t.closest("[data-flip]");if(fl){fl.classList.toggle("open");return}
 const sp=t.closest("[data-say]");if(sp){say(sp.dataset.say,sp.dataset.lang);return}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").classList.contains("open"))closeSheet();if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("li-")){const b=$(`[data-list-add="${e.target.id.slice(3)}"]`);if(b)b.click()}});
document.addEventListener("change",e=>{const c=e.target.closest("[data-sec-toggle]");if(c){const id=c.dataset.secToggle;c.checked?S.hidden.delete(id):S.hidden.add(id);setPref("hidden",[...S.hidden]);renderNav()}});

/* breakpoint: news count changes between phone and wide layouts */
WIDE.addEventListener?.("change",()=>{renderNews();renderBay();renderShows();renderMovies();$$(".rail").forEach(railArrows)});

/* resize */
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{redrawCharts();$$(".rail").forEach(railArrows)},120)});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{applyTheme();redrawCharts()});

/* pull to refresh (home-screen apps have no browser refresh) */
(()=>{let y0=null,pull=0;const ind=$("#ptr");ind.innerHTML=I.mark;
 addEventListener("touchstart",e=>{if(window.scrollY<=0&&!$("#sheet").classList.contains("open")&&!e.target.closest(".rail,.chart,.chips,.hist,.nav,.deck")){y0=e.touches[0].clientY;pull=0}else y0=null},{passive:true});
 addEventListener("touchmove",e=>{if(y0==null)return;pull=e.touches[0].clientY-y0;if(pull<=0){ind.style.opacity=0;return}const p=Math.min(1,pull/110);ind.style.opacity=p;ind.style.transform=`translateY(${(-24+p*34).toFixed(1)}px) rotate(${Math.round(p*300)}deg)`;ind.classList.toggle("ready",p>=1)},{passive:true});
 addEventListener("touchend",()=>{if(y0==null)return;if(pull>=110){ind.classList.add("spin");setTimeout(fresh,300)}else{ind.style.opacity=0;ind.classList.remove("ready")}y0=null},{passive:true});
})();

/* =================================================================
   FRESHNESS — home-screen apps resume a frozen copy.
   ================================================================= */
const SELF=location.href.split("#")[0].split("?")[0];
const loadedDay=todayKey();
function fresh(){location.replace(SELF+"?v="+Date.now())}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){hiddenAt=Date.now();stopWs();return}const away=hiddenAt?Date.now()-hiddenAt:0;if(away>10*6e4||todayKey()!==loadedDay)fresh();else{startWs();if(away>60e3){renderHero();loadLive()}else if(away>5e3)pullCfg()}});
addEventListener("pageshow",e=>{if(e.persisted)fresh()});
try{if(ED<todayKey()&&sessionStorage.getItem("sd-retry")!==todayKey()){sessionStorage.setItem("sd-retry",todayKey());fresh()}}catch(e){}

/* =================================================================
   BOOT
   ================================================================= */
function loadLive(){
 loadWeather().catch(()=>{});
 loadCx().then(startWs);
 loadYouTube(false);
 loadCowen();
 loadSpotify(false).then(loadSpArt);
 loadMovies(false);
 if(backend()){loadStQuotes().then(()=>{if(!isCx())return loadMkSeries()}).catch(()=>{});pullCfg()}
}
/* timers: weather every 10 min, stocks every minute, crypto fallback poll */
setInterval(()=>{if(!document.hidden)loadWeather().catch(()=>{})},10*6e4);
setInterval(()=>{if(!document.hidden&&backend())loadStQuotes()},60e3);
setInterval(()=>{if(!document.hidden&&!S.cx.liveOn)loadCxQuotes().then(()=>cxList().forEach(applyTick)).catch(()=>{});if(!document.hidden&&!S.cx.ws)startWs()},60e3);
/* the readouts follow the live loaders */
renderWatch=(f=>function(){f();renderTeasers()})(renderWatch);
renderListen=(f=>function(){f();renderTeasers()})(renderListen);
renderStocks=(f=>function(){f();renderTeasers()})(renderStocks);
(async function boot(){
 applyTheme();
 await fetchData();
 initData();
 const w=LS.get("sd-wx",null);if(w&&w.day===todayKey()&&Date.now()-w.t<36e5&&w.geo===!!LS.get("sd-geo",false))S.wx=w.v;
 const q=LS.get("sd-cx-q",null);if(q&&Date.now()-q.t<6*36e5){S.cx.q=q.v;S.cx.qAt=q.t}
 if(!cxList().includes(S.cx.sel))S.cx.sel=cxList()[0]||"BTC";
 mkValid();
 [S.cx.sel+"|"+S.cx.range].forEach(k=>{const c=LS.get("sd-cx-s-"+k,null);if(c&&Date.now()-c.t<6*36e5)S.cx.series[k]=c.v});
 const d=LS.get("sd-cx-d-"+S.cx.sel,null);if(d&&Date.now()-d.t<24*36e5)S.cx.daily[S.cx.sel]=d.v;
 if(!backend()&&!["1W","1M"].includes(S.st.range))S.st.range="1M";
 try{navigator.permissions&&navigator.permissions.query({name:"geolocation"}).then(p=>{if(p.state==="granted"&&!LS.get("sd-geo",false)&&LS.get("sd-geo-auto",true)){LS.set("sd-geo",true);LS.set("sd-geo-auto",false);loadWeather().catch(()=>{})}}).catch(()=>{})}catch(e){}
 shell();renderAll();loadLive();
})();
