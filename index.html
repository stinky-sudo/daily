<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="theme-color" content="#F1F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Stinky's Daily</title>
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter Display","Inter","Helvetica Neue",Arial,sans-serif;
  --serif:ui-serif,"New York","Iowan Old Style","Charter",Georgia,serif;
  --bg:#F1F2F4; --surface:#FFFFFF; --raise:#F7F8FA;
  --fill:rgba(20,24,32,.055); --fill-2:rgba(20,24,32,.1);
  --ink:#000000; --ink-2:#565B63; --ink-3:#8F949C; --line:rgba(0,0,0,.075);
  --link:#2B5EF0; --up:#0A9455; --down:#DD3B35;
  --seg-on:#FFFFFF; --nav:rgba(241,242,244,.92);
  --shadow:0 1px 2px rgba(16,20,28,.04),0 12px 32px -20px rgba(16,20,28,.22);
  --g:16px;
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#121315; --raise:#1A1B1E;
  --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.13);
  --ink:#FFFFFF; --ink-2:#A6AAB1; --ink-3:#6F737B; --line:rgba(255,255,255,.08);
  --link:#7A9DFF; --up:#2FCB7C; --down:#FF5A52;
  --seg-on:#2E2F33; --nav:rgba(0,0,0,.84); --shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#121315; --raise:#1A1B1E;
    --fill:rgba(255,255,255,.07); --fill-2:rgba(255,255,255,.13);
    --ink:#FFFFFF; --ink-2:#A6AAB1; --ink-3:#6F737B; --line:rgba(255,255,255,.08);
    --link:#7A9DFF; --up:#2FCB7C; --down:#FF5A52;
    --seg-on:#2E2F33; --nav:rgba(0,0,0,.84); --shadow:none;
  }
}

/* ============================================================
   BASE
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);font-size:16px;line-height:1.4;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
img{display:block}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:12px}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(36px + env(safe-area-inset-bottom))}
.num{font-variant-numeric:tabular-nums}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.press{transition:transform .12s ease}
.press:active{transform:scale(.975)}
.noscroll{scrollbar-width:none}
.noscroll::-webkit-scrollbar{display:none}
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:30;pointer-events:none}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding:calc(12px + env(safe-area-inset-top)) var(--g) 0}
.hero-top{display:flex;align-items:center;justify-content:space-between;min-height:38px}
.hero-date{font-size:15px;font-weight:600;color:var(--ink-2)}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.greet{font-family:var(--display);font-size:42px;line-height:1.02;letter-spacing:-.035em;font-weight:700;margin:4px 0 18px}

.sky{position:relative;border-radius:28px;padding:18px 18px 10px;color:#fff;overflow:hidden;isolation:isolate;background:var(--sky,#2F6FD6)}
.sky::after{content:"";position:absolute;inset:0;z-index:-1;background:rgba(96,106,124,.42);opacity:0;transition:opacity .4s}
.sky.overcast::after{opacity:1}
.sky[data-phase="night"]{--sky:linear-gradient(162deg,#0D1A3B 0%,#1E2E61 58%,#36427C 100%)}
.sky[data-phase="dawn"]{--sky:linear-gradient(162deg,#3B58A6 0%,#B3779C 58%,#F0A27E 100%)}
.sky[data-phase="day"]{--sky:linear-gradient(162deg,#1A59CB 0%,#3A82E4 56%,#78B0F0 100%)}
.sky[data-phase="golden"]{--sky:linear-gradient(162deg,#3A59AC 0%,#C46F8C 56%,#F2A35D 100%)}
.sky[data-phase="dusk"]{--sky:linear-gradient(162deg,#1A2250 0%,#493B7C 56%,#985A8D 100%)}
.sky-row{display:flex;align-items:flex-start;gap:14px}
.sky-temp{font-family:var(--display);font-size:68px;font-weight:300;letter-spacing:-.05em;line-height:.86}
.sky-cond{display:flex;flex-direction:column;gap:3px;padding-top:4px;min-width:0}
.sky-cond b{display:flex;align-items:center;gap:6px;font-size:17px;font-weight:600}
.sky-cond b svg{width:20px;height:20px}
.sky-cond span{font-size:14px;opacity:.86}
.sky-loc{margin-left:auto;font-size:13px;font-weight:600;opacity:.82;display:flex;align-items:center;gap:4px;padding-top:6px;white-space:nowrap}
.sky-loc svg{width:12px;height:12px}
.sky-plot{position:relative;height:104px;margin:12px -6px 0}
.sky-plot svg{position:absolute;inset:0;overflow:visible}
.sky-ax{position:absolute;left:0;right:0;bottom:0;height:16px;font-size:11.5px;font-weight:600;opacity:.8}
.sky-ax span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.sky-note{font-size:13px;opacity:.85;padding:8px 0 4px}

.glance{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gl{display:block;background:var(--surface);border-radius:20px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.gl-k{font-size:13px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.gl-k svg{width:14px;height:14px}
.gl-v{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.gl-c{font-size:13px;font-weight:600;margin-top:2px}
.gl-row{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.gl.next{grid-column:1/-1;display:flex;align-items:center;gap:12px}
.gl.next .ev-ic{width:42px;height:42px;font-size:21px;border-radius:13px}
.gl.next .t{font-size:16px;font-weight:650;line-height:1.25}
.gl.next .m{font-size:13.5px;color:var(--ink-2);margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}

/* ============================================================
   NAV
   ============================================================ */
.nav-sentinel{height:1px}
.nav{position:sticky;top:env(safe-area-inset-top);z-index:20;margin-top:16px;padding:8px 0;transition:background .2s,box-shadow .2s}
.nav.stuck{background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 var(--line)}
.nav-in{display:flex;gap:6px;overflow-x:auto;padding:0 var(--g)}
.nav-in a{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:14.5px;font-weight:600;color:var(--ink-2);background:var(--fill);transition:background .2s,color .2s}
.nav-in a.on{background:var(--ink);color:var(--bg)}

/* ============================================================
   SECTIONS
   ============================================================ */
.sec{padding:30px var(--g) 0;scroll-margin-top:calc(54px + env(safe-area-inset-top))}
.sec[hidden]{display:none}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 12px}
.sh h2{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.025em}
.sh .aux{font-size:14px;color:var(--ink-3);font-weight:500;text-align:right}
.sh a.aux,.sh button.aux{color:var(--link);font-weight:600}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;background:var(--fill);color:var(--ink);white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.pri{background:var(--ink);color:var(--bg)}
.more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:46px;margin-top:10px;border-radius:16px;background:var(--fill);font-size:15px;font-weight:600}
.more svg{width:16px;height:16px;transition:transform .2s}
.more.open svg{transform:rotate(180deg)}
.foot-note{font-size:13px;color:var(--ink-3);margin:10px 4px 0;line-height:1.4}
.foot-note button{color:var(--link);font-weight:600}

/* calendar */
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-size:14.5px;line-height:1.42;color:var(--ink-2);margin-bottom:12px}
.note svg{width:18px;height:18px;flex:0 0 auto;margin-top:1px;color:var(--link)}
.note b{color:var(--ink)}
.strip{display:flex;gap:4px;overflow-x:auto;margin:0 calc(-1*var(--g)) 12px;padding:2px var(--g)}
.sd{flex:0 0 46px;height:66px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent}
.sd .w{font-size:11.5px;font-weight:600;color:var(--ink-3)}
.sd .n{font-size:18px;font-weight:600;line-height:1}
.sd .dots{display:flex;gap:3px;height:5px}
.sd .dots i{width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.sd.has{background:var(--surface)}
.sd.today{background:var(--ink);color:var(--bg)}
.sd.today .w{color:inherit;opacity:.65}
.sd.today .dots i{background:currentColor;opacity:.8}
.sd.mon{margin-left:8px}
.agenda .grp{padding:14px 16px 6px;border-top:1px solid var(--line);scroll-margin-top:calc(70px + env(safe-area-inset-top))}
.agenda .grp:first-child{border-top:0}
.grp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.grp-h b{font-size:15px;font-weight:700}
.grp-h span{font-size:13px;color:var(--ink-3);font-weight:500}
.grp.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:var(--fill-2)}100%{background:transparent}}
.ev{display:flex;gap:12px;align-items:center;padding:8px 0}
.ev-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--fill);font-size:19px;flex:0 0 auto;color:var(--ink-2)}
.ev-ic svg{width:18px;height:18px}
.ev-x{min-width:0;flex:1}
.ev-t{font-size:15.5px;font-weight:600;line-height:1.28}
.ev-m{font-size:13px;color:var(--ink-2);margin-top:2px}
.empty{font-size:14px;color:var(--ink-3);padding:6px 0 10px}

/* markets */
.mk{padding:16px 16px 14px}
.mk+.mk{margin-top:12px}
.mk-head{display:flex;align-items:center;gap:10px}
.mk-head .logo{width:30px;height:30px}
.mk-name{font-size:17px;font-weight:700;line-height:1.15}
.mk-sub{font-size:13px;color:var(--ink-3);font-weight:500}
.live{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:5px 10px;border-radius:999px;background:var(--fill);white-space:nowrap}
.live i{width:6px;height:6px;border-radius:50%;background:var(--up);animation:pulse 2.2s ease-in-out infinite}
.live.off i{background:var(--ink-3);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.px{font-family:var(--display);font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:16px}
.chg{font-size:15px;font-weight:600;margin-top:7px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chg .lbl{color:var(--ink-3);font-weight:500}
.chart{position:relative;height:168px;margin:12px -16px 0;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:crosshair}
.chart svg{display:block;overflow:visible}
.chart-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--ink-3)}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin-top:8px}
.seg button{flex:1;height:30px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.stats dt{font-size:12.5px;color:var(--ink-3);font-weight:500}
.stats dd{margin:2px 0 0;font-size:15px;font-weight:600}
.take{margin-top:14px;padding:14px;border-radius:16px;background:var(--fill)}
.take-h{display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:#1F3A8A;flex:0 0 auto}
.take-h b{font-size:14.5px;display:block}
.take-h span{font-size:12.5px;color:var(--ink-3)}
.take p{font-size:15px;line-height:1.48;margin-top:10px}
.take .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.take .btn{background:var(--surface)}
.ix{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line);text-align:left;width:100%}
.ix.on{background:var(--fill)}
.ix-n b{font-size:15.5px;font-weight:650;display:block}
.ix-n span{font-size:12.5px;color:var(--ink-3)}
.ix-v{text-align:right}
.ix-v b{display:block;font-size:15.5px;font-weight:600}
.pill{display:inline-block;min-width:66px;text-align:center;padding:2px 6px;border-radius:7px;font-size:13px;font-weight:700;color:#fff;background:var(--up);margin-top:3px}
.pill.dn{background:var(--down)}
.why{padding:14px 16px 16px;border-top:1px solid var(--line)}
.why ul{list-style:none;margin:0;padding:0}
.why-h{font-size:15px;font-weight:700;margin-bottom:8px}
.why li{position:relative;padding-left:16px;font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.why li+li{margin-top:7px}
.why li::before{content:"";position:absolute;left:3px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--ink-3)}

/* news */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 calc(-1*var(--g)) 12px;padding:0 var(--g)}
.chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:999px;background:var(--fill);font-size:14.5px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg)}
.nw{position:relative;padding:15px 16px;border-top:1px solid var(--line)}
.nw:first-child{border-top:0}
.nw-src{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);font-weight:500}
.nw-src img{width:16px;height:16px;border-radius:4px;background:var(--fill)}
.nw-src b{color:var(--ink-2);font-weight:600}
.nw-src .dt{margin-left:auto}
.nw h3{font-size:17px;line-height:1.28;font-weight:650;letter-spacing:-.01em;margin-top:7px}
.nw.lead h3{font-family:var(--display);font-size:24px;line-height:1.14;letter-spacing:-.022em;font-weight:700}
.nw p{font-size:14.5px;line-height:1.45;color:var(--ink-2);margin-top:5px}
.nw .stretch::after{content:"";position:absolute;inset:0;z-index:0}
.nw-acts{position:relative;z-index:1;display:flex;gap:6px;margin-top:11px}
.mini{height:30px;padding:0 11px;border-radius:999px;background:var(--fill);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--ink-2)}
.mini svg{width:14px;height:14px}

/* watch */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--g));padding:2px var(--g) 6px;scroll-padding:0 var(--g)}
.vid{flex:0 0 calc(100% - 40px);scroll-snap-align:start;background:var(--surface);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.vid-th{position:relative;aspect-ratio:16/9;background:#15161A;overflow:hidden}
.vid-th img{width:100%;height:100%;object-fit:cover}
.vid-th .dur{position:absolute;right:9px;bottom:9px;font-size:12.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.74);padding:2px 7px;border-radius:7px}
.vid-th .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;color:#fff;background:radial-gradient(130% 120% at 0% 100%,var(--c1,#3A3F4A) 0%,var(--c2,#121317) 70%)}
.vid-th .ph{align-items:flex-start}
.vid-th .ph .ph-yt{width:34px;height:24px;display:inline-flex;margin-bottom:auto}
.vid-th .ph strong{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:-.03em;font-weight:700}
.vid-th .ph small{font-size:13px;font-weight:600;opacity:.7;margin-top:6px}
.vid-b{padding:12px 15px 15px}
.vid-ch{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3)}
.vid-ch .ava{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--fill);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--ink-2)}
.vid-ch b{color:var(--ink);font-weight:650}
.vid-ch .sep{margin-left:auto}
.vid h3{font-size:17px;line-height:1.26;font-weight:650;margin-top:8px}
.vid p{font-size:14.5px;line-height:1.42;color:var(--ink-2);margin-top:6px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--fill-2);transition:width .25s,background .25s}
.dots i.on{width:18px;background:var(--ink)}

/* listen */
.pod{position:relative;display:flex;gap:14px;padding:15px 16px;border-top:1px solid var(--line)}
.pod:first-child{border-top:0}
.pod .cv{width:78px;height:78px;border-radius:14px;object-fit:cover;flex:0 0 auto;background:var(--fill)}
.pod-x{min-width:0;flex:1}
.pod-show{font-size:13px;font-weight:600;color:var(--ink-3)}
.pod h3{font-size:16px;line-height:1.26;font-weight:650;margin-top:3px}
.pod p{font-size:14px;line-height:1.4;color:var(--ink-2);margin-top:5px}
.pod-meta{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13px;color:var(--ink-3);font-weight:500;white-space:nowrap;min-width:0}
.pod-meta .sp{display:inline-flex;align-items:center;gap:5px;color:#1AA34A;font-weight:650}
.pod-meta .sp svg{width:15px;height:15px}
.pod-meta .ap{position:relative;z-index:1;margin-left:auto;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px;padding:4px 0 4px 8px}
.pod-meta .ap svg{width:14px;height:14px}
.pod .stretch::after{content:"";position:absolute;inset:0;z-index:0}

/* weekend */
.wk{position:relative;display:flex;gap:14px;padding:15px 16px;border-top:1px solid var(--line)}
.wk:first-child{border-top:0}
.wk-d{flex:0 0 52px;text-align:center;padding-top:2px}
.wk-d small{display:block;font-size:12px;font-weight:700;color:var(--link);white-space:nowrap}
.wk-d b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1.05;letter-spacing:-.02em}
.wk-x{min-width:0;flex:1}
.wk h3{font-size:16.5px;line-height:1.26;font-weight:650}
.wk p{font-size:14.5px;line-height:1.42;color:var(--ink-2);margin-top:4px}
.wk-tip{display:flex;gap:6px;font-size:13px;color:var(--ink-3);margin-top:7px;line-height:1.35}
.wk-tip svg{width:14px;height:14px;flex:0 0 auto;margin-top:1px}
.wk-acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}

.sheet{position:fixed;inset:0;z-index:50;display:none}

.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,.7,.2,1)}
.sw:checked{background:#34C759}
.sw:checked::after{transform:translateX(20px)}
.inp{width:100%;height:46px;border-radius:12px;border:0;background:var(--fill);padding:0 12px;font:inherit;font-size:16px;color:var(--ink);outline:none}
.inp:focus{box-shadow:0 0 0 2px var(--link)}
.inp-row{display:flex;gap:8px}

.tag button{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.tag button svg{width:12px;height:12px}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);margin-top:10px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.status.ok i{background:var(--up)}.status.err i{background:var(--down)}

/* review deck */
.deck{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(-1*var(--g));padding:4px var(--g) 8px;scroll-padding:0 var(--g)}
.rc{flex:0 0 calc(100% - 32px);scroll-snap-align:center;height:300px;perspective:900px}
.rc .fc-in{border-radius:24px}
.rc .fc-f,.rc .fc-b{border-radius:24px;flex-direction:column;padding:22px;gap:10px}
.rc .fc-f{background:var(--surface);box-shadow:var(--shadow)}
.rc .fc-f b{font-family:var(--serif);font-size:38px;font-weight:600;line-height:1.08}
.rc.es .fc-f b{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
.rc .fc-f small,.rc .fc-b small{font-size:13px;font-weight:600;opacity:.6}
.rc .fc-b{font-size:17px;line-height:1.45;font-weight:500}
.rc .fc-b em{font-family:var(--serif);font-size:15px;opacity:.8}
.deck-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}

/* toast + pull to refresh */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ptr{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.14);display:grid;place-items:center;z-index:40;opacity:0;pointer-events:none;color:var(--ink-3)}
.ptr svg{width:18px;height:18px}
.ptr.ready{color:var(--ink)}
.ptr.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (min-width:700px){
  .vid{flex-basis:calc(50% - 6px)}
  .greet{font-size:48px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}

 if(c===0)return{l:isDay?"Clear":"Clear night",i:isDay?"sun":"moon",o:0};
 if(c===1)return{l:"Mostly clear",i:isDay?"sun":"moon",o:0};
 if(c===2)return{l:"Partly cloudy",i:"partly",o:0};
 if(c===3)return{l:"Overcast",i:"cloud",o:1};
 if(c===45||c===48)return{l:"Fog",i:"fog",o:1};
 if(c>=51&&c<=57)return{l:"Drizzle",i:"rain",o:1};
 if(c>=61&&c<=67)return{l:c>=65?"Heavy rain":"Rain",i:"rain",o:1};
 if(c>=71&&c<=77)return{l:"Snow",i:"snow",o:1};
 if(c>=80&&c<=82)return{l:"Showers",i:"rain",o:1};
 if(c>=95)return{l:"Thunderstorms",i:"storm",o:1};
 return{l:"Fair",i:"partly",o:0};
}

function smoothPath(P){if(P.length<2)return"";let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}

 const X=i=>i/(n-1)*W,Y=t=>top+(1-(t-mn)/(mx-mn))*(bot-top);
 const P=w.win.map((p,i)=>[X(i),Y(p.temp)]);const d=smoothPath(P);
 const t0=Date.parse(w.win[0].t+":00Z");const span=(n-1)*36e5;
 const nowPseudo=Date.parse(todayKey()+"T"+String(hourIn()).padStart(2,"0")+":"+String(minuteIn()).padStart(2,"0")+":00Z");
 const fx=v=>Math.max(0,Math.min(1,(v-t0)/span));
 const nx=fx(nowPseudo)*W;const ni=Math.min(n-1,Math.floor(fx(nowPseudo)*(n-1)));const nf=fx(nowPseudo)*(n-1)-ni;
 const ny=ni<n-1?P[ni][1]+(P[ni+1][1]-P[ni][1])*nf:P[n-1][1];
 const imax=ts.indexOf(Math.max(...ts)),imin=ts.indexOf(Math.min(...ts));

 const marks=[];

 const lab=(i,above)=>{const x=Math.min(W-12,Math.max(12,P[i][0]));const y=above?P[i][1]-8:P[i][1]+17;return`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${ts[i]}°</text>`};
 const ax=[];w.win.forEach((p,i)=>{const hh=+p.t.slice(11,13);if(i>0&&i<n-1&&hh%3===0){const x=X(i);if(Math.abs(x-nx)>26)ax.push(`<span style="left:${(x/W*100).toFixed(2)}%">${hh%12||12}${hh<12?"AM":"PM"}</span>`)}});

function evWhen(e){
 if(e.allDay)return e.endDate&&e.endDate!==e.date?(dayDiff(e.date,e.endDate)===1&&fmtKey(e.date,{weekday:"short"})==="Sat"?"All weekend":`Through ${fmtKey(e.endDate,{weekday:"short",month:"short",day:"numeric"})}`):"All day";
 const z=e.tz==="CT"?"America/Chicago":TZ,suf=e.tz==="CT"?" CT":"";
 const hrs=(e.en-e.s)/36e5;
 if(hrs>=20)return`${fmtTime(e.s,z)} – ${e.en.toLocaleDateString("en-US",{weekday:"short",timeZone:z})} ${fmtTime(e.en,z)}${suf}`;
 return`${fmtTime(e.s,z)} – ${fmtTime(e.en,z)}${suf}`;
}

 <g class="cur" style="display:none"><line y1="0" y2="${H}" style="stroke:var(--ink-2)" stroke-width="1"/><circle r="5" fill="${col}" style="stroke:var(--surface)" stroke-width="2.5"/></g></svg>`;

const ytKey=()=>LS.get("sd-yt-key","")||CONFIG.youtube.apiKey||"";

function vidCard(v){
 const dur=v.secs?clock(v.secs):v.dur||"";
 const th=v.thumb||(v.id?`https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg`:"");
 const thumb=th?`<img src="${esc(th)}" alt="" loading="lazy" data-vid="${esc(v.id||"")}">`:`<div class="ph" style="--c1:${v.c1||"#3A3F4A"};--c2:${v.c2||"#121317"}"><span class="ph-yt">${I.yt}</span><strong>${esc(v.channel)}</strong><small>New upload</small></div>`;
 const ava=v.avatar?`<img class="ava" src="${esc(v.avatar)}" alt="">`:`<span class="ava">${esc(v.channel.replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase())}</span>`;
 const meta=[ago(v.published),v.views?compactViews(v.views):""].filter(Boolean).join(", ");
 return`<a class="vid press" href="${esc(v.url)}" target="_blank" rel="noopener"><div class="vid-th">${thumb}${dur?`<span class="dur num">${esc(dur)}</span>`:""}</div><div class="vid-b"><div class="vid-ch">${ava}<b>${esc(v.channel)}</b><span class="sep">${esc(meta)}</span></div><h3 class="clamp2">${esc(v.title)}</h3>${v.desc?`<p class="clamp3">${esc(v.desc)}</p>`:""}</div></a>`;
}
const compactViews=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+"M views":n>=1e3?Math.round(n/1e3)+"K views":n+" views";
function renderWatch(){
 const el=$("#s-watch");const items=S.yt.items&&S.yt.items.length?S.yt.items:DATA.youtube;const live=S.yt.source==="live"&&S.yt.items&&S.yt.items.length;
 const nCh=new Set(items.map(v=>v.channel)).size;
 const note=live?`Live from YouTube, updated ${fmtTime(new Date(S.yt.updated))}.`:ytKey()?(S.yt.error?`YouTube didn't respond (${esc(S.yt.error)}). Showing this morning's picks. <button data-act="settings">Settings</button>`:"Checking YouTube for new uploads…"):`This morning's picks. <button data-act="settings">Add a YouTube key</button> to load new uploads live.`;
 el.innerHTML=`<div class="sh"><h2>Watch</h2><span class="aux">${items.length} videos from ${nCh} channel${nCh===1?"":"s"}</span></div>
 <div class="rail noscroll" id="yt-rail">${items.map(vidCard).join("")}</div>
 <div class="dots" id="yt-dots">${items.length>1?items.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join(""):""}</div>
 <p class="foot-note" style="text-align:center">${note}</p>`;
 const rail=$("#yt-rail");
 rail.addEventListener("scroll",()=>{const cards=rail.children;if(!cards.length)return;const w=cards[0].offsetWidth+12;const i=Math.round(rail.scrollLeft/w);$$("#yt-dots i").forEach((d,j)=>d.classList.toggle("on",j===i))},{passive:true});
 $$("img[data-vid]",rail).forEach(img=>{const fix=()=>{if(img.dataset.fb)return;img.dataset.fb=1;img.src=`https://i.ytimg.com/vi/${img.dataset.vid}/hqdefault.jpg`};img.addEventListener("error",fix);img.addEventListener("load",()=>{if(img.naturalWidth&&img.naturalWidth<200)fix()})});
}
async function yt(path,params){const u=new URL("https://www.googleapis.com/youtube/v3/"+path);Object.entries({...params,key:ytKey()}).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u);const j=await r.json();if(j.error)throw new Error((j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||j.error.message||"error");return j}
async function ytChannel(handle){const ck="sd-ytc-"+handle.toLowerCase();const c=LS.get(ck,null);if(c&&c.id)return c;const j=await yt("channels",{part:"snippet,contentDetails",forHandle:handle});const it=j.items&&j.items[0];if(!it)throw new Error("not found");const v={id:it.id,title:it.snippet.title,avatar:(it.snippet.thumbnails&&(it.snippet.thumbnails.default||{}).url)||"",uploads:it.contentDetails.relatedPlaylists.uploads};LS.set(ck,v);return v}
function pickDesc(t){if(!t)return"";const bad=/https?:|www\.|sponsor|%\s*off|\bcode\b|subscribe|merch|patreon|instagram|twitter|tiktok|discord|affiliate|follow (me|us)|#\w|^@|^[-—_=]+$/i;const s=t.split(/\n+/).map(x=>x.trim()).find(x=>x.length>24&&!bad.test(x));return s?clip(s,170):""}
const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,40);
async function loadYouTube(force){
 if(!ytKey())return;
 const sig=ytChannels().join(",").toLowerCase();const cache=LS.get("sd-yt-cache",null);
 if(cache&&cache.sig===sig){S.yt={items:cache.items,source:"live",updated:cache.t,error:""};renderWatch();if(!force&&Date.now()-cache.t<CONFIG.youtube.cacheMinutes*6e4)return}
 try{
  const chans=(await Promise.all(ytChannels().map(h=>ytChannel(h).catch(()=>null)))).filter(Boolean);
  if(!chans.length)throw new Error("no channels found");
  const lists=await Promise.all(chans.map(async ch=>{let j;try{j=await yt("playlistItems",{part:"contentDetails",maxResults:"6",playlistId:"UULF"+ch.id.slice(2)})}catch(e){j=await yt("playlistItems",{part:"contentDetails",maxResults:"8",playlistId:ch.uploads})}return(j.items||[]).map(i=>({vid:i.contentDetails.videoId,ch}))}));
  const flat=lists.flat();if(!flat.length)throw new Error("no uploads");
  const vj=await yt("videos",{part:"snippet,contentDetails,statistics",id:flat.map(f=>f.vid).join(",")});
  const by={};(vj.items||[]).forEach(v=>by[v.id]=v);
  const curated={};DATA.youtube.forEach(v=>{if(v.id)curated[v.id]=v.desc;curated["t"+norm(v.title)]=v.desc});
  let all=flat.map(f=>{const v=by[f.vid];if(!v)return null;const secs=isoSecs(v.contentDetails.duration);if(secs<90)return null;const th=v.snippet.thumbnails||{};return{id:f.vid,channel:f.ch.title,avatar:f.ch.avatar,title:v.snippet.title,desc:curated[f.vid]||curated["t"+norm(v.snippet.title)]||pickDesc(v.snippet.description),published:v.snippet.publishedAt,secs,views:+((v.statistics||{}).viewCount)||0,thumb:(th.maxres||th.standard||th.high||th.medium||{}).url||"",url:"https://www.youtube.com/watch?v="+f.vid}}).filter(Boolean).sort((a,b)=>Date.parse(b.published)-Date.parse(a.published));
  const cutoff=Date.now()-CONFIG.youtube.maxAgeDays*864e5,per={};
  let items=all.filter(x=>Date.parse(x.published)>=cutoff).filter(x=>(per[x.channel]=(per[x.channel]||0)+1)<=CONFIG.youtube.perChannel);
  if(!items.length)items=all.slice(0,4);
  S.yt={items,source:"live",updated:Date.now(),error:""};LS.set("sd-yt-cache",{t:Date.now(),sig,items});
 }catch(e){S.yt.error=String(e.message||e).slice(0,60);if(!S.yt.items)S.yt.source="seed"}
 renderWatch();
}

function jsonp(url,ms=9000){return new Promise((res,rej)=>{const cb="__sd"+Math.random().toString(36).slice(2);const s=document.createElement("script");const done=()=>{clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()};const t=setTimeout(()=>{done();rej(new Error("timeout"))},ms);window[cb]=d=>{done();res(d)};s.onerror=()=>{done();rej(new Error("network"))};s.src=url+(url.includes("?")?"&":"?")+"callback="+cb;document.head.appendChild(s)})}
const cleanTitle=t=>String(t||"").replace(/\s*\|\s*(MOONSHOTS[^|]*)$/i,"").replace(/\s*[|\-–]\s*(EP\s*)?#\d+\s*(\|.*)?$/i,"").replace(/\s*#\d+\s*$/,"").replace(/\s*\|\s*(MOONSHOTS[^|]*)$/i,"").trim();
const spotifyUrl=p=>"https://open.spotify.com/search/"+encodeURIComponent(cleanTitle(p.title).split(" - ")[0]+" "+p.show)+"/episodes";
function podDesc(t){const paras=String(t||"").split(/\n\s*\n/).map(x=>x.replace(/\s+/g," ").trim()).filter(x=>x.length>30&&!/https?:|learn more|sponsor|^expect to learn:?$|recorded on|views expressed/i.test(x)&&!/:$/.test(x));return clip(paras[0]||"",180)}

 if(cache&&cache.items&&cache.items.length){S.pods={items:cache.items,source:"live",updated:cache.t};renderListen();if(!force&&Date.now()-cache.t<60*6e4)return}

  const items=shows.flat().sort((a,b)=>Date.parse(b.published)-Date.parse(a.published));
  if(items.length){S.pods={items,source:"live",updated:Date.now()};LS.set("sd-pod-cache",{t:Date.now(),items})}
 }catch(e){}

   SOMETHING DIFFERENT
   ================================================================= */
function renderDiff(){const d=DATA.different;$("#s-diff").innerHTML=`<div class="feat"><small>Something different</small><h3>${esc(d.title)}</h3><p>${esc(d.blurb)}</p><div class="acts"><a class="btn pri press" href="${esc(d.url)}" target="_blank" rel="noopener">Read</a>${d.ask?`<a class="btn press" href="${askUrl(d.ask)}" target="_blank" rel="noopener">${I.spark}Ask Claude</a>`:""}</div></div>`}

/* =================================================================
   LEARN
   ================================================================= */
function histChips(list,sel,kind,label){return list.length>1?`<div class="hist noscroll">${list.map((e,i)=>`<button class="hc press ${i===sel?"on":""}" data-hist="${kind}" data-i="${i}"><small>${i===0&&e.date===ED?"Today":esc(fmtKey(e.date,{weekday:"short",month:"short",day:"numeric"}))}</small><span>${esc(label(e))}</span></button>`).join("")}</div>`:""}
function renderLearn(){
 const el=$("#s-learn");const v=VOCAB[S.learn.v]||VOCAB[0],s=SPAN[S.learn.s]||SPAN[0];
 el.innerHTML=`<div class="sh"><h2>Learn</h2><button class="aux" data-act="review">Review deck</button></div>
 ${v?`<div class="card lw"><div class="lw-k"><span>Word of the day</span><span>${VOCAB.length} saved</span></div>
  <div class="word" lang="en">${esc(v.word)}</div><div class="pron">${esc(v.pron)} &nbsp;<i>${esc(v.pos||"")}</i></div>
  <p class="def">${esc(v.def)}</p>${v.ex?`<p class="ex">${esc(v.ex)}</p>`:""}
  <div class="acts"><button class="btn pri press" data-say="${esc(v.word)}" data-lang="en-US">${I.speaker}Hear it</button><a class="btn press" href="${askUrl(`Give me 3 natural sentences using "${v.word}" and 2 synonyms.`)}" target="_blank" rel="noopener">${I.spark}Use it</a></div>
  ${histChips(VOCAB,S.learn.v,"v",e=>e.word)}</div>`:""}
 ${s?`<div class="card lw"><div class="lw-k"><span>Quick Spanish</span><span>${SPAN.length} saved</span></div>
  <div class="phrase" lang="es">${esc(s.phrase)}</div><div class="pron">${esc(s.pron)}</div>
  <p class="def">${esc(s.meaning)}</p>${s.note?`<p class="pron" style="line-height:1.45">${esc(s.note)}</p>`:""}
  ${s.cards&&s.cards.length?`<div class="fcs">${s.cards.map(c=>`<button class="fc" data-flip aria-label="${esc(c.es)}"><div class="fc-in"><div class="fc-f" lang="es">${esc(c.es)}</div><div class="fc-b">${esc(c.en)}</div></div></button>`).join("")}</div>`:""}
  <div class="acts"><button class="btn pri press" data-say="${esc(s.phrase)}" data-lang="es-MX">${I.speaker}Hear it</button><a class="btn press" href="${askUrl(`Teach me a 2-minute Spanish lesson around "${s.phrase}".`)}" target="_blank" rel="noopener">${I.spark}Practice</a></div>
  ${histChips(SPAN,S.learn.s,"s",e=>e.phrase)}</div>`:""}`;
}

/* =================================================================
   FOOTER
   ================================================================= */
function renderFoot(){const u=new Date(DATA.updated);$("#foot").innerHTML=`<div><b>Stinky's Daily No. ${editionNo()}</b></div><div>Updated ${esc(u.toLocaleDateString("en-US",{month:"short",day:"numeric",timeZone:TZ}))} at ${esc(fmtTime(u))}. Pull down anywhere at the top to refresh.</div><button class="btn press" data-act="refresh">${I.refresh}Refresh now</button>`}

/* =================================================================
   SHEETS
   ================================================================= */
function openSheet(html){const sh=$("#sheet"),p=$("#sheet-p");p.innerHTML=`<div class="grab"></div>`+html;p.scrollTop=0;sh.classList.add("open");requestAnimationFrame(()=>requestAnimationFrame(()=>sh.classList.add("show")));document.documentElement.style.overflow="hidden"}
function closeSheet(){const sh=$("#sheet");sh.classList.remove("show");document.documentElement.style.overflow="";setTimeout(()=>{if(!sh.classList.contains("show"))sh.classList.remove("open")},340)}
function settingsHTML(){
 const t=LS.get("sd-theme","auto"),key=ytKey(),stored=!!LS.get("sd-yt-key","");
 const st=!key?["","No key yet. Showing the morning picks."]:S.yt.error?["err","Last check failed: "+S.yt.error]:S.yt.source==="live"?["ok","Connected. Updated "+fmtTime(new Date(S.yt.updated))+"."]:["","Key saved. Loading…"];
 return`<div class="sheet-h"><h3 id="sheet-title">Settings</h3><button class="icon-btn press" data-act="close-sheet" aria-label="Close">${I.close}</button></div>
 <div class="set-l">Appearance</div>
 <div class="seg" style="margin:0 0 20px" role="tablist">${["auto","light","dark"].map(x=>`<button class="${x===t?"on":""}" data-theme-set="${x}" role="tab" aria-selected="${x===t}">${x==="auto"?"Automatic":x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>
 <div class="set-l">YouTube</div>
 <div class="set-g"><div class="set-pad">
  <div class="inp-row"><input class="inp" id="yt-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${stored?"Key saved on this device":"Paste a YouTube Data API key"}" aria-label="YouTube API key"><button class="btn pri press" data-act="yt-save">Save</button></div>
  <div class="status ${st[0]}"><i></i><span>${esc(st[1])}</span>${stored?`<button style="margin-left:auto;color:var(--down);font-weight:600" data-act="yt-clear">Remove</button>`:""}</div>
 </div>
 <div class="set-pad" style="border-top:1px solid var(--line)"><div style="font-size:15px;font-weight:600">Channels</div>
  <div class="tags">${ytChannels().map(h=>`<span class="tag">${esc(h)}<button data-ch-del="${esc(h)}" aria-label="Remove ${esc(h)}">${I.close}</button></span>`).join("")}</div>
  <div class="inp-row" style="margin-top:10px"><input class="inp" id="yt-ch" placeholder="@handle" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Add a channel handle"><button class="btn press" data-act="ch-add">Add</button></div>
 </div></div>
 <p class="set-help" style="margin-top:-12px;margin-bottom:20px">The key stays on this device and never goes into your public repo. In Google Cloud, restrict it to the YouTube Data API v3 and to <b>https://stinky-sudo.github.io/*</b>. <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">Open Google Cloud</a></p>
 <div class="set-l">Sections</div>
 <div class="set-g">${SECTIONS.map(([id,l])=>`<label class="set-r"><span>${esc(l)}</span><input type="checkbox" class="sw" data-sec-toggle="${id}" ${S.hidden.has(id)?"":"checked"}></label>`).join("")}</div>
 <div class="set-g"><button class="set-r" style="width:100%;color:var(--link);font-weight:600" data-act="refresh">Refresh now</button><button class="set-r" style="width:100%;color:var(--down);font-weight:600" data-act="clear-cache">Clear cached data</button></div>
 <p class="set-help">Edition ${esc(ED)}. Weather from Open-Meteo, Bitcoin from CoinGecko, podcasts from Apple's directory.</p>`;
}
function reviewHTML(){
 const k=S.review.kind,list=k==="v"?VOCAB:SPAN;const ord=S.review.order||list.map((_,i)=>i);
 return`<div class="sheet-h"><h3 id="sheet-title">Review</h3><button class="icon-btn press" data-act="close-sheet" aria-label="Close">${I.close}</button></div>
 <div class="seg" style="margin:0 0 16px" role="tablist"><button class="${k==="v"?"on":""}" data-rev="v" role="tab">Words (${VOCAB.length})</button><button class="${k==="s"?"on":""}" data-rev="s" role="tab">Spanish (${SPAN.length})</button></div>
 <div class="deck noscroll" id="deck">${ord.map(i=>{const e=list[i];return k==="v"?`<button class="rc fc" data-flip><div class="fc-in"><div class="fc-f"><small>${esc(fmtKey(e.date,{month:"short",day:"numeric"}))}</small><b>${esc(e.word)}</b><small>Tap to reveal</small></div><div class="fc-b"><small>${esc(e.pos||"")}</small><span>${esc(e.def)}</span>${e.ex?`<em>${esc(e.ex)}</em>`:""}</div></div></button>`:`<button class="rc es fc" data-flip><div class="fc-in"><div class="fc-f"><small>${esc(fmtKey(e.date,{month:"short",day:"numeric"}))}</small><b lang="es">${esc(e.phrase)}</b><small>Tap to reveal</small></div><div class="fc-b"><span>${esc(e.meaning)}</span><em>${esc(e.pron)}</em></div></div></button>`}).join("")}</div>
 <div class="deck-foot"><span class="foot-note" id="deck-n" style="margin:0">1 of ${list.length}</span><button class="btn press" data-act="shuffle">${I.shuffle}Shuffle</button></div>`;
}
function bindDeck(){const d=$("#deck");if(!d)return;d.addEventListener("scroll",()=>{const c=d.children[0];if(!c)return;const i=Math.round(d.scrollLeft/(c.offsetWidth+12));const n=$("#deck-n");if(n)n.textContent=`${Math.min(d.children.length,i+1)} of ${d.children.length}`},{passive:true})}

/* =================================================================
   INTERACTION
   ================================================================= */
let tt;function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),1500)}
function applyTheme(){const t=LS.get("sd-theme","auto");if(t==="auto")delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;const dark=t==="dark"||(t==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);$$('meta[name="theme-color"]').forEach(m=>m.remove());const m=document.createElement("meta");m.name="theme-color";m.content=dark?"#000000":"#F1F2F4";document.head.appendChild(m)}
function redrawCharts(){drawSky();drawBtc();drawStk()}
document.addEventListener("click",async e=>{
 const t=e.target;
 const a=t.closest("[data-act]");
 if(a){const act=a.dataset.act;
  if(act==="settings"){openSheet(settingsHTML());return}
  if(act==="close-sheet"){closeSheet();return}
  if(act==="review"){S.review={kind:"v",order:null};openSheet(reviewHTML());bindDeck();return}
  if(act==="shuffle"){const list=S.review.kind==="v"?VOCAB:SPAN;S.review.order=list.map((_,i)=>i).sort(()=>Math.random()-.5);$("#sheet-p").innerHTML=`<div class="grab"></div>`+reviewHTML();bindDeck();return}
  if(act==="cal-more"){S.calOpen=!S.calOpen;renderCal();if(!S.calOpen)$("#s-cal").scrollIntoView({behavior:"smooth"});return}
  if(act==="news-more"){S.news.open=!S.news.open;renderNews();return}
  if(act==="refresh"){toast("Refreshing");setTimeout(fresh,200);return}
  if(act==="clear-cache"){Object.keys(localStorage).filter(k=>/^sd-(yt-cache|ytc-|pod-|pid-|btc-|wx)/.test(k)).forEach(k=>LS.del(k));toast("Cache cleared");setTimeout(fresh,400);return}
  if(act==="yt-save"){const v=($("#yt-key").value||"").trim();if(!v){toast("Paste a key first");return}LS.set("sd-yt-key",v);LS.del("sd-yt-cache");S.yt={items:null,source:"seed",updated:0,error:""};toast("Key saved");renderWatch();await loadYouTube(true);$("#sheet-p").innerHTML=`<div class="grab"></div>`+settingsHTML();toast(S.yt.error?"YouTube said: "+S.yt.error:"YouTube connected");return}
  if(act==="yt-clear"){LS.del("sd-yt-key");LS.del("sd-yt-cache");S.yt={items:null,source:"seed",updated:0,error:""};renderWatch();$("#sheet-p").innerHTML=`<div class="grab"></div>`+settingsHTML();toast("Key removed");return}
  if(act==="ch-add"){let h=($("#yt-ch").value||"").trim();if(!h)return;if(!h.startsWith("@"))h="@"+h;const list=ytChannels().slice();if(!list.map(x=>x.toLowerCase()).includes(h.toLowerCase()))list.push(h);LS.set("sd-yt-channels",list);$("#sheet-p").innerHTML=`<div class="grab"></div>`+settingsHTML();loadYouTube(true);return}
 }
 const cd=t.closest("[data-ch-del]");if(cd){const list=ytChannels().filter(x=>x!==cd.dataset.chDel);LS.set("sd-yt-channels",list);$("#sheet-p").innerHTML=`<div class="grab"></div>`+settingsHTML();loadYouTube(true);return}
 const th=t.closest("[data-theme-set]");if(th){LS.set("sd-theme",th.dataset.themeSet);applyTheme();$$("[data-theme-set]").forEach(b=>b.classList.toggle("on",b===th));redrawCharts();renderHero();return}
 const rv=t.closest("[data-rev]");if(rv){S.review={kind:rv.dataset.rev,order:null};$("#sheet-p").innerHTML=`<div class="grab"></div>`+reviewHTML();bindDeck();return}
 const rg=t.closest("[data-range]");if(rg){S.btc.range=rg.dataset.range;LS.set("sd-btc-range",S.btc.range);$$("[data-range]").forEach(b=>{b.classList.toggle("on",b===rg);b.setAttribute("aria-selected",b===rg)});drawBtc();if(!S.btc.series[S.btc.range]){try{await loadBtcSeries(S.btc.range);S.btc.err=false}catch(err){S.btc.err=true}drawBtc()}return}
 const ix=t.closest("[data-ix]");if(ix){S.stk.sel=+ix.dataset.ix;$$("[data-ix]").forEach(b=>{const on=b===ix;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on)});drawStk();const ftn=$("#s-mkt .foot-note a");const x=DATA.markets.indices[S.stk.sel];if(ftn){ftn.href=x.url;ftn.textContent="Open "+x.name+" in Google Finance"}return}
 const tg=t.closest("[data-tag]");if(tg){S.news.tag=tg.dataset.tag;S.news.open=false;renderNews();return}
 const dy=t.closest("[data-day]");if(dy){const k=dy.dataset.day;let g=$("#day-"+k);if(!g){S.calOpen=true;renderCal();g=$("#day-"+k)}if(g){g.scrollIntoView({behavior:"smooth",block:"start"});g.classList.remove("flash");void g.offsetWidth;g.classList.add("flash")}else toast("Nothing on "+fmtKey(k,{weekday:"long",month:"short",day:"numeric"}));return}
 const hs=t.closest("[data-hist]");if(hs){S.learn[hs.dataset.hist]=+hs.dataset.i;const y=hs.closest(".lw").getBoundingClientRect().top;renderLearn();const lw=$$("#s-learn .lw")[hs.dataset.hist==="v"?0:VOCAB.length?1:0];if(lw){const ny=lw.getBoundingClientRect().top;window.scrollBy(0,ny-y);const sc=$(".hist",lw);const on=$(".hc.on",lw);if(sc&&on)sc.scrollLeft=on.offsetLeft-18}return}
 const fl=t.closest("[data-flip]");if(fl){fl.classList.toggle("open");return}
 const sp=t.closest("[data-say]");if(sp){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(sp.dataset.say);u.lang=sp.dataset.lang;u.rate=.88;const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith(u.lang.slice(0,2).toLowerCase()));const pref=vs.find(v=>v.lang===u.lang)||vs[0];if(pref)u.voice=pref;speechSynthesis.speak(u)}catch(err){toast("Audio isn't available here")}return}
 const sh=t.closest("[data-share]");if(sh){e.preventDefault();const url=sh.dataset.share,title=sh.dataset.title;if(navigator.share){try{await navigator.share({title,url})}catch(err){}}else{try{await navigator.clipboard.writeText(url);toast("Link copied")}catch(err){toast("Couldn't copy the link")}}return}
});
document.addEventListener("change",e=>{const c=e.target.closest("[data-sec-toggle]");if(c){const id=c.dataset.secToggle;c.checked?S.hidden.delete(id):S.hidden.add(id);LS.set("sd-hidden",[...S.hidden]);renderNav();observe()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#sheet").classList.contains("open"))closeSheet()});

/* nav: stuck state + active section */
let io1,io2;
function observe(){
 io1&&io1.disconnect();io2&&io2.disconnect();
 io1=new IntersectionObserver(([en])=>$("#nav").classList.toggle("stuck",!en.isIntersecting),{rootMargin:`-${Math.round(parseFloat(getComputedStyle($(".sbar")).height)||0)}px 0px 0px 0px`});io1.observe($("#nav-sentinel"));
 io2=new IntersectionObserver(ens=>{ens.forEach(en=>{if(en.isIntersecting){const id=en.target.dataset.sec;$$("#nav-in a").forEach(a=>{const on=a.dataset.nav===id;a.classList.toggle("on",on);if(on){const p=$("#nav-in");const x=a.offsetLeft-(p.clientWidth-a.offsetWidth)/2;p.scrollTo({left:x,behavior:"smooth"})}})}})},{rootMargin:"-40% 0px -55% 0px"});
 $$("[data-sec]").forEach(s=>io2.observe(s));
}

/* resize */
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(redrawCharts,120)});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{applyTheme();redrawCharts()});

/* pull to refresh (home-screen apps have no browser refresh) */
(()=>{let y0=null,pull=0;const ind=$("#ptr");ind.innerHTML=I.refresh;
 addEventListener("touchstart",e=>{if(window.scrollY<=0&&!$("#sheet").classList.contains("open")&&!e.target.closest(".rail,.chart,.strip,.chips,.hist,.nav,.deck")){y0=e.touches[0].clientY;pull=0}else y0=null},{passive:true});
 addEventListener("touchmove",e=>{if(y0==null)return;pull=e.touches[0].clientY-y0;if(pull<=0){ind.style.opacity=0;return}const p=Math.min(1,pull/110);ind.style.opacity=p;ind.style.transform=`translateY(${(-24+p*34).toFixed(1)}px) rotate(${Math.round(p*300)}deg)`;ind.classList.toggle("ready",p>=1)},{passive:true});
 addEventListener("touchend",()=>{if(y0==null)return;if(pull>=110){ind.classList.add("spin");setTimeout(fresh,300)}else{ind.style.opacity=0;ind.classList.remove("ready")}y0=null},{passive:true});
})();

/* =================================================================
   FRESHNESS — home-screen apps resume a frozen copy.
   ================================================================= */
const SELF=location.href.split("#")[0].split("?")[0];
const loadedDay=todayKey();
function fresh(){location.replace(SELF+"?v="+Date.now())}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){hiddenAt=Date.now();return}const away=hiddenAt?Date.now()-hiddenAt:0;if(away>10*6e4||todayKey()!==loadedDay)fresh();else if(away>60e3){renderHero();loadLive()}});
addEventListener("pageshow",e=>{if(e.persisted)fresh()});
try{if(ED<todayKey()&&sessionStorage.getItem("sd-retry")!==todayKey()){sessionStorage.setItem("sd-retry",todayKey());fresh()}}catch(e){}

/* =================================================================
   BOOT
   ================================================================= */
function loadLive(){
 loadWeather().catch(()=>{});
 loadBtc();
 loadYouTube(false);
 loadPods(false);
}
(function boot(){
 applyTheme();
 const w=LS.get("sd-wx",null);if(w&&w.day===todayKey()&&Date.now()-w.t<3*36e5)S.wx=w.v;
 const q=LS.get("sd-btc-q",null);if(q&&Date.now()-q.t<6*36e5)S.btc.quote=q.v;
 ["1W",S.btc.range].forEach(r=>{const c=LS.get("sd-btc-s-"+r,null);if(c&&Date.now()-c.t<6*36e5)S.btc.series[r]=c.v});
 shell();renderAll();loadLive();
})();
</script>
