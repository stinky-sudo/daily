<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Stinky's Daily</title>
<style>
  :root{
    --bg:#F2F2F7;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    --r:26px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);font-family:var(--font);color:#000;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  body{padding-bottom:env(safe-area-inset-bottom,0px)}
  a{color:inherit;text-decoration:none}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
  :focus-visible{outline:3px solid #007AFF;outline-offset:2px;border-radius:12px}
  .app{max-width:430px;margin:0 auto;padding-bottom:40px}
  svg.logo{display:block;flex:0 0 auto}

  /* ---------- Hero: fades to pure white at the top ---------- */
  .hero{position:relative;padding:40px 16px 34px;
    background:
      linear-gradient(to bottom,#FFFFFF 0%,rgba(255,255,255,.85) 18%,rgba(255,255,255,0) 52%),
      linear-gradient(to bottom,rgba(242,242,247,0) 70%,var(--bg) 100%),
      radial-gradient(90% 70% at 8% 62%,#FFD3E1 0%,rgba(255,211,225,0) 70%),
      radial-gradient(80% 70% at 96% 52%,#C9DEFF 0%,rgba(201,222,255,0) 70%),
      radial-gradient(90% 60% at 50% 88%,#E4D6FF 0%,rgba(228,214,255,0) 75%),
      #FFFFFF;}
  .hero-date{font-size:15px;font-weight:600;color:#7A7396;padding:0 6px}
  .hero-greet{font-size:38px;line-height:42px;font-weight:800;letter-spacing:-1.2px;color:#1E1940;padding:4px 6px 0}
  .hero-sub{font-size:15px;line-height:21px;color:#5E5785;padding:8px 6px 0}
  .hero-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  .glass{background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);
    border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:12px 14px;box-shadow:0 8px 24px rgba(60,40,140,.08)}
  .glass .k{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#5E5785}
  .glass .big{font-size:30px;font-weight:300;letter-spacing:-1px;line-height:36px;color:#1E1940}
  .glass .t{font-size:16px;font-weight:600;line-height:21px;padding-top:4px;color:#1E1940}
  .glass .s{font-size:13px;color:#5E5785;padding-top:2px}

  /* ---------- Section dock ---------- */
  .dock{position:sticky;top:0;z-index:10;padding:10px 16px;background:rgba(242,242,247,.84);
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .dock-inner{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .dock-inner::-webkit-scrollbar{display:none}
  .dock a{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:54px}
  .dock .ic{width:46px;height:46px;border-radius:13px;font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .dock .lbl{font-size:10.5px;color:#6C6C70;white-space:nowrap}
  .dock a.on .lbl{color:#000;font-weight:600}
  .ic{display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:var(--g)}
  .ic.white{background:#fff}

  /* ---------- Full-color cards (the "Something different" style everywhere) ---------- */
  .card{position:relative;margin:14px 16px 0;border-radius:var(--r);padding:18px 18px 6px;color:var(--ink);
    background:var(--g);box-shadow:0 10px 28px var(--sh);scroll-margin-top:96px;overflow:hidden}
  .card .head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--sub)}
  .card .head .meta{margin-left:auto;font-weight:500}
  .card .head .meta b{font-weight:700;color:var(--ink)}
  .card .hdr-ic{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px}
  .card h2{margin:8px 0 2px;font-size:26px;line-height:30px;font-weight:800;letter-spacing:-.7px}
  .rows{margin-top:6px}
  .row{padding:14px 0 16px;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .it-title{font-size:17px;font-weight:700;line-height:22px;letter-spacing:-.3px}
  .it-blurb{padding-top:6px;font-size:15px;line-height:22px;color:var(--body)}
  .it-src{padding-top:9px;font-size:12px;color:var(--sub);font-weight:500}
  .acts{display:flex;flex-wrap:wrap;gap:7px;padding-top:12px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;
    background:rgba(255,255,255,.5);color:var(--ink);transition:transform .12s,background .15s}
  .pill:active{transform:scale(.96)}
  .pill.solid{background:var(--ink);color:var(--hi)}
  .pill svg{width:16px;height:16px}
  .row.is-done .it-title,.row.is-done .it-blurb{opacity:.4}
  .row.is-done .it-title{text-decoration:line-through}
  .pill.done[aria-pressed="true"]{background:var(--ink);color:var(--hi)}
  .tile-glass{background:rgba(255,255,255,.42);border-radius:16px}

  /* calendar */
  .ev{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .ev:first-child{border-top:0}
  .ev .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--ink);opacity:.75}
  .ev .n{flex:1;font-size:16px;font-weight:600}
  .ev .tm{font-size:14px;color:var(--body);white-space:nowrap}
  .ev.past{opacity:.42}
  .soon{margin:6px 0 16px;padding:12px 14px}
  .soon .h{font-size:13px;font-weight:600;color:var(--sub);padding-bottom:6px}
  .soon .l{font-size:15px;line-height:24px}

  /* radar */
  .rad{display:flex;gap:12px;padding:14px 0 16px;border-top:1px solid var(--line)}
  .rad:first-child{border-top:0}
  .date{flex:0 0 50px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .date .m{font-size:11px;font-weight:700;color:var(--sub)}
  .date .d{font-size:24px;font-weight:300;line-height:26px}
  .rad .x{flex:1;min-width:0}
  .rad .it-blurb{font-size:14px;line-height:20px;padding-top:3px}
  .cd{display:inline-block;margin-top:7px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700}

  /* podcasts */
  .pod{display:flex;gap:12px;padding:14px 0 16px;border-top:1px solid var(--line)}
  .pod:first-child{border-top:0}
  .art{flex:0 0 64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:20px;letter-spacing:-.5px;background:linear-gradient(145deg,var(--a1),var(--a2));box-shadow:0 4px 12px rgba(0,0,0,.12)}
  .pod .show{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--sub)}

  /* btc + lists */
  .pts{list-style:none;margin:8px 0 0;padding:0}
  .pts li{position:relative;padding:0 0 9px 18px;font-size:15px;line-height:22px}
  .pts li::before{content:"";position:absolute;left:2px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.7}

  /* vocab */
  .word{font-family:"New York","Iowan Old Style",Georgia,serif;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-.5px;margin-top:10px}
  .pron{font-size:15px;color:var(--sub);padding-top:4px}
  .pos{display:inline-block;margin-left:6px;font-style:italic}
  .def{font-size:16px;line-height:23px;padding-top:10px}
  .ex{margin-top:12px;padding:12px 14px;font-size:15px;line-height:22px;color:var(--body);font-style:italic}

  /* spanish */
  .phrase{font-size:30px;line-height:34px;font-weight:800;letter-spacing:-.6px;margin-top:10px}
  .flash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .fc{min-height:74px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:transform .35s,background .2s}
  .fc .es{font-size:15px;font-weight:700}
  .fc .en{font-size:13px;color:var(--body);padding-top:4px;opacity:0;transition:opacity .25s}
  .fc .hint{font-size:11px;color:var(--sub);padding-top:4px}
  .fc.open{background:rgba(255,255,255,.72)}
  .fc.open .en{opacity:1}
  .fc.open .hint{display:none}

  .group-title{padding:26px 28px 0;font-size:22px;font-weight:800;letter-spacing:-.5px}
  .foot{text-align:center;padding:30px 24px 10px;font-size:12px;line-height:18px;color:#AEAEB2}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:rgba(28,28,30,.92);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;transition:.25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

  { id:"vocab",    name:"Word",     title:"Word of the day",        icon:()=>"📖" },
  { id:"spanish",  name:"Español",  title:"Quick Spanish",          icon:()=>"🇲🇽" },
  { id:"robotics", name:"Robotics", title:"Humanoid robotics",      icon:()=>"🤖" },
  { id:"pods",     name:"Listen",   title:"Podcasts & YouTube",     icon:()=>"🎙️" },
  { id:"btc",      name:"BTC",      title:"Benjamin Cowen’s latest",icon:()=>LOGO.bitcoin(46), bare:true },
  { id:"ai",       name:"AI",       title:"AI & tech",              icon:()=>"🧠" },
  { id:"diff",     name:"Different",title:"Something different",    icon:()=>"🎲" }
];
const S = Object.fromEntries(SECTIONS.map(s => [s.id, s]));

/* =========================================================
   HELPERS
   ========================================================= */
const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const ext = (url, label, cls="") => `<a class="pill ${cls}" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`;
const askUrl = q => "https://claude.ai/new?q=" + encodeURIComponent(q);
const gUrl = q => "https://www.google.com/search?q=" + encodeURIComponent(q);

// Google Calendar "add event" link, with helpful details baked into the description
function calUrl(title, cal, link){
  const z = s => s.replace(/[-:]/g,"");
  let dates;
  if (cal.allDay || !cal.start){
    const d = (cal.date || cal.start || "").slice(0,10);
    const n = new Date(d + "T00:00:00"); n.setDate(n.getDate()+1);
    const nx = `${n.getFullYear()}${String(n.getMonth()+1).padStart(2,"0")}${String(n.getDate()).padStart(2,"0")}`;
    dates = `${z(d)}/${nx}`;
  } else {
    dates = `${z(cal.start)}00/${z(cal.end || cal.start)}00`;
  }
  const details = [cal.tips ? "💡 " + cal.tips : "", link ? "🔗 " + link : "", "Added from Stinky’s Daily"].filter(Boolean).join("\n\n");
  const p = new URLSearchParams({ action:"TEMPLATE", text:title, dates, details, ctz:"America/Los_Angeles" });
  if (cal.location) p.set("location", cal.location);
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
const calPill = (title, cal, link) => ext(calUrl(title, cal, link), `${LOGO.gcal(16)}Add to calendar`);

// done-state (per edition, per viewer)
const KEY = "stinkys-daily-done-" + DATA.edition;
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { done = {}; }
const saveDone = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e) {} };

const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const fmt12 = t => { let [h,m] = t.split(":").map(Number); const ap = h>=12?"PM":"AM"; h = h%12||12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const daysUntil = iso => { const t = new Date(iso + "T00:00:00"); const d = new Date(); d.setHours(0,0,0,0); return Math.round((t - d)/86400000); };

function doneBtn(id){ return `<button class="pill done" data-done="${id}" aria-pressed="${!!done[id]}">${done[id] ? "✓ Done" : "Mark done"}</button>`; }

function item(it){
  const acts = [ext(it.url,"Open","solid"), ext(gUrl(it.title),"Google")];
  if (it.cal) acts.push(calPill(it.title, it.cal, it.url));
  if (it.ask) acts.push(ext(askUrl(it.ask),"Ask Claude"));
  acts.push(doneBtn(it.id));
  return `<div class="row ${done[it.id]?"is-done":""}">
    <div class="it-title">${esc(it.title)}</div>
    <div class="it-blurb">${esc(it.blurb)}</div>
    <div class="it-src">${esc(it.src)} &nbsp;|&nbsp; ${esc(it.date)}</div>
    <div class="acts">${acts.join("")}</div></div>`;
}

function card(id, meta, body, opts={}){
  const s = S[id];
  const ic = s.white || s.bare ? `<span class="hdr-ic">${s.id==="day" ? LOGO.gcal(22) : LOGO.bitcoin(22)}</span>` : `<span class="hdr-ic">${s.icon()}</span>`;
  return `<section class="card" id="${id}" style="${themeStyle(id)}">
    <div class="head">${ic}<span>${esc(s.title)}</span><span class="meta">${meta||""}</span></div>
    ${opts.h2 ? `<h2>${opts.h2}</h2>` : ""}
    <div class="rows">${body}</div></section>`;
}

let speechOK = "speechSynthesis" in window;
function speak(text, lang){
  if (!speechOK) return toast("Audio isn’t available here");
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = .9; speechSynthesis.speak(u); }
  catch(e){ toast("Audio isn’t available here"); }
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const now = new Date(); const h = now.getHours();
  const greet = h < 12 ? "Good morning, Stinky" : h < 17 ? "Good afternoon, Stinky" : "Good evening, Stinky";
  const dateStr = now.toLocaleDateString("en-US",{ weekday:"long", month:"long", day:"numeric" });
  const n = nowMin(); const w = DATA.weather;
  const next = DATA.day.events.find(e => toMin(e.end) > n);
  const left = DATA.day.events.filter(e => toMin(e.end) > n).length;
  const unreadAll = [...DATA.robotics, ...DATA.ai, ...DATA.bay.items].filter(i => !done[i.id]).length;

  // Your day
  const evs = DATA.day.events.map(e => `<div class="ev ${toMin(e.end) <= n ? "past":""}"><div class="bar"></div><div class="n">${esc(e.title)}</div><div class="tm">${fmt12(e.start)}</div></div>`).join("");
  const soon = DATA.day.soon.length ? `<div class="soon tile-glass"><div class="h">Next two weeks</div>${DATA.day.soon.map(s => `<div class="l">${esc(s)}</div>`).join("")}</div>` : "";
  const dayBody = evs + soon + `<div class="acts" style="padding:0 0 16px">${ext("https://calendar.google.com/calendar/r/day","Open Google Calendar","solid")}</div>`;

  // Radar
  const radar = DATA.radar.map(r => {
    const d = new Date(r.date + "T00:00:00"); const dd = daysUntil(r.date);
    const cd = dd < 0 ? "Passed" : dd === 0 ? "Today" : dd === 1 ? "Tomorrow" : `In ${dd} days`;
    const cal = Object.assign({ date:r.date }, r.cal || { allDay:true });
    return `<div class="rad"><div class="date tile-glass"><div class="m">${d.toLocaleDateString("en-US",{month:"short"})}</div><div class="d">${d.getDate()}</div></div>
      <div class="x"><div class="it-title" style="font-size:16px">${esc(r.title)}</div><div class="it-blurb">${esc(r.desc)}</div><span class="cd">${cd}</span>
      <div class="acts">${calPill(r.title, cal, r.url)}${ext(r.url,"Details")}</div></div></div>`;
  }).join("");

  // Bay
  const a = DATA.bay.ahead;
  const bay = DATA.bay.items.map(item).join("") + (a ? `<div class="tile-glass" style="margin:2px 0 16px;padding:14px">
      <div style="font-size:13px;font-weight:700;color:var(--sub)">🎟️ Coming up — book ahead</div>
      <div class="it-title" style="padding-top:6px">${esc(a.title)}</div>
      <div class="it-blurb" style="padding-top:2px;font-size:14px">${esc(a.when)} &nbsp;|&nbsp; ${esc(a.note)}</div>
      <div class="acts">${ext(a.url,"Get tickets","solid")}${a.cal ? calPill(a.title, a.cal, a.url) : ""}</div></div>` : "");

  // Vocab
  const v = DATA.vocab;
  const vocab = `<div class="word">${esc(v.word)}</div>
    <div class="pron">${esc(v.pron)}<span class="pos">${esc(v.pos)}</span></div>
    <div class="def">${esc(v.def)}</div>
    <div class="ex tile-glass">“${esc(v.ex)}”</div>
    ${v.origin ? `<div class="it-src" style="padding-top:12px">${esc(v.origin)}</div>` : ""}
    <div class="acts" style="padding-bottom:18px"><button class="pill solid" data-say="${esc(v.word)}" data-lang="en-US">🔊 Hear it</button>${ext(askUrl(`Give me 3 natural example sentences using the word "${v.word}", plus 2 synonyms.`),"Ask Claude")}${ext("https://www.merriam-webster.com/dictionary/"+encodeURIComponent(v.word.toLowerCase()),"Dictionary")}</div>`;

  // Spanish
  const sp = DATA.spanish;
  const spanish = `<div class="phrase">${esc(sp.phrase)}</div>
    <div class="pron">${esc(sp.pron)}</div>
    <div class="def">${esc(sp.meaning)}</div>
    <div class="it-blurb">${esc(sp.note)}</div>
    <div class="ex tile-glass" style="font-style:normal"><b>Reply:</b> ${esc(sp.reply)}</div>
    <div class="flash">${sp.cards.map((c,i) => `<button class="fc tile-glass" data-fc="${i}" aria-expanded="false"><span class="es">${esc(c.es)}</span><span class="en">${esc(c.en)}</span><span class="hint">Tap to reveal</span></button>`).join("")}</div>
    <div class="acts" style="padding-bottom:18px"><button class="pill solid" data-say="${esc(sp.phrase)}" data-lang="es-MX">🔊 Hear it</button>${ext(askUrl(`Teach me a 2-minute Spanish mini-lesson built around "${sp.phrase}" with a short practice dialogue.`),"Practice with Claude")}</div>`;

  // Pods
  const pods = DATA.pods.map(p => {
    const yt = p.platform === "youtube";
    return `<div class="pod"><div class="art" style="--a1:${p.a1};--a2:${p.a2}">${esc(p.initials)}</div>
      <div style="flex:1;min-width:0"><div class="show">${yt ? LOGO.youtube(12) : LOGO.spotify(14)}${esc(p.show)} &nbsp;<span style="font-weight:500">${esc(p.date)}</span></div>
      <div class="it-title" style="font-size:16px;padding-top:3px">${esc(p.ep)}</div><div class="it-blurb" style="font-size:14px;line-height:20px;padding-top:3px">${esc(p.desc)}</div>
      <div class="acts">${ext(p.url, yt ? `${LOGO.youtube(13)}Watch` : `${LOGO.spotify(16)}Listen`, "")}</div></div></div>`;
  }).join("");

  // BTC
  const b = DATA.btc;
  const btc = `<ul class="pts">${b.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    <div class="it-src" style="padding-top:2px">${esc(b.src)} &nbsp;|&nbsp; ${esc(b.date)}</div>
    <div class="acts" style="padding-bottom:18px">${ext(b.url,`${LOGO.youtube(13)}Watch`,"")}${ext(askUrl("Explain Benjamin Cowen’s bull market support band in simple terms."),"Ask Claude")}</div>`;

  const dif = DATA.different;
  const robLeft = DATA.robotics.filter(i => !done[i.id]).length;
  const aiLeft = DATA.ai.filter(i => !done[i.id]).length;

  document.getElementById("app").innerHTML = `
  <header class="hero">
    <div class="hero-date">${dateStr}</div>
    <div class="hero-greet">${greet}</div>
    <div class="hero-sub">${unreadAll} things worth a look today.</div>
    <div class="hero-row">
      <div class="glass"><div class="k">${esc(w.place)}</div><div class="big">${w.emoji} ${w.hi}°</div><div class="s">${esc(w.cond)} &nbsp;L ${w.lo}°</div></div>
      <a class="glass" href="#day"><div class="k">${LOGO.gcal(14)}${next ? "Up next" : "All clear"}</div>
        <div class="t">${next ? esc(next.title) : "Nothing left today"}</div><div class="s">${next ? `${fmt12(next.start)} – ${fmt12(next.end)}` : "Enjoy the evening"}</div></a>
    </div>
  </header>
  <nav class="dock" aria-label="Sections"><div class="dock-inner">
    ${SECTIONS.map(s => `<a href="#${s.id}" data-nav="${s.id}"><div class="ic ${s.white?"white":""}" style="${s.bare||s.white ? "background:#fff" : themeStyle(s.id)}">${s.icon()}</div><div class="lbl">${s.name}</div></a>`).join("")}
  </div></nav>

  ${card("day", `<b>${left}</b> left today`, dayBody)}
  ${card("radar", "Plan ahead", radar)}
  ${card("bay", DATA.bay.range, bay)}
  ${card("vocab", "", vocab)}
  ${card("spanish", "", spanish)}
  <div class="group-title">The reading</div>
  ${card("robotics", `<b>${robLeft}</b> unread`, DATA.robotics.map(item).join(""))}
  ${card("pods", "Last 48 hrs", pods)}
  ${card("btc", "", btc)}
  ${card("ai", `<b>${aiLeft}</b> unread`, DATA.ai.map(item).join(""))}
  <section class="card" id="diff" style="${themeStyle("diff")};padding-bottom:22px">
    <div class="head"><span class="hdr-ic">🎲</span><span>Something different</span></div>
    <h2>${esc(dif.title)}</h2>
    <div class="it-blurb" style="padding-top:10px">${esc(dif.blurb)}</div>
    <div class="acts" style="padding-top:16px">${ext(dif.url,"Open","solid")}${dif.ask ? ext(askUrl(dif.ask),"Ask Claude") : ""}</div>
  </section>
  <div class="foot">Stinky’s Daily refreshes every morning at 7.</div>`;
  watchSections();
}

/* =========================================================
   INTERACTION
   ========================================================= */
document.addEventListener("click", e => {
  const d = e.target.closest("[data-done]");
  if (d){ const id = d.dataset.done; done[id] = !done[id]; if (!done[id]) delete done[id]; saveDone(); keepScroll(render); toast(done[id] ? "Marked done" : "Marked unread"); return; }
  const say = e.target.closest("[data-say]");
  if (say){ speak(say.dataset.say, say.dataset.lang); return; }
  const fc = e.target.closest("[data-fc]");
  if (fc){ const open = fc.classList.toggle("open"); fc.setAttribute("aria-expanded", open); }
});
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
let tt; function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1400); }

let io;
function watchSections(){
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(entries => {
    entries.forEach(en => { if (!en.isIntersecting) return;
      document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === en.target.id));
      const on = document.querySelector(`[data-nav="${en.target.id}"]`);
      if (on){ const d = on.parentElement; d.scrollTo({ left: on.offsetLeft - d.clientWidth/2 + on.clientWidth/2, behavior:"smooth" }); }
    });
  }, { rootMargin:"-40% 0px -55% 0px" });
  SECTIONS.forEach(s => { const el = document.getElementById(s.id); if (el) io.observe(el); });
}

render();
// refresh greeting, "up next" and countdowns every few minutes
setInterval(() => keepScroll(render), 5*60*1000);
</script>
</body>
</html>
