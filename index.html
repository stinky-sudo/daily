<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Stinky's Daily</title>
<style>
  :root{
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
    --ink:#0B0B0F; --ink2:#55555C; --ink3:#8E8E95; --hair:#ECECF0;
    /* size system — every logo uses one of these */
    --logo-xs:14px; --logo-sm:18px; --logo-md:22px; --tile:36px; --tile-r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#FFFFFF;font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  body{padding-bottom:env(safe-area-inset-bottom,0px)}
  a{color:inherit;text-decoration:none}
  button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
  :focus-visible{outline:2px solid var(--a,#1A73E8);outline-offset:2px;border-radius:10px}
  .app{max-width:430px;margin:0 auto;padding:0 0 48px}

  /* logos: fixed square boxes, contain-fit, so every mark reads the same size */
  .lg{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .lg img,.lg svg{width:100%;height:100%;object-fit:contain;display:block}
  .lg.xs{width:var(--logo-xs);height:var(--logo-xs)}
  .lg.sm{width:var(--logo-sm);height:var(--logo-sm)}
  .lg.md{width:var(--logo-md);height:var(--logo-md)}

  /* ---------- header ---------- */
  .top{padding:22px 20px 6px}
  .top .d{font-size:13px;font-weight:600;color:var(--ink3)}
  .top h1{margin:2px 0 0;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.4px}
  .glance{display:flex;gap:8px;padding:14px 20px 4px;overflow-x:auto;scrollbar-width:none}
  .glance::-webkit-scrollbar{display:none}
  .chipx{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--hair);font-size:14px;font-weight:600;background:#fff}
  .chipx small{font-size:12.5px;color:var(--ink2);font-weight:500}

  /* ---------- section nav ---------- */
  .nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
  .nav.stuck{border-bottom-color:var(--hair)}
  .nav-in{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
  .nav-in::-webkit-scrollbar{display:none}
  .nav a{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 9px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);border:1px solid var(--hair);background:#fff;transition:background .15s,color .15s,border-color .15s}
  .nav a .em{width:var(--logo-sm);text-align:center;font-size:14px;line-height:1}
  .nav a.on{background:var(--t);color:var(--a);border-color:var(--l)}

  /* ---------- sections ---------- */
  .sec{margin:18px 16px 0;border-radius:22px;background:var(--t);scroll-margin-top:64px;overflow:hidden}
  .sh{display:flex;align-items:center;gap:12px;padding:14px 14px 10px}
  .tile{width:var(--tile);height:var(--tile);border-radius:var(--tile-r);display:flex;align-items:center;justify-content:center;background:var(--a);color:#fff;font-size:18px;flex:0 0 auto}
  .tile.brand{background:#fff;box-shadow:0 0 0 1px var(--l)}
  .sh h2{margin:0;font-size:18px;line-height:22px;font-weight:700;letter-spacing:-.3px}
  .sh p{margin:1px 0 0;font-size:12.5px;color:var(--ink2)}
  .sh .r{margin-left:auto;white-space:nowrap;flex:0 0 auto;font-size:12px;font-weight:700;color:var(--a);background:#fff;border-radius:999px;padding:4px 9px;box-shadow:0 0 0 1px var(--l)}
  .list{margin:0 8px 8px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--l)}
  .it{padding:14px 14px 14px;border-top:1px solid var(--hair)}
  .it:first-child{border-top:0}
  .hide{display:none!important}
  .it .k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink3)}
  .it .k .src{color:var(--a)}
  .it h3{margin:5px 0 0;font-size:16px;line-height:21px;font-weight:650;font-weight:600;letter-spacing:-.25px}
  .it p{margin:5px 0 0;font-size:14.5px;line-height:20.5px;color:var(--ink2)}
  .it.done h3,.it.done p{color:var(--ink3)}
  .it.done h3{text-decoration:line-through;text-decoration-color:#C7C7CC}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .b{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--t);color:var(--a);transition:transform .1s}
  .b:active{transform:scale(.96)}
  .b.pri{background:var(--a);color:#fff}
  .b.brand{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--l)}
  .b.ok{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--hair)}
  .b.chk[aria-pressed="true"]{background:var(--ink);color:#fff}
  .more{display:block;width:100%;padding:12px;border-top:1px solid var(--hair);font-size:13.5px;font-weight:600;color:var(--a);text-align:center}

  /* calendar */
  .day{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--hair)}
  .day:first-child{border-top:0}
  .dt{flex:0 0 44px;text-align:center}
  .dt .w{font-size:11px;font-weight:700;color:var(--a)}
  .dt .n{font-size:22px;line-height:26px;font-weight:600;letter-spacing:-.5px}
  .dt.today .n{color:#fff;background:var(--a);border-radius:999px;width:34px;height:34px;line-height:34px;margin:2px auto 0;font-size:18px}
  .evs{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .ev{display:block;padding:8px 10px;border-radius:10px;background:var(--t);border-left:3px solid var(--a)}
  .ev .t{font-size:14.5px;font-weight:600;line-height:19px}
  .ev .m{font-size:12.5px;color:var(--ink2);padding-top:2px}
  .empty{font-size:14px;color:var(--ink3);padding:8px 0}
  .note{margin:0 8px 8px;padding:12px 14px;border-radius:14px;background:#fff;box-shadow:0 0 0 1px var(--l);font-size:14px;line-height:20px}
  .note b{color:var(--a)}

  /* radar */
  .rad{display:flex;gap:12px}
  .rad .dt{flex:0 0 44px;height:48px;border-radius:12px;background:var(--t);display:flex;flex-direction:column;justify-content:center}
  .rad .dt .n{font-size:19px;line-height:22px}
  .rad .x{flex:1;min-width:0}
  .rad h3{margin-top:0}
  .cd{font-size:12px;font-weight:700;color:var(--a)}

  /* media rows */
  .med{display:flex;gap:12px}
  .thumb{flex:0 0 112px;height:63px;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px}
  .thumb .du{position:absolute;right:5px;bottom:5px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.72);padding:1px 5px;border-radius:4px}
  .cover{flex:0 0 63px;height:63px;border-radius:10px;background:linear-gradient(145deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
  .med .x{flex:1;min-width:0}
  .med h3{margin-top:0;font-size:15px;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .med .s{font-size:12.5px;color:var(--ink2);padding-top:3px}

  /* btc */
  .price{display:flex;align-items:flex-end;justify-content:space-between;margin:0 8px 8px;padding:14px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--l)}
  .price .v{font-size:30px;line-height:34px;font-weight:700;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .price .c{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .price .c.up{color:#1E9E50}.price .c.dn{color:#E5372C}
  .price small{display:block;font-size:12px;color:var(--ink3);font-weight:500}
  .pts{margin:0;padding:0;list-style:none}
  .pts li{position:relative;padding:0 0 8px 16px;font-size:14.5px;line-height:20.5px}
  .pts li:last-child{padding-bottom:0}
  .pts li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--a)}

  /* something different: full-colour feature card */
  .feat{margin:18px 16px 0;border-radius:22px;padding:20px;color:#2B1F00;scroll-margin-top:64px;
    background:radial-gradient(120% 120% at 0% 0%,#FFE680 0%,#FFD43B 42%,#F2B705 100%)}
  .feat .k{font-size:13px;font-weight:700;color:#6B5000}
  .feat h3{margin:8px 0 0;font-size:24px;line-height:28px;font-weight:800;letter-spacing:-.6px}
  .feat p{margin:8px 0 0;font-size:15px;line-height:22px;color:#4A3800}
  .feat .b{background:rgba(255,255,255,.55);color:#2B1F00}
  .feat .b.pri{background:#2B1F00;color:#FFE680}

  /* learning */
  .word{font-family:"New York","Iowan Old Style",Georgia,serif;font-size:32px;line-height:36px;font-weight:700}
  .pron{font-size:13.5px;color:var(--ink2);padding-top:3px}
  .quote{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--t);font-size:14px;line-height:20px;color:var(--ink2)}
  .phrase{font-size:26px;line-height:30px;font-weight:700;letter-spacing:-.5px}
  .fcs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .fc{min-height:64px;padding:8px 6px;border-radius:12px;background:var(--t);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .fc .es{font-size:14px;font-weight:700;color:var(--a)}
  .fc .en{font-size:12px;color:var(--ink2);padding-top:3px;display:none}
  .fc .h{font-size:10.5px;color:var(--ink3);padding-top:3px}
  .fc.open .en{display:block}.fc.open .h{display:none}

  .grp{padding:28px 22px 0;font-size:13px;font-weight:700;color:var(--ink3)}
  .foot{text-align:center;padding:30px 24px 0;font-size:12px;color:var(--ink3)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:rgba(20,20,22,.92);color:#fff;font-size:13.5px;font-weight:600;padding:9px 15px;border-radius:999px;transition:.22s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

  bay:{ range:"Sat–Sun, Oct 10–11", items:[
    { id:"bay1", title:"Fleet Week air show — best viewing spots", blurb:"Marina Green and Crissy Field get packed by noon. Fort Mason’s upper lawn and Aquatic Park are calmer with nearly the same view.", src:"fleetweeksf.org", date:"Oct 10–11", url:"https://fleetweeksf.org/", onCal:true },
    { id:"bay2", title:"Sunday open-air house party", blurb:"A daytime outdoor set from an SF house collective. Location usually drops the morning of. Bring layers.", src:"Sample", date:"Sun, Oct 11", url:"https://www.sunsetsf.org/", cal:{ start:"2026-10-11T14:00", end:"2026-10-11T19:00", location:"San Francisco (posted day-of)", tips:"Free and outdoors. Check their site/IG that morning for the location. Fog rolls in around 5 — bring a layer." } },
    { id:"bay3", title:"Off the Grid at Fort Mason", blurb:"Food trucks and live music on Friday nights. Easy pre-weekend plan after the airport run.", src:"offthegrid.com", date:"Fri, Oct 9", url:"https://offthegrid.com/", cal:{ start:"2026-10-09T18:30", end:"2026-10-09T21:00", location:"Fort Mason Center, San Francisco", tips:"Card only. Lines are shortest before 6:30 PM. Parking fills fast during Fleet Week." } },

    { id:"bay5", title:"Late-night techno at a SoMa club", blurb:"Sample listing for the electronic/house slot. The real version pulls from venue calendars.", src:"Sample", date:"Sat, Oct 10", url:"https://ra.co/events/us/sanfrancisco" }

  robotics:[
    { id:"r1", title:"New multi-robot logistics demo from a humanoid lab", blurb:"Two humanoids hand packages to each other on a conveyor line with no scripted choreography. The interesting part is how timing between robots is handled.", src:"Sample", date:"Oct 5", url:"https://www.figure.ai/news", ask:"Explain how one VLA model could coordinate two humanoid robots at once, simply." },

/* =========================================================

   ========================================================= */
const TZ = "America/Los_Angeles";
const esc = s => String(s ?? "").replace(/[&<>"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[m]));
const ext = (url, label, cls="") => `<a class="b ${cls}" href="${esc(url)}" target="_blank" rel="noopener">${label}</a>`;
const askUrl = q => "https://claude.ai/new?q=" + encodeURIComponent(q);
const gUrl = q => "https://www.google.com/search?q=" + encodeURIComponent(q);
const dayKey = d => d.toLocaleDateString("en-CA",{ timeZone:TZ });
const fmtTime = d => d.toLocaleTimeString("en-US",{ hour:"numeric", minute:"2-digit", timeZone:TZ });
const fmtTZ = (d,z) => d.toLocaleTimeString("en-US",{ hour:"numeric", minute:"2-digit", timeZone:z });
const todayKey = () => dayKey(new Date());
const daysUntil = iso => Math.round((new Date(iso+"T12:00:00") - new Date(todayKey()+"T12:00:00"))/86400000);

function calUrl(title, cal, link, date){
  const z = s => s.replace(/[-:]/g,"");
  let dates;
  if (!cal.start){ const n = new Date(date+"T12:00:00"); n.setDate(n.getDate()+1); dates = `${z(date)}/${n.toISOString().slice(0,10).replace(/-/g,"")}`; }
  else dates = `${z(cal.start)}00/${z(cal.end||cal.start)}00`;
  const details = [cal.tips ? "💡 TIPS\n" + cal.tips : "", link ? "🔗 LINK\n" + link : "", "Added from Stinky’s Daily"].filter(Boolean).join("\n\n");
  const p = new URLSearchParams({ action:"TEMPLATE", text:title, dates, details, ctz:TZ });
  if (cal.location) p.set("location", cal.location);
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function calBtn(x, date){
  if (x.onCal) return `<span class="b ok">${logo("gcal","xs")}On your calendar</span>`;
  if (!x.cal) return "";
  return ext(calUrl(x.title, x.cal, x.url, date), `${logo("gcal","xs")}Add to calendar`,"brand");
}

function section(id, sub, right, body){

  const open = expanded[id]; const extra = rows.length - show;
  return `<div class="list">${rows.map((r,i) => r.replace('class="', `class="${!open && i>=show ? "hide " : ""}`)).join("")}

function render(){
  const now = new Date(); const h = +now.toLocaleString("en-US",{ hour:"numeric", hour12:false, timeZone:TZ });
  const greet = h < 12 ? "Good morning, Stinky" : h < 17 ? "Good afternoon, Stinky" : "Good evening, Stinky";
  const dateStr = now.toLocaleDateString("en-US",{ weekday:"long", month:"long", day:"numeric", timeZone:TZ });
  const wx = live.wx || DATA.weatherFallback;

  /* calendar: group by day, today + next 14 days */
  const tk = todayKey();
  const evs = DATA.calendar.events.map(e => {
    const s = e.allDay ? null : new Date(e.start), en = e.allDay ? null : new Date(e.end);
    return { ...e, s, en, key: e.allDay ? e.date : dayKey(s) };
  }).filter(e => e.key >= tk && daysUntil(e.key) <= 14 && !(e.en && e.en < now))
    .sort((a,b) => a.key.localeCompare(b.key) || (a.allDay ? -1 : b.allDay ? 1 : a.s - b.s));
  const byDay = {}; evs.forEach(e => (byDay[e.key] = byDay[e.key] || []).push(e));
  const keys = [tk, ...Object.keys(byDay).filter(k => k !== tk)].slice(0, 99);
  const next = evs.find(e => !e.allDay && e.s > now);

/* =========================================================
   LIVE DATA (weather + BTC). Fails quietly to fallbacks.
   ========================================================= */
const WX = { 0:["☀️","Clear"],1:["🌤","Mostly clear"],2:["⛅","Partly cloudy"],3:["☁️","Cloudy"],45:["🌫","Fog"],48:["🌫","Fog"],51:["🌦","Drizzle"],53:["🌦","Drizzle"],55:["🌦","Drizzle"],61:["🌧","Rain"],63:["🌧","Rain"],65:["🌧","Heavy rain"],80:["🌦","Showers"],81:["🌧","Showers"],82:["🌧","Showers"],95:["🌩","Storms"] };
async function loadLive(){
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?latitude=37.3861&longitude=-122.0839&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=1");
    const j = await r.json(); const c = WX[j.daily.weather_code[0]] || ["🌤","Fair"];
    live.wx = { emoji:c[0], cond:c[1], hi:Math.round(j.daily.temperature_2m_max[0]), lo:Math.round(j.daily.temperature_2m_min[0]) };
  } catch(e){}
  try {
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd&include_24hr_change=true");
    const j = await r.json(); live.btc = { usd:j.bitcoin.usd, chg:j.bitcoin.usd_24h_change };
  } catch(e){}
  keep(render);
}

/* =========================================================
   INTERACTION
   ========================================================= */
function keep(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
document.addEventListener("click", e => {
  const d = e.target.closest("[data-done]");
  if (d){ const id = d.dataset.done; done[id] ? delete done[id] : (done[id] = 1); save(); keep(render); toast(done[id] ? "Marked done" : "Marked unread"); return; }
  const m = e.target.closest("[data-more]");
  if (m){ expanded[m.dataset.more] = !expanded[m.dataset.more]; keep(render); return; }
  const s = e.target.closest("[data-say]");
  if (s){ try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(s.dataset.say); u.lang = s.dataset.lang; u.rate = .9; speechSynthesis.speak(u); } catch(err){ toast("Audio isn’t available here"); } return; }
  const f = e.target.closest("[data-fc]");
  if (f){ f.setAttribute("aria-expanded", f.classList.toggle("open")); }
});
let tt; function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("show"), 1300); }

let io;
function watch(){
  const nav = document.getElementById("nav");
  if (io) io.disconnect();
  if (!("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(es => es.forEach(en => { if (!en.isIntersecting) return;
    document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === en.target.id));
    const on = document.querySelector(`[data-nav="${en.target.id}"]`);
    if (on){ const p = on.parentElement; p.scrollTo({ left:on.offsetLeft - p.clientWidth/2 + on.clientWidth/2, behavior:"smooth" }); }
  }), { rootMargin:"-35% 0px -60% 0px" });
  SECTIONS.forEach(s => { const el = document.getElementById(s.id); if (el) io.observe(el); });
  const top = nav.offsetTop;
  window.onscroll = () => nav.classList.toggle("stuck", window.scrollY >= top - 1);
}

render(); loadLive();
setInterval(() => keep(render), 5*60*1000);
</script>
