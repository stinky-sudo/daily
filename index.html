.sug h2{font-family:var(--display);font-size:30px;line-height:1.12;letter-spacing:-.025em;font-weight:700;margin-top:10px;text-wrap:balance}
.sug p{font-size:16px;line-height:1.55;color:var(--ink-2);margin-top:12px;max-width:62ch}
.hsteps{list-style:none;margin:18px 0 0;padding:0;counter-reset:s;display:grid;gap:10px}
.hsteps li{position:relative;padding-left:32px;font-size:15px;line-height:1.45;counter-increment:s}
.hsteps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center}
/* section header + controls */
.h-sh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 2px 14px;flex-wrap:wrap}
.h-sh h2{font-family:var(--display);font-size:27px;font-weight:700;letter-spacing:-.025em}
.h-sh>span{font-family:var(--mono);font-size:12.5px;color:var(--ink-3)}
.h-ctrls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.h-switch{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.h-switch input{position:absolute;opacity:0;width:1px;height:1px}
.h-switch i{position:relative;width:42px;height:26px;border-radius:999px;background:var(--fill-2);transition:background .2s;flex:0 0 auto}
.h-switch i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.h-switch input:checked+i{background:var(--ink-2)}
.h-switch input:checked+i::after{transform:translateX(16px)}
.h-switch input:focus-visible+i{outline:2px solid var(--link);outline-offset:2px}
.h-notice{display:flex;gap:10px;align-items:flex-start;margin:0 2px 14px;font-size:13.5px;line-height:1.5;color:var(--ink-3)}
.h-notice svg{margin-top:1px}
.h-notice b{color:var(--ink-2);font-weight:650}
/* metric card grid */
.h-stack{display:grid;gap:14px}
#s-health .m{display:grid;grid-template-columns:320px minmax(0,1fr);gap:32px;padding:22px 24px}
.m-head{display:flex;align-items:center;gap:10px}
.m-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--fill);color:var(--ink-2);flex:0 0 auto;transition:background .2s,color .2s}
.m-ic.st-g{background:var(--up-soft);color:var(--up)}
.m-ic.st-w{background:var(--warn-soft);color:var(--warn-ink)}
.m-ic.st-r{background:rgba(221,59,53,.12);color:var(--down)}
.m-name{font-size:16.5px;font-weight:700;flex:1;min-width:0}
#s-health .htag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--fill);color:var(--ink-2);white-space:nowrap}
#s-health .htag.good{background:var(--up-soft);color:var(--up)}
#s-health .htag.warn{background:var(--warn-soft);color:var(--warn-ink)}
.m-val{font-family:var(--display);font-size:42px;font-weight:700;letter-spacing:-.035em;line-height:1;margin-top:18px}
.m-val small{font-size:16px;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:4px}
.m-delta{font-size:14px;font-weight:600;margin-top:8px}
.m-delta .m2{color:var(--ink-3);font-weight:500}
.flat{color:var(--ink-3)}
.m-txt{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin-top:12px}
.m-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.m-facts dt{font-size:12px;color:var(--ink-3);font-weight:500}
.m-facts dd{margin:2px 0 0;font-size:14.5px;font-weight:650;white-space:nowrap}
.m-right{display:flex;flex-direction:column;min-width:0}
.m-rh{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;min-height:34px;flex-wrap:wrap}
.m-rh span{font-size:13px;font-weight:600;color:var(--ink-3)}
/* chart frame */
.ch{display:grid;grid-template-columns:44px minmax(0,1fr);column-gap:10px;margin-top:10px;flex:1}
.yl{position:relative;height:170px}
.yl span{position:absolute;right:0;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.plot{position:relative;height:170px}
.gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.ref{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--ink-3);opacity:.7}
.ref-l{position:absolute;left:0;transform:translateY(-120%);font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface);padding-right:6px}
.xl{display:flex;gap:6px;margin-top:8px;grid-column:2}
.xl span{flex:1;min-width:0;text-align:center;font-size:11px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.xl span.today{color:var(--ink);font-weight:700}
/* bar/column charts */
.cols{position:absolute;inset:0;display:flex;gap:6px}
.col{position:relative;flex:1;min-width:0;height:100%}
.col .bar{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:26px;bottom:0;border-radius:6px 6px 2px 2px;background:var(--fill-2)}
.col.today .bar{background:var(--ink)}
.col.hit .bar{background:var(--up)}
.col .cap{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.col .brk{position:absolute;left:50%;width:34px;height:4px;transform:translateX(-50%);background:var(--surface)}
.col .win{position:absolute;left:50%;transform:translateX(-50%);width:100%;max-width:26px;border-radius:7px;background:var(--c)}
/* line charts */
.hline{position:absolute;inset:0}
.hline svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hdot{position:absolute;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);background:var(--surface);box-shadow:inset 0 0 0 2px var(--c)}
.hdot.today{width:12px;height:12px;background:var(--c);box-shadow:0 0 0 2.5px var(--surface)}
.hitz{position:absolute;top:0;bottom:0;transform:translateX(-50%)}
/* legend */
.h-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;font-weight:600;color:var(--ink-3)}
.h-legend span{display:inline-flex;align-items:center;gap:6px}
.h-legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
/* ──────────────── HEALTH · one-screen dashboard (Oct 26 v2: neutral palette, sleep + steps first) ──────────────── */
#s-health{--hdh:58px}
.hx{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1.32fr) minmax(0,1fr) minmax(0,.78fr) auto;gap:12px;
 height:calc(100vh - var(--hdh) - 34px);height:calc(100dvh - env(safe-area-inset-top,0px) - var(--hdh) - 34px);min-height:760px}
.hx>.card,.hx-v{display:flex;flex-direction:column;min-height:0;min-width:0;padding:18px 20px;border-radius:22px}
.hx-vits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;min-height:0}
.hx-sync{text-align:center;font-size:12px;font-weight:500;color:var(--ink-3);padding-bottom:2px}
.hx-sync .warn{color:var(--warn-ink)}
/* header */
.hx-h{display:flex;align-items:center;gap:9px;min-height:28px;flex:0 0 auto}
.hx-t{font-size:16px;font-weight:700;white-space:nowrap}
.hx-s{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-v .hx-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.hx-ic{flex:0 0 auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--fill);color:var(--ink-2)}
#s-health .hx-ic .i{width:15px;height:15px}
.hx-pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--fill);color:var(--ink-2);white-space:nowrap;flex:0 0 auto}
.hx-pill.good{background:var(--up-soft);color:var(--up)}
.hx-pill.warn{background:var(--warn-soft);color:var(--warn-ink)}
.hx-empty{font-size:13.5px;color:var(--ink-3);line-height:1.45;margin-top:10px}
/* focus */
.hx-fk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.hx-fmain{margin-top:8px}
.hx-fmain h2{font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:-.022em;line-height:1.14;text-wrap:balance}
.hx-fmain p{font-size:14px;line-height:1.45;color:var(--ink-2);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hx-fsteps{list-style:none;margin:12px 0 0;padding:0;counter-reset:s;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hx-fsteps li{position:relative;display:flex;align-items:center;min-height:42px;padding:7px 10px 7px 38px;border-radius:12px;background:var(--fill);font-size:13.5px;font-weight:600;line-height:1.3;counter-increment:s}
.hx-fsteps li::before{content:counter(s);position:absolute;left:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:11px;font-weight:700;display:grid;place-items:center}
/* hero cards: summary left, 7-day chart right */
.hx-split{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;margin-top:10px}
.hx-l{display:flex;flex-direction:column;min-height:0;min-width:0}
.hx-big{font-family:var(--display);font-size:50px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.hx-big small{font-size:22px;font-weight:600;color:var(--ink-3);letter-spacing:0;margin:0 5px 0 1px}
.hx-big small.w{font-size:15px;margin-left:8px}
.hx-sub{font-size:13.5px;font-weight:500;color:var(--ink-2);margin-top:8px;line-height:1.35}
.hx-sub b{color:var(--ink);font-weight:650}
.hx-sub .up,.hx-facts .up{color:var(--up)}.hx-facts .down{color:var(--warn-ink)}
.hx-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.hx-facts dt{font-size:11.5px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.hx-facts dd{margin:2px 0 0;font-size:15px;font-weight:650;white-space:nowrap;font-variant-numeric:tabular-nums}
.hx-prog{position:relative;height:10px;border-radius:5px;background:var(--fill);margin-top:14px;overflow:hidden}
.hx-prog span{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink);animation:hxW .9s cubic-bezier(.2,.8,.2,1) both}
.hx-prog span.ok{background:var(--up)}
@keyframes hxW{from{width:0}}
/* stages */
.hx-stages{margin-top:auto;padding-top:12px;display:grid;gap:10px}
.hx-st{outline:none}
.hx-stl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.hx-stl b{font-weight:700;color:var(--ink)}.hx-stl b.lo{color:var(--warn-ink)}
.hx-stl em{font-style:normal;font-weight:500;color:var(--ink-3);margin-left:6px;font-size:11.5px}
.hx-stt{position:relative;height:12px;border-radius:6px;background:var(--fill);margin-top:5px;overflow:hidden}
.hx-stb{position:absolute;top:0;bottom:0;background:var(--fill-2)}
.hx-stf{position:absolute;left:3px;top:3px;bottom:3px;max-width:calc(100% - 6px);border-radius:3px;background:var(--ink-2)}
.hx-stf.lo{background:var(--warn)}
/* chart column */
.hx-ch{display:flex;flex-direction:column;min-height:0;min-width:0}
.hx-chh{display:flex;align-items:center;gap:10px;min-height:24px}
.hx-chh>span:first-child{flex:1;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.hx-aim{font-size:12.5px;font-weight:650;color:var(--ink-2)}
/* sleep schedule */
.hx-sch{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;margin-top:6px}
.hx-schg{position:absolute;left:36px;right:96px;top:0;bottom:18px;pointer-events:none}
.hx-schg>span{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.hx-schg>.hx-tgt{width:auto;border-radius:6px;background:var(--fill)}
.hx-row{flex:1;min-height:0;display:flex;align-items:center}
.hx-dl{flex:0 0 36px;font-size:12px;font-weight:600;color:var(--ink-3)}
.hx-row.today .hx-dl{color:var(--ink);font-weight:700}
.hx-trk{position:relative;flex:1;height:100%;margin-right:54px}
.hx-win{position:absolute;top:50%;height:min(14px,70%);transform:translateY(-50%);border-radius:999px;background:var(--ink-3);opacity:.55;outline:none}
.hx-row.today .hx-win{background:var(--ink);opacity:1}
.hx-win.part{opacity:1;background:repeating-linear-gradient(135deg,var(--ink-3) 0 2.5px,transparent 2.5px 5.5px);box-shadow:inset 0 0 0 1.5px var(--ink-3)}
.hx-wl{position:absolute;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums;pointer-events:none}
.hx-row.today .hx-wl{color:var(--ink)}
.hx-win.good{background:var(--up)}.hx-win.warn{background:var(--warn)}.hx-win.bad{background:var(--down)}
.hx-win{opacity:.72}.hx-row.today .hx-win{opacity:1}
.hx-row.today .hx-win.good{background:var(--up)}.hx-row.today .hx-win.warn{background:var(--warn)}.hx-row.today .hx-win.bad{background:var(--down)}
.hx-win.part.bad{background:repeating-linear-gradient(135deg,var(--down) 0 2.5px,transparent 2.5px 5.5px);box-shadow:inset 0 0 0 1.5px var(--down)}
.hx-win.part.warn{background:repeating-linear-gradient(135deg,var(--warn) 0 2.5px,transparent 2.5px 5.5px);box-shadow:inset 0 0 0 1.5px var(--warn)}
.hx-sc{flex:0 0 38px;height:24px;margin-left:4px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums;background:var(--fill);color:var(--ink-3)}
.hx-sc.good{background:var(--up-soft);color:var(--up)}.hx-sc.warn{background:var(--warn-soft);color:var(--warn-ink)}.hx-sc.bad{background:rgba(221,59,53,.13);color:var(--down)}
.hx-row.today .hx-sc.good{background:var(--up);color:var(--surface)}.hx-row.today .hx-sc.warn{background:var(--warn);color:#fff}.hx-row.today .hx-sc.bad{background:var(--down);color:#fff}
.hx-sc.hx-sch-l{height:auto;background:none;font-size:10.5px;font-weight:600;color:var(--ink-3)}
/* score-first summary */
.hx-sk{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.hx-score{display:flex;align-items:baseline;gap:6px;margin-top:2px}
.hx-score b{font-family:var(--display);font-size:56px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.hx-score b.good{color:var(--up)}.hx-score b.warn{color:var(--warn-ink)}.hx-score b.bad{color:var(--down)}
.hx-score>span:not(.hx-pill){font-size:17px;font-weight:600;color:var(--ink-3)}
.hx-score .hx-pill{align-self:center;margin-left:4px}
.hx-pill.bad{background:rgba(221,59,53,.13);color:var(--down)}
.hx-facts dd.good{color:var(--up)}.hx-facts dd.warn{color:var(--warn-ink)}.hx-facts dd.bad{color:var(--down)}
.hx-dur{font-size:14px;font-weight:500;color:var(--ink-2);margin-top:12px;line-height:1.2}
.hx-dur b{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.hx-nod{position:absolute;left:4px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--ink-3)}
.hx-ax{flex:0 0 18px}
.hx-ax .hx-trk span{position:absolute;top:3px;transform:translateX(-50%);font-size:10.5px;font-weight:600;color:var(--ink-3);white-space:nowrap}
.hx-ax .hx-trk span:first-child{transform:none}.hx-ax .hx-trk span:last-child{transform:translateX(-100%)}
/* steps bars */
.hx-bars{position:relative;flex:1;min-height:0;display:flex;gap:10px;margin-top:24px}
.hx-goal{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--ink-3);opacity:.75;z-index:2;pointer-events:none}
.hx-goal b{position:absolute;right:0;bottom:3px;font-size:10.5px;font-weight:700;color:var(--ink-3);background:var(--surface);padding-left:4px}
.hx-bc{position:relative;flex:1;min-width:0;height:100%;outline:none}
.hx-b{position:absolute;bottom:0;left:50%;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--fill-2);transform:translateX(-50%);transform-origin:bottom;animation:hxGrow .8s cubic-bezier(.2,.8,.2,1) both}
.hx-b.ok{background:var(--up)}
.hx-b.now{background:var(--ink)}
.hx-b.none{background:var(--fill)}
@keyframes hxGrow{from{transform:translateX(-50%) scaleY(0)}}
.hx-bv{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.hx-bc.today .hx-bv{color:var(--ink)}
.hx-bx{display:flex;gap:10px;margin-top:7px}
.hx-bx span{flex:1;min-width:0;text-align:center;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.hx-bx span.today{color:var(--ink);font-weight:700}
/* vitals */
.hx-v{padding:14px 15px!important}
.hx-vv{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.hx-vv small{font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:0;margin-left:3px}
.hx-vs{display:flex;align-items:center;flex-wrap:wrap;gap:2px 6px;font-size:12.5px;font-weight:650;margin-top:6px}
.hx-vs i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.hx-vs i.good{background:var(--up)}.hx-vs i.warn{background:var(--warn)}.hx-vs i.bad{background:var(--down)}
.hx-vs .m2{color:var(--ink-3);font-weight:500}
.hx-sp{position:relative;flex:1;min-height:36px;margin:12px 4px 4px}
.hx-sp svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hx-dot{position:absolute;width:6px;height:6px;border-radius:50%;transform:translate(-50%,-50%);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--ink-2);outline:none}
.hx-dot.today{width:11px;height:11px;background:var(--ink);box-shadow:0 0 0 2.5px var(--surface)}
.hx-dot.today.good{background:var(--up)}.hx-dot.today.warn{background:var(--warn)}.hx-dot.today.bad{background:var(--down)}
@media (prefers-reduced-motion:reduce){.hx-b,.hx-prog span{animation:none}}
/* landscape iPad / Mac: sleep and steps side by side, summary above chart */
@media (min-width:1000px) and (orientation:landscape){
 .hx{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto minmax(0,1fr) minmax(0,.62fr) auto;min-height:620px}
 .hx-focus,.hx-vits,.hx-sync{grid-column:1/-1}
 .hx-split{grid-template-columns:185px minmax(0,1fr);gap:18px}
 .hx-ax .hx-trk span.odd{display:none}
 .hx-ax .hx-trk span:last-child{transform:translateX(-50%)}
 .hx-big{font-size:40px}.hx-big small{font-size:19px}
 .hx-facts{grid-template-columns:1fr 1fr;row-gap:6px}.hx-facts>div:nth-child(3){display:none}
 .hx-score b{font-size:46px}.hx-score .hx-pill{display:none}.hx-dur{margin-top:8px}
 .hx-focus{padding:15px 20px!important}.hx-fsteps{margin-top:10px}.hx-fsteps li{min-height:36px}
 .hx-fmain h2{font-size:23px}.hx-fmain p{-webkit-line-clamp:1}
}
/* phone: natural scroll, summary stacked over chart */
@media (max-width:699px){
 .hx{display:flex;flex-direction:column;height:auto;min-height:0;gap:10px}
 .hx-fsteps{grid-template-columns:1fr}
 .hx-fmain h2{font-size:22px}
 .hx-split{grid-template-columns:1fr;gap:16px}

/* countdown: how far out something is, in plain words, with an urgency tier */
function until(k,time){
 const n=dayDiff(todayKey(),k);
 if(n<0)return{l:"Past",c:""};
 if(n===0)return{l:time&&+String(time).slice(0,2)>=17?"Tonight":"Today",c:"now"};
 if(n===1)return{l:"Tomorrow",c:"soon"};
 if(n<7)return{l:`In ${n} days`,c:"soon"};
 if(n<=31){const w=Math.round(n/7);return{l:`In ${w} wk${w>1?"s":""}`,c:"mid"}}
 const m=Math.round(n/30.4);return{l:`In ${m} mo`,c:""};
}
const cdChip=(k,time,pre="")=>{const u=until(k,time);const l=pre?pre+u.l.charAt(0).toLowerCase()+u.l.slice(1):u.l;return`<span class="cd ${u.c}">${u.c==="now"?"<i></i>":""}${esc(l)}</span>`};

 {cat:"Calm",title:"Try the physiological sigh",mins:"1 min",why:"A double inhale followed by a long exhale is one of the fastest ways to bring your heart rate and stress down in real time.",how:["Inhale through your nose, then sneak in a second short inhale on top.","Exhale slowly through your mouth until empty.","Repeat 2–3 times."],src:"Stanford breathing research"},

 {cat:"Focus",title:"Do one 90-minute deep work block",mins:"90 min",why:"Attention tends to run in roughly 90-minute cycles. One protected block usually beats a day of scattered half-focus.",how:["Pick one task and write the finish line down.","Phone in another room, notifications off.","Stop at 90 minutes and take a real break."],src:"Cal Newport / ultradian rhythm research"},

 {cat:"Energy",title:"Push your first coffee back an hour",mins:"0 min",why:"Some people find a later first coffee avoids the early-afternoon crash. It's worth testing on yourself.",how:["Drink water first thing instead.","Have coffee 60–90 minutes after waking and notice how 2 PM feels."],src:"Huberman Lab"},
 {cat:"Mind",title:"Write down three specific good things",mins:"3 min",why:"Specific gratitude (not generic) is one of the most replicated small habits for mood.",how:["Make them concrete: who, what, and why it mattered.","Do it at the same time each day."],src:"Positive psychology research"},

 {cat:"Calm",title:"Try 5 minutes of box breathing",mins:"5 min",why:"Even, slow breathing (4 in, 4 hold, 4 out, 4 hold) is a simple way to steady nerves before something stressful.",how:["Count 4 on each side of the box.","Breathe through your nose, shoulders relaxed."],src:"Used by Navy SEALs"},

function compactCfg(c){

/* Saving: the settings go up as a few small, self-contained pieces over GET
   (fn=save). Each piece is a valid partial config, and the backend's merge keeps
   whatever a piece doesn't mention, so the pieces add up to the whole without the
   backend having to reassemble anything. That works on every backend version
   (v3 onward) and needs no POST, which an iPad home-screen app doesn't send
   reliably. Only the pieces that differ from what the server last returned are
   sent, so a normal edit is one quick request. */
const SAVE_BUDGET=3200; /* encoded characters of data per request */
function cfgAtoms(c){
 const A=[];
 Object.keys(c.lists||{}).forEach(k=>A.push({g:"l",k,o:{lists:{[k]:c.lists[k]},listsAt:{[k]:c.listsAt[k]||0}}}));
 Object.keys(c.prefs||{}).forEach(k=>A.push({g:"p",k,o:{prefs:{[k]:c.prefs[k]},prefsAt:{[k]:c.prefsAt[k]||0}}}));
 Object.keys(c.dismissed||{}).forEach(k=>A.push({g:"d",k,o:{dismissed:{[k]:c.dismissed[k]}}}));
 Object.keys(c.saved||{}).forEach(k=>A.push({g:"s",k,o:{saved:{[k]:c.saved[k]}}}));

}
/* does the server already hold this exact piece? */
function atomOnServer(a,r){
 if(!r)return false;
 if(a.g==="l")return!!(r.lists&&a.k in r.lists)&&canon(r.lists[a.k])===canon(a.o.lists[a.k])&&(r.listsAt||{})[a.k]===a.o.listsAt[a.k];
 if(a.g==="p")return!!(r.prefs&&a.k in r.prefs)&&canon(r.prefs[a.k])===canon(a.o.prefs[a.k])&&(r.prefsAt||{})[a.k]===a.o.prefsAt[a.k];
 if(a.g==="d")return(r.dismissed||{})[a.k]===a.o.dismissed[a.k];

}
function packAtoms(atoms){

  if(cur){const t=JSON.parse(JSON.stringify(cur));add(t,a.o);if(size(t)<=SAVE_BUDGET){cur=t;return}parts.push(cur)}

}
let pushing=null;
async function pushCfg(){
 if(!backend())return;
 if(pushing){S.pushAgain=true;return pushing}

  try{
   let r=null;
   if(!todo.length)r=await be({fn:"config"}); /* nothing new to send: just confirm */

   for(const p of parts){
    const data=JSON.stringify(p);

   ================================================================= */
/* Opening grows the panel downward from its row, so nothing on screen moves.
   If another open section sits above, it closes instantly and the page is
   shifted by exactly its height, so the row you tapped stays under your finger. */
function closeEl(x,keepView){
 const b=$(".it-b",x),h=b.offsetHeight,top=x.getBoundingClientRect().top,sy=window.scrollY;
 if(keepView&&h){b.style.transition="none";$(".it-p",x).style.transition="none";x.classList.remove("open");void b.offsetHeight;window.scrollTo({top:Math.max(0,sy-h),behavior:"instant"});requestAnimationFrame(()=>{b.style.transition="";$(".it-p",x).style.transition=""})}
 else if(top<0&&h){/* its header is scrolled away: close at once and bring the header back to the top */b.style.transition="none";x.classList.remove("open");void b.offsetHeight;window.scrollTo({top:Math.max(0,sy+top-8),behavior:"instant"});requestAnimationFrame(()=>{b.style.transition=""})}
 else x.classList.remove("open");
 $(".it-h",x).setAttribute("aria-expanded","false");
}
/* Opening glides the page so the tapped title lands right under the status bar.
   A hand-rolled ease (fast start, soft landing) instead of the browser's smooth scroll:
   the target is re-measured every frame, so it still lands exactly while the panel
   above closes and this one grows. Any touch or wheel hands control back at once. */
let glideRAF=0;
const topInset=()=>{const b=$(".sbar");return b?b.offsetHeight:0};
function glideTo(el){
 cancelAnimationFrame(glideRAF);const r=document.documentElement;
 const goal=()=>Math.max(0,Math.round(el.getBoundingClientRect().top+window.scrollY-topInset()));
 const jump=y=>{r.style.scrollBehavior="auto";window.scrollTo(0,y)};
 if(matchMedia("(prefers-reduced-motion: reduce)").matches){jump(goal());r.style.scrollBehavior="";return}
 const y0=window.scrollY,t0=performance.now(),D=Math.min(760,Math.max(460,Math.abs(goal()-y0)*.6));
 const ease=t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;/* ease-in-out quart */
 let off=false;const stop=()=>{off=true;cancelAnimationFrame(glideRAF);r.style.scrollBehavior=""};
 addEventListener("touchstart",stop,{once:true,passive:true});addEventListener("wheel",stop,{once:true,passive:true});
 const step=now=>{if(off)return;const p=Math.min(1,(now-t0)/D);jump(y0+(goal()-y0)*ease(p));
  if(p<1)glideRAF=requestAnimationFrame(step);else{removeEventListener("touchstart",stop);removeEventListener("wheel",stop);r.style.scrollBehavior=""}};
 glideRAF=requestAnimationFrame(step);
}
const CONTENT_SEL="a,button,input,select,textarea,label,summary,[role=button],[contenteditable],.card,.vid,.mv,.art,.pin,.sheet,.toast,.topbar,.pinbar,.it-hd,svg,img,canvas,video,.chart,.rail,.chips,.hist,.fcs,.seg";
function isContent(t){
 if(!t||t.nodeType!==1)return true;
 if([...t.childNodes].some(n=>n.nodeType===3&&n.textContent.trim()))return true;
 for(let e=t;e&&e.nodeType===1;e=e.parentElement){
  if(e.matches(".it-p,.home,#app,body"))break;
  if(e.matches(CONTENT_SEL))return true;
  const cs=getComputedStyle(e);if(cs.backgroundImage!=="none"||!/^(transparent|rgba\(0, 0, 0, 0\))$/.test(cs.backgroundColor))return true;
 }
 return false;
}

 if(open){el.classList.add("open");$(".it-h",el).setAttribute("aria-expanded","true");RENDER[id]();requestAnimationFrame(()=>{$$(".rail",el).forEach(railArrows);placeThumb(id,true);glideTo(el)})}

/* =================================================================
   SWIPE BACK — drag an open section sideways to return to the list.
   The page rides on the finger like a sheet; underneath, a copy of
   the list (parked where you were before you tapped in) slides in with
   a little parallax, so letting go lands on exactly what you saw.
   A short or slow drag springs back. Rails, charts and other sideways
   controls keep their own swipes, except when the drag starts at the
   very edge of the screen, which always goes back. Two-finger swipes
   on a trackpad do the same thing.
   ================================================================= */
const SW={on:false,anim:false,pend:null,swallow:0};
const SW_EDGE=26,SW_PAR=.3;
function swBlocked(t){
 for(let e=t;e&&e.nodeType===1&&!e.matches(".home,body");e=e.parentElement){
  if(e.matches("input,textarea,select,[contenteditable],.chart,.it-o,.seg,[data-noswipe]"))return true;
  if(e.scrollWidth>e.clientWidth+1){const ox=getComputedStyle(e).overflowX;if(ox==="auto"||ox==="scroll")return true}

}
function swCanStart(t){

}
function swStart(el,sign){
 const W=innerWidth,H=innerHeight,home=$("#home"),hr=home.getBoundingClientRect();
 const homeTop=hr.top+window.scrollY;
 const extra=Math.max(0,document.documentElement.scrollHeight-(homeTop+home.offsetHeight));
 /* the list as it will look once this section is closed */
 const c=home.cloneNode(true);
 c.removeAttribute("id");c.inert=true;
 c.querySelectorAll(".it-b").forEach(n=>n.remove());
 c.querySelectorAll(".it.open").forEach(n=>n.classList.remove("open"));
 c.querySelectorAll("[id]").forEach(n=>{if(!(n instanceof SVGElement))n.removeAttribute("id")});
 const u=document.createElement("div");u.className="sw-under";u.setAttribute("aria-hidden","true");
 u.innerHTML='<div class="sw-in"></div><div class="sw-dim"></div>';
 const inn=u.firstChild;inn.appendChild(c);
 home.style.setProperty("--swl",hr.left+"px");home.style.setProperty("--swr",(W-hr.right)+"px");
 home.classList.add("sw-drag");
 document.body.appendChild(u);
 /* where the list lands: where you were, or with this row in easy view */
 const row=c.querySelector(`.it[data-it="${el.dataset.it}"]`),cr=c.getBoundingClientRect();
 const rowY=homeTop+(row?row.getBoundingClientRect().top-cr.top:0),rowH=row?row.offsetHeight:0;
 const maxY=Math.max(0,Math.round(homeTop+c.offsetHeight+extra-H));
 let y=S.homeY;if(y==null||rowY<y||rowY+rowH>y+H)y=rowY-H*.3;
 y=Math.max(0,Math.min(maxY,Math.round(y)));
 inn.style.top=(homeTop-y)+"px";
 cancelAnimationFrame(glideRAF);
 Object.assign(SW,{on:true,el,home,u,inn,dim:u.lastChild,sign,W,y,dx:0,raw:0,samples:[]});
 swPaint(0);
}
function swPaint(dx){
 const{home,inn,dim,sign,W}=SW;SW.dx=dx;const p=Math.min(1,Math.abs(dx)/W);

 inn.style.transform=`translate3d(${(-sign*(1-p)*SW_PAR*W).toFixed(1)}px,0,0)`;

}
function swMove(raw){
 const{sign,W}=SW;let dx=sign>0?Math.max(0,raw):Math.min(0,raw);
 if(Math.abs(dx)>W)dx=sign*W;

}
function swVel(fresh){
 const a=SW.samples;if(a.length<2)return 0;const l=a[a.length-1];
 if(fresh&&performance.now()-l[0]>70)return 0;/* finger paused before letting go */
 const f=a[0];return l[0]>f[0]?(l[1]-f[1])/(l[0]-f[0]):0;
}
function swEnd(fresh){
 if(!SW.on||SW.anim)return;
 const{sign,W,dx}=SW,v=swVel(fresh),d=sign*dx,sv=sign*v;

function swAnim(to,v,go){
 SW.anim=true;const from=SW.dx,dist=Math.abs(to-from),t0=performance.now();

 const ease=t=>1-Math.pow(1-t,3);
 const step=now=>{const p=Math.min(1,(now-t0)/D);swPaint(from+(to-from)*ease(p));
  if(p<1)requestAnimationFrame(step);else go?swLand():swDone()};

}
function swDone(){
 const{home,u}=SW;
 home.classList.remove("sw-drag");home.style.transform="";home.style.removeProperty("--swl");home.style.removeProperty("--swr");
 u.remove();Object.assign(SW,{on:false,anim:false,el:null,home:null,u:null,inn:null,dim:null,samples:[]});
}
function swLand(){
 const{el,y}=SW,r=document.documentElement;
 /* close in one frame, behind the copy, so the swap is invisible */
 el.classList.add("sw-still");
 el.classList.remove("open");$(".it-h",el).setAttribute("aria-expanded","false");
 S.open=null;S.homeY=null;
 try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}

document.addEventListener("touchstart",e=>{

document.addEventListener("touchmove",e=>{

/* trackpad: two-finger swipe */
addEventListener("wheel",e=>{
 const now=performance.now(),ax=Math.abs(e.deltaX),ay=Math.abs(e.deltaY);

function smoothPath(P){if(P.length<2)return"";let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function drawSky(){
 const host=$("#sky-plot");const w=S.wx;if(!host||!w||!w.win||w.win.length<3)return;
 const W=host.clientWidth,H=86,top=20,bot=62,n=w.win.length;
 const ts=w.win.map(p=>p.temp);let mn=Math.min(...ts),mx=Math.max(...ts);if(mx-mn<6){const c=(mx+mn)/2;mx=c+3;mn=c-3}
 const X=i=>i/(n-1)*W,Y=t=>top+(1-(t-mn)/(mx-mn))*(bot-top);
 const P=w.win.map((p,i)=>[X(i),Y(p.temp)]);const d=smoothPath(P);
 const t0=Date.parse(w.win[0].t+":00Z");const span=(n-1)*36e5;
 const nowPseudo=Date.parse(w.now+":00Z");
 const fx=v=>Math.max(0,Math.min(1,(v-t0)/span));
 const nx=fx(nowPseudo)*W;const ni=Math.min(n-1,Math.floor(fx(nowPseudo)*(n-1)));const nf=fx(nowPseudo)*(n-1)-ni;
 const ny=ni<n-1?P[ni][1]+(P[ni+1][1]-P[ni][1])*nf:P[n-1][1];
 const imax=ts.indexOf(Math.max(...ts)),imin=ts.indexOf(Math.min(...ts));
 const bars=w.win.map((p,i)=>p.pp>=15?`<rect x="${(X(i)-2.5).toFixed(1)}" y="${(H-2-12*p.pp/100).toFixed(1)}" width="5" height="${(12*p.pp/100).toFixed(1)}" rx="2" fill="#fff" opacity=".45"/>`:"").join("");
 const marks=[];
 for(const [lab,s] of [["Sunrise",w.sunrise],["Sunset",w.sunset],["Sunrise",w.sunrise2],["Sunset",w.sunset2]]){if(!s)continue;const v=Date.parse(s+":00Z");if(v>t0&&v<t0+span){const x=fx(v)*W;if(Math.abs(x-nx)<40)continue;marks.push(`<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="6" y2="${H}" stroke="#fff" stroke-opacity=".28" stroke-dasharray="2 3"/><text x="${Math.min(W-30,Math.max(30,x)).toFixed(1)}" y="2" text-anchor="middle" font-size="10.5" font-weight="600" fill="#fff" fill-opacity=".8">${lab} ${hmLabel(s).replace(":00","")}</text>`)}}
 const lab=(i,above)=>{const x=Math.min(W-12,Math.max(12,P[i][0]));const y=above?P[i][1]-8:P[i][1]+17;return`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">${ts[i]}°</text>`};
 const ax=[];w.win.forEach((p,i)=>{const hh=+p.t.slice(11,13);if(i>0&&i<n-1&&hh%3===0){const x=X(i);if(Math.abs(x-nx)>26)ax.push(`<span style="left:${(x/W*100).toFixed(2)}%">${hh%12||12}${hh<12?"AM":"PM"}</span>`)}});
 host.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="skyfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>${marks.join("")}<path d="${d} L${W},${bot+12} L0,${bot+12}Z" fill="url(#skyfill)"/><path d="${d}" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>${bars}${imax!==imin?(Math.abs(P[imax][0]-nx)>30?lab(imax,true):"")+(Math.abs(P[imin][0]-nx)>30?lab(imin,false):""):""}<line x1="${nx.toFixed(1)}" x2="${nx.toFixed(1)}" y1="${(ny+7).toFixed(1)}" y2="${H}" stroke="#fff" stroke-opacity=".55" stroke-width="1.5"/><circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="5.5" fill="#fff"/><circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="10" fill="#fff" fill-opacity=".22"/></svg><div class="sky-ax"><span style="left:${(nx/W*100).toFixed(2)}%">Now</span>${ax.join("")}</div>`;
}

function evWhen(e){

 if(hrs>=20)return`${fmtTime(e.s,z)} – ${e.en.toLocaleDateString("en-US",{weekday:"short",timeZone:z})} ${fmtTime(e.en,z)}${suf}`;

}

function sma(a,n){const out=[];let s=0;for(let i=0;i<a.length;i++){s+=a[i].v;if(i>=n)s-=a[i-n].v;if(i>=n-1)out.push({t:a[i].t,v:s/n})}return out}
function ema(a,n){const out=[];const k=2/(n+1);let e=null;for(let i=0;i<a.length;i++){e=e==null?a[i].v:a[i].v*k+e*(1-k);if(i>=n-1)out.push({t:a[i].t,v:e})}return out}

/* AROUND THE BAY — this weekend (Fri–Sun) or, from Friday on, what's left of it.
   Each item is pinned to the day inside that window it applies to, so a run that
   started weeks ago (a play, a haunted house) shows as the day you'd go, and anything
   outside the window stays out. */
function bayWindow(){
 const tk=todayKey(),dow=keyDate(tk).getUTCDay();/* 0 Sun … 6 Sat */
 const fri=dow<=4?addDays(tk,5-dow):dow===5?tk:null;
 const start=dow>=5||dow===0?tk:fri,end=dow===0?tk:addDays(fri||tk,dow===6?1:2);
 return{start,end,label:start===end?relDay(start):`${fmtKey(start,{weekday:"short"})}–${fmtKey(end,{weekday:"short"})} · ${fmtKey(start,{month:"short",day:"numeric"})}–${fmtKey(end,{day:"numeric"})}`};
}
function bayItems(){
 const b=DATA.bay||{},w=bayWindow();
 return(b.items||[]).map(it=>{
  const s=it.date,e=it.endDate||it.date;if(!s)return null;
  const cs=it.cal&&it.cal.start?it.cal.start.slice(0,10):"";
  /* the day to show: the calendar day if it's inside the window, else the first window day the run covers */

 function vital_(o){
  const pts=HDAYS.slice(0,Tidx+1).filter(r=>r[o.key]).slice(-7);
  const v=T[o.key];if(!v)return`<div class="card hx-v"><div class="hx-h"><span class="hx-ic"><svg class="i s14"><use href="#${o.icon}"/></svg></span><span class="hx-t">${o.name}</span></div><p class="hx-empty">No reading last night.</p></div>`;
  const prior=pts.filter(r=>r!==T).map(r=>r[o.key]);
  const m=prior.length?mean_(prior):null,s=prior.length>=3?Math.max(sd_(prior),o.minSd):o.minSd;
  const st=o.status(v,m);
  const all=pts.map(r=>r[o.key]).concat(m!=null?[m-s,m+s]:[]);
  let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo||1)*.18;lo-=pad;hi+=pad;
  const n=pts.length,X=i=>n===1?50:4+i/(n-1)*92,Y=val=>(1-(val-lo)/(hi-lo))*100;
  let svg=`<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">`;
  if(m!=null)svg+=`<rect x="0" y="${Y(m+s)}" width="100" height="${Y(m-s)-Y(m+s)}" fill="var(--fill-2)" rx="0"/>`;
  if(o.ref!=null&&o.ref>lo&&o.ref<hi)svg+=`<line x1="0" x2="100" y1="${Y(o.ref)}" y2="${Y(o.ref)}" stroke="var(--ink-3)" stroke-width="1" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`;
  if(n>1)svg+=`<polyline points="${pts.map((r,i)=>X(i)+","+Y(r[o.key])).join(" ")}" fill="none" stroke="var(--ink-2)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`;
  svg+=`</svg>`;
  const dots=pts.map((r,i)=>`<span class="hx-dot${r===T?" today "+st[1]:""}" style="left:${X(i)}%;top:${Y(r[o.key])}%" tabindex="0" data-t="${day_(r.d)}<span>${o.fmt(r[o.key])} ${o.unit}</span>"></span>`).join("");
  const d=m!=null?v-m:null;
  return`<div class="card hx-v"><div class="hx-h"><span class="hx-ic"><svg class="i s14"><use href="#${o.icon}"/></svg></span><span class="hx-t">${o.name}</span></div>
   <div class="hx-vv">${o.fmt(v)}<small>${o.unit}</small></div>
   <div class="hx-vs"><i class="${st[1]}"></i>${st[0]}${d!=null&&Math.abs(d)>=o.eps?`<span class="m2">${d>0?"+":"−"}${o.fmt(Math.abs(d))} vs avg</span>`:d!=null?`<span class="m2">at your avg</span>`:""}</div>
   <div class="hx-sp" data-t="${o.name}<span>${o.help}</span>">${svg}${dots}</div></div>`;
 }

/* MOVIES — what's playing now and what's coming */
const tixUrl=m=>m.url||`https://www.fandango.com/search?q=${encodeURIComponent(m.title)}`;
const trailerUrl=m=>m.trailer||`https://www.youtube.com/results?search_query=${encodeURIComponent(m.title+" official trailer")}`;
const scoreChip=m=>m.tmdb?`<span class="score" title="TMDB audience score">★ ${(+m.tmdb).toFixed(1)}</span>`:m.score!=null?`<span class="score ${m.score>=60?"fresh":"rot"}" title="Rotten Tomatoes">${m.score>=60?"🍅":"🤢"} ${m.score}%</span>`:"";
const PAL=[["#7A2E3A","#2A0F1E"],["#1F4E79","#0B1A2E"],["#6B4F1D","#21170A"],["#2E5E4E","#0C1F1A"],["#4B2E83","#160D2B"],["#8A3B12","#2A1006"],["#1E5C6B","#0A2127"],["#5A5A63","#1A1A1F"]];
const initials=t=>String(t).replace(/^(The|A|An) /i,"").split(/[\s:\-]+/).filter(w=>/^[A-Za-z0-9]/.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase();
/* posters carry no text: without artwork they show a plain tile with a film icon */
function poster(m,mini){const c=PAL[hash(m.title)%PAL.length];return`<div class="pst ${mini?"mini-pst":""}" style="--p1:${c[0]};--p2:${c[1]}">${I.film}${m.poster?`<img src="${esc(m.poster)}" alt="" loading="lazy" onerror="this.remove()">`:""}</div>`}
/* movie options (synced): how many, order, how long a film still counts as "in theaters",
   window for coming soon, big releases only, minimum score, hidden genres, where showtimes open, your ZIP */
const MV_DEF={n:12,sort:"newest",win:45,soon:90,bigOnly:false,min:0,fresh:true,hide:[],zip:"94040",via:"fandango"};
const mvPrefs=()=>({...MV_DEF,...pref("movies",{})});
function setMvPref(k,v){setPref("movies",{...mvPrefs(),[k]:v});renderMovies();renderTeasers();refreshSettings()}
const mvGenres=x=>x.genres&&x.genres.length?x.genres:String(x.genre||"").split(/\s*[·,/]\s*/).filter(Boolean);
const mvZip=()=>String(mvPrefs().zip||"94040").replace(/\D/g,"").slice(0,5)||"94040";
/* showtimes near him: Fandango by ZIP, or a Google search that lists every theater */
const showtimesUrl=t=>{const z=mvZip();if(mvPrefs().via==="google")return"https://www.google.com/search?q="+encodeURIComponent((t?t+" ":"")+"showtimes near "+z);return t?`https://www.fandango.com/search?q=${encodeURIComponent(t)}&zip=${z}`:`https://www.fandango.com/${z}_movietimes`};
function mvData(){const m=S.mv||DATA.movies||{};const tk=todayKey();const P=LS.get("sd-poster",{});const o=mvPrefs();const hide=new Set(o.hide.map(norm));
 const fix=x=>({...x,poster:x.poster||P[x.title]||""});
 const keep=x=>!isDis("mv:"+x.title)&&!mvGenres(x).some(g=>hide.has(norm(g)));
 const okScore=x=>!o.min||x.tmdb==null||x.tmdb>=o.min;
 const isNew=x=>x.released&&dayDiff(x.released,tk)<=7;
 /* "in theaters" means it opened within the window and isn't a future date; older runs only count if the data says they're still playing */
 const inRun=x=>{const r=x.released||x.date;if(!r)return true;const d=dayDiff(r,tk);return d>=0&&(d<=o.win||x.stillPlaying)};
 let now=(m.now||[]).filter(x=>keep(x)&&okScore(x)&&inRun(x));
 const order={popular:(a,b)=>(b.pop||0)-(a.pop||0)||String(b.released).localeCompare(String(a.released)),newest:(a,b)=>String(b.released||"").localeCompare(String(a.released||"")),rated:(a,b)=>(b.tmdb||b.score||0)-(a.tmdb||a.score||0)}[o.sort];
 if(order&&(o.sort!=="popular"||now.some(x=>x.pop)))now=now.slice().sort(order);
 let shown=now.slice(0,o.n);
 if(o.fresh){const extra=now.filter(x=>isNew(x)&&!shown.includes(x));shown=shown.concat(extra)}
 const until=addDays(tk,o.soon);
 const soon=(m.soon||[]).filter(x=>x.date>=tk&&x.date<=until&&keep(x)&&(!o.bigOnly||x.big)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,Math.max(o.n,8));
 return{now:shown.map(fix),soon:soon.map(fix),live:!!S.mv,total:now.length}}

 const el=$("#s-movies");if(!el)return;const tk=todayKey();const{now,soon,live,total}=mvData();const o=mvPrefs();
 const nowChip=x=>{if(!x.released)return"";const d=dayDiff(x.released,tk);return d<=3?`<span class="cd now"><i></i>New</span>`:d<7?`<span class="cd soon">Opened ${esc(fmtKey(x.released,{weekday:"short"}))}</span>`:`<span class="cd">Week ${Math.floor(d/7)+1}</span>`};
 el.innerHTML=`<div class="sh"><span class="aux"><button class="aux" data-act="settings-movies">Movie settings</button> · <a class="aux" href="${esc(showtimesUrl(""))}" target="_blank" rel="noopener">Showtimes near ${esc(mvZip())}</a></span></div>
 ${now.length?`<div class="grp-t">In theaters<span>${now.length}${live?" of "+total+" · TMDB":""} · last ${o.win} days</span></div><div class="mv-rail noscroll">${now.map(x=>`<article class="mv">${poster(x)}<h3>${esc(x.title)}</h3><div class="meta">${esc([x.rating,x.genre,x.runtime?durText(x.runtime*60):""].filter(Boolean).join(" · "))}</div><div class="chips2">${nowChip(x)}${scoreChip(x)}</div>${x.blurb?`<p class="clamp3">${esc(x.blurb)}</p>`:""}<div class="acts">${ib(showtimesUrl(x.title),I.ticket,"Showtimes & tickets","pri")}${ib(trailerUrl(x),I.play,"Watch trailer")}${gBtn(x.title+" "+String(x.released||x.date||"").slice(0,4)+" movie")}${pinBtn("mv:"+x.title,{kind:"mv",title:x.title,sub:["In theaters",x.rating].filter(Boolean).join(" · "),img:x.poster,url:showtimesUrl(x.title)})}${dxBtn("mv:"+x.title,"movies",x.title)}</div></article>`).join("")}</div>`:""}
 ${soon.length?`<div class="grp-t">Coming soon<span>${soon.length}${o.bigOnly?" · big releases":""}</span></div>${cols(soon.map(x=>`<article class="ev2">${poster(x,true)}<div class="ev2-x"><div class="chips2" style="margin:0 0 6px">${cdChip(x.date,null,"Opens ")}<span class="cd">${esc(fmtKey(x.date,{month:"short",day:"numeric"}))}</span>${x.big?`<span class="tagc list">Big one</span>`:""}</div><h3>${esc(x.title)}</h3>${x.genre?`<div class="where">${esc(x.genre)}</div>`:""}${x.blurb?`<p class="clamp3">${esc(x.blurb)}</p>`:""}<div class="acts">${ib(tixUrl(x),I.ticket,x.presale?"Pre-sale tickets":"Tickets","pri")}${ib(trailerUrl(x),I.play,"Watch trailer")}${calBtn("🎬 "+x.title+" opens",{date:x.date,tips:x.blurb||""},tixUrl(x))}${gBtn(x.title+" "+String(x.date).slice(0,4)+" movie")}${pinBtn("mv:"+x.title,{kind:"mv",title:x.title,sub:"Opens "+fmtKey(x.date,{month:"short",day:"numeric"}),img:x.poster,date:x.date,url:tixUrl(x)})}${dxBtn("mv:"+x.title,"movies",x.title)}</div></div></article>`))}`:""}
 ${!now.length&&!soon.length?`<div class="card"><div class="empty-row">No movies listed today.</div></div>`:""}`;
}
/* Movies come live from TMDB through the backend (when a TMDB_KEY script property is set);
   otherwise from the morning data, with posters looked up on Wikipedia. */
async function loadMovies(force){
 const c=LS.get("sd-mv2",null);
 if(!force&&c&&Date.now()-c.t<3*36e5)S.mv=c.v;
 else if(backend()){try{const r=await be({fn:"movies"},25000);if(r.now){const big=new Set(((DATA.movies||{}).soon||[]).filter(x=>x.big).map(x=>norm(x.title)));(r.soon||[]).forEach(x=>{if(big.has(norm(x.title)))x.big=true});S.mv={now:r.now,soon:r.soon||[]};S.mvErr="";LS.set("sd-mv2",{t:Date.now(),v:S.mv})}}catch(e){S.mvErr=e.message}}
 renderMovies();renderTeasers();
 if(!S.mv)loadPosters();
}
async function loadPosters(){
 const c=LS.get("sd-poster",{});const m=DATA.movies||{};const all=[...(m.now||[]),...(m.soon||[])].filter(x=>!x.poster&&c[x.title]==null);if(!all.length)return;
 await Promise.all(all.map(async x=>{const y=(x.released||x.date||"").slice(0,4);let net=false;
  for(const t of[`${x.title} (${y} film)`,`${x.title} (film)`,x.title]){try{const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t.replace(/ /g,"_")));if(!r.ok)continue;const j=await r.json();if(j.type==="disambiguation"||!/film/i.test(j.description||""))continue;const u=(j.thumbnail&&j.thumbnail.source)||"";if(u){c[x.title]=u;return}}catch(e){net=true}}
  if(!net)c[x.title]="";}));
 LS.set("sd-poster",c);renderMovies();
}

 addEventListener("touchmove",e=>{if(y0==null)return;if(SW.on){y0=null;ind.style.opacity=0;ind.classList.remove("ready");return}pull=e.touches[0].clientY-y0;if(pull<=0){ind.style.opacity=0;return}const p=Math.min(1,pull/110);ind.style.opacity=p;ind.style.transform=`translateY(${(-24+p*34).toFixed(1)}px) rotate(${Math.round(p*300)}deg)`;ind.classList.toggle("ready",p>=1)},{passive:true});
 addEventListener("touchend",()=>{if(y0==null)return;if(pull>=110){ind.classList.add("spin");setTimeout(fresh,300)}else{ind.style.opacity=0;ind.classList.remove("ready")}y0=null},{passive:true});
})();

/* =================================================================
   FRESHNESS — home-screen apps resume a frozen copy.
   ================================================================= */
const SELF=location.href.split("#")[0].split("?")[0];
const loadedDay=todayKey();
function fresh(){const go=()=>location.replace(SELF+"?v="+Date.now());if(!cfg().dirty||!backend())return go();Promise.race([flushCfg(),new Promise(r=>setTimeout(r,4000))]).then(go,go)}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){hiddenAt=Date.now();stopWs();flushCfg();return}const away=hiddenAt?Date.now()-hiddenAt:0;if(away>10*6e4||todayKey()!==loadedDay)fresh();else{startWs();if(away>60e3){renderHero();loadLive()}else if(away>5e3)pullCfg()}});
addEventListener("pageshow",e=>{if(e.persisted)fresh()});
addEventListener("pagehide",()=>{flushCfg()});
/* pick up changes made on your other devices while this one stays open */
setInterval(()=>{if(!document.hidden&&!pushing&&backend())pullCfg()},90e3);
try{if(ED<todayKey()&&sessionStorage.getItem("sd-retry")!==todayKey()){sessionStorage.setItem("sd-retry",todayKey());fresh()}}catch(e){}

/* =================================================================
   BOOT
   ================================================================= */
function loadLive(){
 loadWeather().catch(()=>{});
 loadCx().then(startWs);
 loadYouTube(false);
 checkVersion();
 loadSpotify(false).then(loadSpArt);
 loadMovies(false);
 loadLiveTv(false);
 loadMusicArt();
 pingBackend();
 loadTasks(false);
 if(backend()){loadStQuotes().then(()=>{if(!isCx())return loadMkSeries()}).catch(()=>{});pullCfg()}
}
/* timers: weather every 10 min, stocks every minute, crypto fallback poll */
setInterval(()=>{if(!document.hidden)loadWeather().catch(()=>{})},10*6e4);
setInterval(()=>{if(!document.hidden)checkVersion()},5*6e4);
setInterval(()=>{if(!document.hidden)renderFoot()},30e3);
setInterval(()=>{if(document.hidden)return;const live=S.live&&S.live.items||[];if(S.open==="live"&&(live.some(x=>x.state==="in")||Date.now()-(S.live&&S.live.at||0)>20*6e4))loadLiveTv(true)},2*6e4);
setInterval(()=>{if(!document.hidden&&backend())loadStQuotes()},60e3);
setInterval(()=>{if(!document.hidden&&!S.cx.liveOn)loadCxQuotes().then(()=>cxList().forEach(applyTick)).catch(()=>{});if(!document.hidden&&!S.cx.ws)startWs()},60e3);
/* the readouts follow the live loaders */
renderWatch=(f=>function(){f();renderTeasers()})(renderWatch);
renderListen=(f=>function(){f();renderTeasers()})(renderListen);
renderStocks=(f=>function(){f();renderTeasers()})(renderStocks);
(async function boot(){
 applyTheme();
 await Promise.all([fetchData(),fetchHealth()]);
 initData();
 const w=LS.get("sd-wx",null);if(w&&w.day===todayKey()&&Date.now()-w.t<36e5&&w.geo===geoOn())S.wx=w.v;
 const q=LS.get("sd-cx-q",null);if(q&&Date.now()-q.t<6*36e5){S.cx.q=q.v;S.cx.qAt=q.t}
 if(!cxList().includes(S.cx.sel))S.cx.sel=cxList()[0]||"BTC";
 mkValid();
 [S.cx.sel+"|"+S.cx.range].forEach(k=>{const c=LS.get("sd-cx-s-"+k,null);if(c&&Date.now()-c.t<6*36e5)S.cx.series[k]=c.v});
 const d=LS.get("sd-cx-d-"+S.cx.sel,null);if(d&&Date.now()-d.t<24*36e5)S.cx.daily[S.cx.sel]=d.v;
 if(!backend()&&!["1W","1M"].includes(S.st.range))S.st.range="1M";
 try{navigator.permissions&&navigator.permissions.query({name:"geolocation"}).then(p=>{if(p.state==="granted"&&!geoOn()&&!("geo" in cfg().prefs)&&LS.get("sd-geo-auto",true)){setPref("geo",true);LS.set("sd-geo-auto",false);loadWeather().catch(()=>{})}}).catch(()=>{})}catch(e){}
 migrateSaved();shell();renderAll();loadLive();
})();
</script>
