<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily">
<title>Stinky's Daily</title>
</head>
<body style="margin:0;padding:80px 24px;background:#F1F2F4;color:#565B63;font:16px -apple-system,BlinkMacSystemFont,sans-serif">
<p id="msg">Loading…</p>
<script>
/* Temporary loader: rebuilds the full page from the last good version in the repo history. */
(async()=>{
 const R="stinky-sudo/daily",S="/*DATA:"+"START*/",E="/*DATA:"+"END*/";
 const ext=document.getElementById("today-data");
 const r=await fetch("https://api.github.com/repos/"+R+"/commits?path=index.html&per_page=20",{cache:"no-store"});
 const list=await r.json();
 for(const c of list){
  const t=await (await fetch("https://raw.githubusercontent.com/"+R+"/"+c.sha+"/index.html")).text();
  const a=t.indexOf(S),b=t.indexOf(E);
  if(t.length>100000&&a>0&&b>a&&t.includes("</html>")){
   const html=ext?t.slice(0,a)+ext.textContent.trim()+t.slice(b+E.length):t;
   document.open();document.write(html);document.close();return;
  }
 }
 throw new Error("no full version found");
})().catch(e=>{document.getElementById("msg").textContent="Couldn't load today's page ("+e.message+"). Pull down to retry."});
</script>
</body>
</html>
