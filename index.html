"btc":{"source":"Benjamin Cowen","sourceUrl":"https://x.com/benjamincowen/status/2108222983865319933","summary":"In an October 8 post on X, Cowen said that if Bitcoin \"accepts back below the range,\" Q4 2026 could shape up the way Q4 has historically gone in midterm years, and warned that markets always find a way to convince people \"this time is different.\" That is a conditional warning, not a new bottom call: it follows his September retreat from the October cycle-low prediction after the rebound from the roughly $58.5K low on June 30. In his summer notes he had kept a smaller chance of one more Q4 drop toward about $44K, and said two weekly closes above the 50-week SMA near $86.5K would be needed to confirm the bottom. So he still sees Q4 as a live risk window, and the level to watch is whether price holds its recent range.","summaryDate":"2026-10-08"},
"news":[{"id":"n1","tag":"Robotics","title":"BYD's first humanoid shows up in a design patent","blurb":"China's patent office published a BYD design patent for an \"embodied intelligent robot\" on October 9: a biped with articulated fingers, an oval dark-faced head and light torso panels. The robot BYD said it would unveil in August still has not formally launched.","src":"CnEVPost","domain":"cnevpost.com","date":"2026-10-09","url":"https://cnevpost.com/2026/10/09/byd-humanoid-robot-design-emerges/","ask":"If BYD puts its car supply chain behind a humanoid, which parts of the bill of materials could it make cheaper than a robotics-first company, and which parts would still be hard?"},{"id":"n2","tag":"Robotics","title":"Boston Dynamics explains why the new Atlas hand has four fingers","blurb":"In an interview with The Robot Report, Boston Dynamics said it dropped the pinky and shrank the gripper for the 13-DOF Atlas hand. The hand was built for mass manufacturing and for high-fidelity simulation to support sim-to-real reinforcement learning.","src":"The Robot Report","domain":"therobotreport.com","date":"2026-10-09","url":"https://www.therobotreport.com/boston-dynamics-gives-more-insight-into-its-redesigned-humanoid-hand/","ask":"What do you actually lose in grasp taxonomy and in-hand reorientation by going from five fingers to four, and how would I test whether it matters for our task mix?"},{"id":"n3","tag":"Robotics","title":"Physical AI raised about $48B this year, much of it chasing training data","blurb":"The FT, citing PitchBook, reports that robotics and physical AI companies have raised about $48 billion so far in 2026. Labs are filling the data gap with robot gyms and cameras placed in homes, offices and factories to record people doing tasks.","src":"Financial Times (via Techmeme)","domain":"techmeme.com","date":"2026-10-11","url":"https://www.techmeme.com/261011/p6","ask":"How does the value of an hour of egocentric human video compare with an hour of te uth Korea by 2028.","src":"TechCrunch","domain":"techcrunch.com","date":"2026-10-09","url":"https://techcrunch.com/2026/10/09/xonas-commercial-gps-alternative-is-about-to-go-live/","ask":"Would a stronger, harder-to-jam LEO positioning signal matter for outdoor mobile robots, or is GNSS rarely the limiting factor compared with local perception?"}],
